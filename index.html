    }
  },
  'cancelar-lote': () => { if (estado.lote) estado.lote.cancelado = true; },
  'nota': b => {
    const caixa = b.closest('[data-nota-entrada]');
    const v = Number(b.dataset.valor) || 0;
    caixa.querySelector('[name="nota"]').value = v || '';
    caixa.querySelector('.estrelas').style.setProperty('--v', v);
    caixa.querySelector('.nota-texto').textContent = v ? numero(v, v % 1 ? 1 : 0) : 'Sem nota';
  },
  'adicionar-autor': b => {
    const lista = b.closest('form').querySelector('[data-autores]');
    lista.insertAdjacentHTML('beforeend', autorLinhaHTML({ nome: '', papel: 'autor', sobrenome: '' }));
    lista.lastElementChild.querySelector('input').focus();
  },
  'remover-autor': b => {
    const lista = b.closest('[data-autores]');
    if (lista.children.length > 1) b.closest('.autor-linha').remove();
    else b.closest('.autor-linha').querySelectorAll('input').forEach(i => { i.value = ''; });
    atualizarPreviaCapa(lista.closest('form'));
  },
  'escolher-capa': b => b.closest('form').querySelector('[data-arquivo-capa]').click(),
  'remover-capa': b => { estado.formulario.capa = ''; atualizarPreviaCapa(b.closest('form')); },
  'buscar-isbn': b => preencherPorISBN(b.closest('form')),
  'ordenar-todos': b => {
    const ordem = b.dataset.ordem;
    if (estado.todos.ordem === ordem) estado.todos.dir *= -1;
    else { estado.todos.ordem = ordem; estado.todos.dir = 1; }
    render();
  },
  'visao-biblioteca': b => { estado.biblioteca.visao = b.dataset.visao; render(); },
  'visao-todos': b => { estado.todos.visao = b.dataset.visao; render(); },
  'alternar-filtros': () => { estado.todos.filtrosAbertos = !estado.todos.filtrosAbertos; render(); },
  'ano-estatisticas': b => { estado.estatisticas.ano = b.dataset.ano; render(); },
  'ver-sem-paginas': () => {
    Object.assign(estado.todos, { busca: '', tipo: '', status: '', categoria: '', semPaginas: true, visao: 'lista' });
    irPara('todos');
  },
  'limpar-sem-paginas': () => { estado.todos.semPaginas = false; atualizarResultados(); },
  'aviso-acao': () => { $('#aviso').hidden = true; if (estado.avisoFn) estado.avisoFn(); },
  'fechar-modal': () => fecharModal(),
  'recuperar-rascunho': () => recuperarRascunho(),
  'descartar-rascunho': () => descartarRascunho(),
};

const FORMULARIOS = {
  livro: enviarFormularioLivro,
  terminar: enviarTerminar,
  comecar: enviarComecar,
  emprestar: enviarEmprestar,
  devolucao: enviarDevolucao,
  chegou: enviarChegou,
  meta: enviarMeta,
  emprestimo: enviarEmprestimo,
  'arquivo-novo': form => criarArquivoNoOneDrive(form),
};

function mudarCategoria(campo) {
  const c = categoriaPorId(campo.dataset.id);
  if (!c) return;
  const nome = campo.dataset.catCampo;
  let valor = campo.value;
  if (nome === 'nome') {
    valor = valor.trim();
    if (!valor) { campo.value = c.nome; return; }
  }
  if (nome === 'descricao') valor = valor.trim();
  if (nome === 'cor') valor = corSegura(valor, c.cor);
  if (c[nome] === valor) return;
  alterar(() => { c[nome] = valor; }, { mensagem: 'Categoria atualizada' });
}

async function guardarETestarChave() {
  const campo = document.querySelector('[data-chave-google]');
  const valor = ((campo && campo.value) || '').trim();
  const anterior = (dados.preferencias && dados.preferencias.chaveGoogle) || '';
  try { localStorage.removeItem('minha-biblioteca:chave-google'); } catch (e) { /* ignora */ }
  estado.googleIndisponivel = false;
  estado.erroGoogle = '';
  if (valor !== anterior) alterar(() => { dados.preferencias.chaveGoogle = valor; });
  const situacao = () => document.querySelector('[data-situacao-chave]');
  if (!valor) {
    if (situacao()) situacao().textContent = 'Nenhuma chave guardada.';
    avisar(gravaSozinho() ? 'Chave do Google Books removida.' : 'Chave do Google Books removida. Use Salvar para gravar no arquivo.');
    return;
  }
  if (situacao()) situacao().textContent = 'Testando a chave…';
  const final = valor !== anterior ? ' Use Salvar para gravar no arquivo.' : '';
  try {
    const r = await obterJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:9788535909555&key=${encodeURIComponent(valor)}`, { tentativas: 1 });
    const titulo = r && r.items && r.items[0] && r.items[0].volumeInfo && r.items[0].volumeInfo.title;
    const texto = titulo ? `Chave guardada e funcionando: o Google Books respondeu com ${titulo}.` : 'Chave guardada e aceita pelo Google.';
    if (situacao()) situacao().textContent = texto;
    avisar(texto + final);
  } catch (e) {
    const texto = `Chave guardada, mas o teste falhou. ${explicarErroGoogle(e)}`;
    if (situacao()) situacao().textContent = texto;
    avisar(texto + final, { tempo: 12000 });
  }
}

/* ===== Eventos ===== */

function ligarEventos() {
  let temporizadorPrevia = null;

  document.addEventListener('click', e => {
    const buscaCapa = e.target.closest('[data-alvo-capa]');
    if (buscaCapa) {
      estado.alvoCapa = buscaCapa.dataset.alvoCapa;
      situacaoCapa(estado.alvoCapa, 'Copie a imagem da capa e volte para esta janela: clique em Colar imagem ou aperte Ctrl+V.');
      return;
    }
    const linkForm = e.target.closest('[data-link-busca-capa]');
    if (linkForm) {
      const form = linkForm.closest('form');
      linkForm.href = linkBuscaCapa({
        titulo: form.querySelector('[name="titulo"]').value.trim(),
        autores: lerAutores(form),
        isbn: normalizarISBN(form.querySelector('[name="isbn"]').value) || '',
      });
      return;
    }
    const alvo = e.target.closest('[data-acao]');
    if (!alvo || alvo.disabled) return;
    const acao = ACOES[alvo.dataset.acao];
    if (!acao) return;
    e.preventDefault();
    acao(alvo, e);
  });

  document.addEventListener('submit', e => {
    const enviar = FORMULARIOS[e.target.dataset.form];
    if (!enviar) return;
    e.preventDefault();
    enviar(e.target);
  });

  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.filtro === 'biblioteca-busca') { estado.biblioteca.busca = el.value; atualizarResultados(); }
    if (el.dataset.filtro === 'todos-busca') { estado.todos.busca = el.value; atualizarResultados(); }
    if (el.name === 'autor-sobrenome') delete el.dataset.auto;
    const campoAuto = el.closest && el.closest('.campo.auto');
    if (campoAuto) campoAuto.classList.remove('auto');
    const formIsbn = el.name === 'isbn' && el.closest('form[data-form="livro"]');
    if (formIsbn) {
      clearTimeout(estado.temporizadorIsbn);
      const isbn = normalizarISBN(el.value);
      if (isbn && isbnValido(el.value) && isbn !== formIsbn.dataset.ultimoIsbn) {
        estado.temporizadorIsbn = setTimeout(() => preencherPorISBN(formIsbn, { automatico: true }), 500);
      }
    }
    const form = el.closest('form[data-form="livro"]');
    if (form && (el.name === 'titulo' || el.name === 'autor-nome')) {
      clearTimeout(temporizadorPrevia);
      temporizadorPrevia = setTimeout(() => atualizarPreviaCapa(form), 250);
    }
  });

  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.filtro && el.tagName === 'SELECT') {
      const mapa = { 'todos-tipo': 'tipo', 'todos-status': 'status', 'todos-categoria': 'categoria' };
      if (mapa[el.dataset.filtro]) { estado.todos[mapa[el.dataset.filtro]] = el.value; atualizarResultados(); }
      if (el.dataset.filtro === 'todos-ordem') { estado.todos.ordem = el.value; estado.todos.dir = 1; render(); }
    }
    if (el.matches('[data-importar]') && el.files && el.files[0]) {
      importarArquivo(el.files[0]);
      el.value = '';
    }
    if (el.dataset.catCampo) mudarCategoria(el);
    if (el.dataset.metaAno) {
      const n = parseInt(el.value, 10);
      if (n > 0) alterar(() => { dados.metas[el.dataset.metaAno] = n; }, { mensagem: `Meta de ${el.dataset.metaAno} atualizada` });
      else el.value = dados.metas[el.dataset.metaAno] || '';
    }

    const form = el.closest('form[data-form="livro"]');
    if (form) {
      if (el.name === 'posse') {
        const posse = form.querySelector('[name="posse"]:checked').value;
        form.querySelectorAll('[data-se-posse]').forEach(fs => {
          fs.hidden = fs.dataset.sePosse === 'leitura' ? posse === 'desejo' : fs.dataset.sePosse !== posse;
        });
      }
      if (el.name === 'sem-isbn') {
        const campoIsbn = form.querySelector('[name="isbn"]');
        campoIsbn.disabled = el.checked;
        if (el.checked) campoIsbn.value = '';
        form.querySelector('[data-acao="buscar-isbn"]').disabled = el.checked;
      }
      if (el.name === 'formato') {
        form.dataset.formatoTocado = '1';
        el.closest('.campo').classList.remove('auto');
      }
      if (el.name === 'status') {
        const inicio = form.querySelector('[name="inicio"]');
        const fim = form.querySelector('[name="fim"]');
        if ((el.value === 'lendo' || el.value === 'lido') && !inicio.value) inicio.value = hojeISO();
        if (el.value === 'lido' && !fim.value) fim.value = hojeISO();
        if (el.value === 'lendo' || el.value === 'nao-lido') fim.value = '';
      }
      if (el.name === 'categoria') {
        form.querySelector('[data-descricao-categoria]').textContent = (categoriaPorId(el.value) || {}).descricao || '';
        atualizarPreviaCapa(form);
      }
      if (el.name === 'autor-nome') {
        const sobrenome = el.closest('.autor-linha').querySelector('[name="autor-sobrenome"]');
        if (!sobrenome.value.trim() || sobrenome.dataset.auto) {
          sobrenome.value = sugerirSobrenome(el.value);
          sobrenome.dataset.auto = '1';
        }
      }
      if (el.matches('[data-arquivo-capa]') && el.files && el.files[0]) {
        aplicarCapaNoFormulario(form, el.files[0]);
        el.value = '';
      }
    }

    const formEmprestimo = el.closest('form[data-form="emprestimo"]');
    if (formEmprestimo && el.name === 'devolvido-em' && el.value) formEmprestimo.querySelector('[name="devolvido"]').checked = true;
    if (formEmprestimo && el.name === 'devolvido' && !el.checked) formEmprestimo.querySelector('[name="devolvido-em"]').value = '';

    const formChegou = el.closest('form[data-form="chegou"]');
    if (formChegou && el.name === 'tipo') {
      formChegou.querySelectorAll('[data-se-tipo]').forEach(c => { c.hidden = c.dataset.seTipo !== el.value; });
    }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 's') {
      e.preventDefault();
      salvar();
    }
    if (e.key === 'Enter' && e.target.name === 'isbn' && e.target.closest('form[data-form="livro"]')) {
      e.preventDefault();
      preencherPorISBN(e.target.closest('form'));
    }
  });

  document.addEventListener('mouseover', e => {
    const botao = e.target.closest('.nota-botoes button');
    if (botao) botao.closest('[data-nota-entrada]').querySelector('.estrelas').style.setProperty('--v', botao.dataset.valor);
  });

  document.addEventListener('mouseout', e => {
    const alvo = e.target.closest('.nota-alvo');
    if (!alvo || alvo.contains(e.relatedTarget)) return;
    const caixa = alvo.closest('[data-nota-entrada]');
    caixa.querySelector('.estrelas').style.setProperty('--v', Number(caixa.querySelector('[name="nota"]').value) || 0);
  });

  document.addEventListener('paste', e => {
    const area = e.clipboardData;
    if (!area) return;
    const arquivo = [...area.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
    const texto = (area.getData('text/plain') || '').trim();
    const endereco = /^(https?:\/\/\S+|data:image\/\S+)$/i.test(texto) ? texto : '';
    const emCampo = e.target.closest && e.target.closest('input, textarea, select, [contenteditable]');
    const conteudo = arquivo ? arquivo.getAsFile() : (!emCampo && endereco ? endereco : null);
    if (!conteudo) return;
    const form = document.querySelector('#modal[open] form[data-form="livro"]');
    if (form) { e.preventDefault(); aplicarCapaNoFormulario(form, conteudo); return; }
    if (document.querySelector('#modal[open] [data-sem-capa]')) {
      e.preventDefault();
      if (estado.alvoCapa) aplicarCapaColada(estado.alvoCapa, conteudo);
      else avisar('Clique antes em Buscar na internet ou em Colar imagem no livro que vai receber a capa.');
    }
  });

  document.addEventListener('dragover', e => {
    const zona = e.target.closest && e.target.closest('[data-zona-capa]');
    if (!zona) return;
    e.preventDefault();
    zona.classList.add('soltando');
  });

  document.addEventListener('dragleave', e => {
    const zona = e.target.closest && e.target.closest('[data-zona-capa]');
    if (zona && !zona.contains(e.relatedTarget)) zona.classList.remove('soltando');
  });

  document.addEventListener('drop', e => {
    const zona = e.target.closest && e.target.closest('[data-zona-capa]');
    if (!zona) return;
    e.preventDefault();
    zona.classList.remove('soltando');
    const arquivo = [...(e.dataTransfer.files || [])].find(f => f.type.startsWith('image/'));
    const endereco = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '')
      .split(/\r?\n/).map(t => t.trim()).find(t => /^(https?:\/\/|data:image\/)/i.test(t));
    const conteudo = arquivo || endereco;
    if (conteudo) aplicarCapaNoFormulario(zona.closest('form'), conteudo);
  });

  document.addEventListener('load', e => {
    const img = e.target;
    if (img && img.classList && img.classList.contains('capa-img') && /^https?:/i.test(img.currentSrc || img.src) && img.naturalWidth >= 40 && img.naturalHeight >= 40) estado.algumaCapaCarregou = true;
    if (img && img.classList && img.classList.contains('capa-img') && (img.naturalWidth < 40 || img.naturalHeight < 40)) {
      if (img.dataset.livro) estado.capasQuebradas.add(img.dataset.livro);
      const capa = img.closest('.capa');
      if (capa) capa.classList.remove('com-imagem');
      img.remove();
    }
  }, true);

  document.addEventListener('error', e => {
    const img = e.target;
    if (img && img.classList && img.classList.contains('capa-img')) {
      if (img.dataset.livro) estado.capasQuebradas.add(img.dataset.livro);
      const capa = img.closest('.capa');
      if (capa) capa.classList.remove('com-imagem');
      img.remove();
    }
  }, true);

  window.addEventListener('pagehide', () => {
    if (estado.alterado && typeof gravarRascunhoAgora === 'function') gravarRascunhoAgora();
    if (noApp() && estado.pendentes) gravarAgora();
  });

  document.addEventListener('visibilitychange', () => {
    if (!noApp()) return;
    if (document.visibilityState === 'hidden' && estado.pendentes) gravarAgora();
    if (document.visibilityState === 'visible' && typeof sincronizarOneDrive === 'function' && oneDriveLigado()) sincronizarOneDrive({ automatico: true });
  });

  window.addEventListener('online', () => {
    if (noApp() && typeof sincronizarOneDrive === 'function' && oneDriveLigado()) sincronizarOneDrive({ automatico: true });
  });

  window.addEventListener('beforeunload', e => {
    if (gravaSozinho()) {
      if (estado.pendentes || estado.gravando) { e.preventDefault(); e.returnValue = ''; }
      return;
    }
    if (estado.alterado) {
      if (typeof gravarRascunhoAgora === 'function') gravarRascunhoAgora();
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

/* ===== Início do programa ===== */

async function iniciar() {
  if (noApp()) {
    window.minhaBiblioteca = { dados: () => dados, codigos: () => new Map(estado.codigos) };
    await iniciarApp();
    return;
  }
  if (naNuvem()) {
    window.minhaBiblioteca = { dados: () => dados, codigos: () => new Map(estado.codigos) };
    await iniciarNuvem();
    return;
  }
  try {
    dados = normalizarDados(JSON.parse($('#dados').textContent));
  } catch (e) {
    document.documentElement.classList.remove('js');
    $('#app').innerHTML = '<div class="conteudo"><h1 class="titulo-pagina">Não foi possível abrir o programa</h1><p class="subtitulo">Os dados deste arquivo estão danificados. A lista abaixo é a última versão simples gravada. Abra uma cópia anterior do arquivo ou a exportação para Excel.</p></div>';
    return;
  }
  estado.baseSalvoEm = dados.salvoEm;
  estado.codigos = calcularCodigos(dados);
  montarEsqueleto();
  ligarEventos();
  render();
  verificarRascunho();
  window.minhaBiblioteca = { dados: () => dados, codigos: () => new Map(estado.codigos) };
  if ('showSaveFilePicker' in window) {
    const h = await lerVinculo();
    if (h) {
      estado.vinculoSalvo = true;
      if (estado.aba === 'config') render();
    }
  }
}

if (typeof document === 'undefined') {
  globalThis.__exportarBiblioteca = { normalizarDados, revisarDados, montarDocumento, gerarEstatico, calcularCodigos, gerarPlanilhaExcel, leiturasConcluidas, nomesAutores, grupoDe };
} else {
  iniciar();
}

})();
</script>
