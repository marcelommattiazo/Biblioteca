sc(l.id)}\">Marcar como lido</button>`);\n    if (l.status === 'lido') botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"reler\" data-id=\"${esc(l.id)}\">Registrar releitura</button>`);\n    if (abertoPeguei || abertoEmprestei) {\n      const e = abertoPeguei || abertoEmprestei;\n      botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"registrar-devolucao\" data-id=\"${esc(l.id)}\" data-emp=\"${esc(e.id)}\">Registrar devolução</button>`);\n    } else if (grupo === 'fisico') {\n      botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"emprestar\" data-id=\"${esc(l.id)}\">Emprestar</button>`);\n    }\n  }\n  botoes.push(`<button type=\"button\" class=\"botao primario\" data-acao=\"editar-livro\" data-id=\"${esc(l.id)}\">Editar</button>`);\n\n  abrirModal({\n    titulo: '<span class=\"sr-only\">Ficha do livro</span>',\n    corpo: `<div class=\"ficha\">\n        <div class=\"ficha-capa\">${capaHTML(l, 'grande')}</div>\n        <div>\n          <p class=\"ficha-grupo\">${esc(origem)}</p>\n          <h2 class=\"ficha-titulo\">${esc(l.titulo)}</h2>\n          <p class=\"ficha-autores\">${esc(nomesAutores(l, { papeis: true })) || 'Autor não informado'}</p>\n          <div class=\"ficha-leitura\">${grupo !== 'desejo' ? `${statusHTML(l.status)}${estrelasHTML(l.nota, 18)}` : ''}<button type=\"button\" class=\"botao-coracao so-icone${l.favorito ? ' favorito' : ''}\" data-acao=\"alternar-favorito\" data-id=\"${esc(l.id)}\" aria-pressed=\"${!!l.favorito}\" title=\"${l.favorito ? 'Tirar dos favoritos' : 'Marcar como favorito'}\"><span aria-hidden=\"true\">♥</span><span class=\"sr-only\">${l.favorito ? 'Tirar dos favoritos' : 'Marcar como favorito'}</span></button></div>\n          <dl class=\"fatos\">${fatos.map(([t, v]) => `<dt>${t}</dt><dd>${v}</dd>`).join('')}</dl>\n          ${releituras}${emprestimos}\n          ${l.obs ? `<div class=\"ficha-bloco\"><h3>Observações</h3><p class=\"ficha-obs\">${esc(l.obs)}</p></div>` : ''}\n        </div>\n      </div>`,\n    rodape: `<button type=\"button\" class=\"botao discreto perigo esquerda\" data-acao=\"excluir-livro\" data-id=\"${esc(l.id)}\">Excluir</button>${botoes.join('')}`,\n  });\n}\n\n/* ===== Formulário de livro ===== */\n\nfunction livroVazio(posse = 'propria') {\n  return {\n    id: novoId('l'), chegada: 0, titulo: '', serie: '', volume: null,\n    autores: [{ nome: '', papel: 'autor', sobrenome: '' }],\n    editora: '', ano: null, isbn: '', paginas: null,\n    categoria: '', formato: posse === 'desejo' ? '' : 'brochura', posse,\n    status: 'nao-lido', inicio: null, fim: null, nota: null,\n    releituras: [], obs: '', capa: '',\n    emprestimos: posse === 'emprestada' ? [{ id: novoId('e'), tipo: 'peguei', pessoa: '', data: hojeISO(), devolverAte: null, devolvido: false, devolvidoEm: null }] : [],\n    prioridade: '',\n  };\n}\n\nfunction autorLinhaHTML(a) {\n  return `<div class=\"autor-linha\">\n    <label class=\"campo\"><span>Nome</span><input type=\"text\" name=\"autor-nome\" value=\"${esc(a.nome)}\" data-sugerir-sobrenome autocomplete=\"off\"></label>\n    <label class=\"campo\"><span>Papel</span><select name=\"autor-papel\">${opcoesHTML(PAPEIS, a.papel || 'autor')}</select></label>\n    <label class=\"campo\"><span>Sobrenome</span><input type=\"text\" name=\"autor-sobrenome\" value=\"${esc(a.sobrenome)}\"></label>\n    <button type=\"button\" class=\"remover\" data-acao=\"remover-autor\" aria-label=\"Remover pessoa\">×</button>\n  </div>`;\n}\n\nfunction notaEntradaHTML(nota, favorito = false) {\n  const v = Number(nota) || 0;\n  return `<div class=\"nota-entrada\" data-nota-entrada>\n    <input type=\"hidden\" name=\"nota\" value=\"${v || ''}\">\n    <input type=\"hidden\" name=\"favorito\" value=\"${favorito ? '1' : ''}\">\n    <span class=\"nota-alvo\">\n      <span class=\"estrelas\" style=\"--v:${v}\"></span>\n      <span class=\"nota-botoes\">${Array.from({ length: 10 }, (_, i) => `<button type=\"button\" data-acao=\"nota\" data-valor=\"${(i + 1) / 2}\" aria-label=\"Nota ${numero((i + 1) / 2, (i + 1) % 2 ? 1 : 0)}\"></button>`).join('')}</span>\n    </span>\n    <span class=\"nota-texto\">${v ? numero(v, v % 1 ? 1 : 0) : 'Sem nota'}</span>\n    <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"nota\" data-valor=\"0\">Limpar</button>\n    <button type=\"button\" class=\"botao-coracao so-icone${favorito ? ' favorito' : ''}\" data-acao=\"favorito-campo\" aria-pressed=\"${!!favorito}\" title=\"${favorito ? 'Tirar dos favoritos' : 'Marcar como favorito'}\"><span aria-hidden=\"true\">♥</span><span class=\"sr-only\">Favorito</span></button>\n  </div>`;\n}\n\nfunction abrirFormulario(livro, { novo = false } = {}) {\n  const l = livro;\n  const emp = l.emprestimos.find(e => e.tipo === 'peguei') || { pessoa: '', data: hojeISO(), devolverAte: null, devolvido: false, devolvidoEm: null };\n  estado.formulario = { id: l.id, novo, capa: l.capa || '' };\n  const titulo = novo ? (l.posse === 'desejo' ? 'Adicionar desejo' : l.posse === 'emprestada' ? 'Registrar livro emprestado' : 'Adicionar livro') : 'Editar livro';\n  const botao = novo ? (l.posse === 'desejo' ? 'Adicionar desejo' : 'Adicionar livro') : 'Aplicar alterações';\n  const categorias = [...(l.categoria ? [] : [['', 'Escolha a categoria']]), ...dados.categorias.map(c => [c.id, c.nome])];\n  const descricaoCat = (categoriaPorId(l.categoria) || {}).descricao || '';\n\n  abrirModal({\n    titulo,\n    formulario: 'livro',\n    corpo: `<div class=\"form-livro\">\n      <div class=\"form-capa\" data-zona-capa>\n        <div data-previa-capa>${capaHTML(l)}</div>\n        <input type=\"file\" accept=\"image/*\" data-arquivo-capa hidden>\n        <button type=\"button\" class=\"botao pequeno\" data-acao=\"escolher-capa\">Escolher imagem</button>\n        <a class=\"botao pequeno\" href=\"#\" target=\"_blank\" rel=\"noopener noreferrer\" data-link-busca-capa>Buscar na internet</a>\n        <p class=\"ajuda\">Também dá para colar uma imagem copiada com Ctrl+V ou arrastá-la até a capa.</p>\n        <p class=\"ajuda\" data-capa-status aria-live=\"polite\"></p>\n        <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"remover-capa\"${l.capa ? '' : ' hidden'}>Remover capa</button>\n      </div>\n      <div>\n        <div class=\"isbn-linha\">\n          <label class=\"campo\"><span>ISBN</span><input type=\"text\" name=\"isbn\" value=\"${esc(formatarISBN(l.isbn))}\" inputmode=\"numeric\" autocomplete=\"off\"${l.semIsbn ? ' disabled' : ''}></label>\n          <button type=\"button\" class=\"botao\" data-acao=\"buscar-isbn\"${l.semIsbn ? ' disabled' : ''}>Buscar dados</button>\n          ${typeof podeUsarCamera === 'function' && podeUsarCamera() ? `<button type=\"button\" class=\"botao\" data-acao=\"escanear-isbn\"${l.semIsbn ? ' disabled' : ''}>Escanear</button>` : ''}\n        </div>\n        <label class=\"opcao-sem-isbn\"><input type=\"checkbox\" name=\"sem-isbn\"${l.semIsbn ? ' checked' : ''}> Este livro não tem ISBN</label>\n        <p class=\"isbn-status\" data-isbn-status aria-live=\"polite\"></p>\n        <div class=\"campos\" style=\"margin-top:10px\">\n          <label class=\"campo c6\"><span>Título</span><input type=\"text\" name=\"titulo\" value=\"${esc(l.titulo)}\" required></label>\n          <label class=\"campo c4\"><span>Série</span><input type=\"text\" name=\"serie\" value=\"${esc(l.serie)}\"></label>\n          <label class=\"campo c2\"><span>Volume</span><input type=\"number\" name=\"volume\" min=\"1\" value=\"${esc(l.volume ?? '')}\"></label>\n        </div>\n        <fieldset class=\"grupo-form\">\n          <legend>Autoria</legend>\n          <div class=\"autores-lista\" data-autores>${(l.autores.length ? l.autores : [{ nome: '', papel: 'autor', sobrenome: '' }]).map(autorLinhaHTML).join('')}</div>\n          <div class=\"acoes\" style=\"margin-top:8px\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"adicionar-autor\">Adicionar pessoa</button></div>\n          <p class=\"ajuda\">O sobrenome define a posição na estante. Em nomes como Hwang Bo-reum, o sobrenome vem primeiro.</p>\n        </fieldset>\n        <fieldset class=\"grupo-form\">\n          <legend>Classificação</legend>\n          <div class=\"campos\">\n            <label class=\"campo c3\"><span>Categoria</span><select name=\"categoria\" data-categoria>${opcoesHTML(categorias, l.categoria)}</select></label>\n            <label class=\"campo c3\"><span>Formato</span><select name=\"formato\">${opcoesHTML(FORMATOS, l.formato)}</select></label>\n            <p class=\"ajuda c6\" data-descricao-categoria>${esc(descricaoCat)}</p>\n            <div class=\"campo c6\"><span>Posse</span>\n              <div class=\"segmentado\" role=\"radiogroup\" aria-label=\"Posse\">${POSSES.map(([v, r]) => `<label><input type=\"radio\" name=\"posse\" value=\"${v}\"${l.posse === v ? ' checked' : ''}>${r}</label>`).join('')}</div>\n            </div>\n            <label class=\"campo c4\"><span>Editora</span><input type=\"text\" name=\"editora\" value=\"${esc(l.editora)}\"></label>\n            <label class=\"campo c1\"><span>Ano</span><input type=\"number\" name=\"ano\" min=\"1400\" max=\"2100\" value=\"${esc(l.ano ?? '')}\"></label>\n            <label class=\"campo c1\"><span>Páginas</span><input type=\"number\" name=\"paginas\" min=\"1\" value=\"${esc(l.paginas ?? '')}\"></label>\n          </div>\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"desejo\"${l.posse === 'desejo' ? '' : ' hidden'}>\n          <legend>Desejo</legend>\n          <div class=\"campos\"><label class=\"campo c3\"><span>Prioridade</span><select name=\"prioridade\">${opcoesHTML(PRIORIDADES, l.prioridade || '')}</select></label></div>\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"emprestada\"${l.posse === 'emprestada' ? '' : ' hidden'}>\n          <legend>Empréstimo</legend>\n          <div class=\"campos\">\n            <label class=\"campo c3\"><span>Emprestado por</span><input type=\"text\" name=\"emp-pessoa\" value=\"${esc(emp.pessoa)}\" list=\"pessoas-conhecidas\"></label>\n            <label class=\"campo c3\"><span>Data do empréstimo</span><input type=\"date\" name=\"emp-data\" value=\"${esc(emp.data || '')}\"></label>\n            <label class=\"campo c3\"><span>Devolver até</span><input type=\"date\" name=\"emp-devolver\" value=\"${esc(emp.devolverAte || '')}\"></label>\n            <label class=\"campo c3\"><span>Devolvido em</span><input type=\"date\" name=\"emp-devolvido-em\" value=\"${esc(emp.devolvidoEm || '')}\"></label>\n            <label class=\"c6\" style=\"display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" name=\"emp-devolvido\"${emp.devolvido ? ' checked' : ''}> Já devolvi</label>\n            <p class=\"ajuda c6\">Sem data do empréstimo ou da devolução, o programa usa o início e o término da leitura.</p>\n          </div>\n          ${pessoasDatalist()}\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"leitura\"${l.posse === 'desejo' ? ' hidden' : ''}>\n          <legend>Leitura</legend>\n          <div class=\"campos\">\n            <label class=\"campo c2\"><span>Status</span><select name=\"status\" data-status>${opcoesHTML(STATUS, l.status)}</select></label>\n            <label class=\"campo c2\"><span>Início</span><input type=\"date\" name=\"inicio\" value=\"${esc(l.inicio || '')}\"></label>\n            <label class=\"campo c2\"><span>Término</span><input type=\"date\" name=\"fim\" value=\"${esc(l.fim || '')}\"></label>\n            <div class=\"campo c6\"><span>Nota</span>${notaEntradaHTML(l.nota, l.favorito)}</div>\n          </div>\n        </fieldset>\n        <fieldset class=\"grupo-form\">\n          <legend>Observações</legend>\n          <textarea name=\"obs\" aria-label=\"Observações\">${esc(l.obs)}</textarea>\n        </fieldset>\n        <p class=\"mensagem-erro\" data-erro-form aria-live=\"assertive\"></p>\n      </div>\n    </div>`,\n    rodape: `<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">${botao}</button>`,\n  });\n  estado.formulario.livro = l;\n}\n\nfunction pessoasDatalist() {\n  const nomes = [...new Set(emprestimosDe(dados).map(e => e.emp.pessoa).filter(Boolean))].sort(colador.compare);\n  return `<datalist id=\"pessoas-conhecidas\">${nomes.map(n => `<option value=\"${esc(n)}\"></option>`).join('')}</datalist>`;\n}\n\nfunction atualizarPreviaCapa(form) {\n  const f = estado.formulario;\n  const titulo = form.querySelector('[name=\"titulo\"]').value || 'Título';\n  const provisorio = { ...f.livro, titulo, capa: f.capa, categoria: form.querySelector('[name=\"categoria\"]').value, autores: lerAutores(form) };\n  form.querySelector('[data-previa-capa]').innerHTML = capaHTML(provisorio);\n  form.querySelector('[data-acao=\"remover-capa\"]').hidden = !f.capa;\n}\n\nfunction lerAutores(form) {\n  const nomes = [...form.querySelectorAll('[name=\"autor-nome\"]')].map(i => i.value.trim());\n  const papeis = [...form.querySelectorAll('[name=\"autor-papel\"]')].map(i => i.value);\n  const sobrenomes = [...form.querySelectorAll('[name=\"autor-sobrenome\"]')].map(i => i.value.trim());\n  return nomes.map((nome, i) => ({ nome, papel: papeis[i] || 'autor', sobrenome: sobrenomes[i] || sugerirSobrenome(nome) })).filter(a => a.nome);\n}\n\nfunction enviarFormularioLivro(form) {\n  const f = estado.formulario;\n  const erro = form.querySelector('[data-erro-form]');\n  const valor = nome => (form.querySelector(`[name=\"${nome}\"]`) || {}).value?.trim() ?? '';\n  const inteiro = nome => { const n = parseInt(valor(nome), 10); return Number.isFinite(n) && n > 0 ? n : null; };\n  erro.textContent = '';\n  form.querySelectorAll('.campo.erro').forEach(c => c.classList.remove('erro'));\n  const falhar = (mensagem, campo) => {\n    erro.textContent = mensagem;\n    const alvo = campo && form.querySelector(`[name=\"${campo}\"]`);\n    if (alvo) { alvo.closest('.campo')?.classList.add('erro'); alvo.focus(); }\n  };\n\n  const titulo = valor('titulo');\n  if (!titulo) return falhar('Informe o título do livro.', 'titulo');\n  let isbn = '';\n  if (valor('isbn')) {\n    isbn = normalizarISBN(valor('isbn'));\n    if (!isbn) return falhar('O ISBN precisa ter 10 ou 13 dígitos.', 'isbn');\n  }\n  if (!valor('categoria')) return falhar('Escolha a categoria do livro: ela define a posição na estante.', 'categoria');\n  const semIsbn = !!(form.querySelector('[name=\"sem-isbn\"]') || {}).checked && !isbn;\n  const posse = (form.querySelector('[name=\"posse\"]:checked') || {}).value || 'propria';\n  const inicio = valor('inicio') || null;\n  const fim = valor('fim') || null;\n  if (posse !== 'desejo' && inicio && fim && fim < inicio) return falhar('O término não pode ser antes do início.', 'fim');\n\n  const original = f.novo ? null : livroPorId(f.id);\n  if (isbn && (!original || original.isbn !== isbn)) {\n    const repetido = dados.livros.find(l => l.isbn === isbn && l.id !== f.id);\n    if (repetido && !f.confirmouRepetido) {\n      f.confirmouRepetido = true;\n      return falhar(`Já existe um livro com esse ISBN: ${repetido.titulo}. Para cadastrar mesmo assim, clique de novo no botão.`, 'isbn');\n    }\n  }\n\n  const l = original ? JSON.parse(JSON.stringify(original)) : f.livro;\n  const grupoAntes = original ? grupoDe(original) : null;\n  Object.assign(l, {\n    titulo, isbn, semIsbn,\n    serie: valor('serie'), volume: inteiro('volume'),\n    autores: lerAutores(form),\n    categoria: valor('categoria'), formato: valor('formato'), posse,\n    editora: valor('editora'), ano: inteiro('ano'), paginas: inteiro('paginas'),\n    obs: (form.querySelector('[name=\"obs\"]').value || '').trim(),\n    capa: f.capa || '',\n  });\n  if (posse === 'desejo') {\n    l.prioridade = valor('prioridade');\n  } else {\n    l.prioridade = '';\n    l.status = valor('status') || 'nao-lido';\n    l.inicio = inicio;\n    l.fim = fim;\n    l.nota = Number(valor('nota')) || null;\n    l.favorito = !!valor('favorito');\n  }\n  const peguei = l.emprestimos.find(e => e.tipo === 'peguei');\n  if (posse === 'emprestada') {\n    const registro = peguei || { id: novoId('e'), tipo: 'peguei' };\n    const novosValores = {\n      pessoa: valor('emp-pessoa'), data: valor('emp-data') || null, devolverAte: valor('emp-devolver') || null,\n      devolvido: form.querySelector('[name=\"emp-devolvido\"]').checked, devolvidoEm: valor('emp-devolvido-em') || null,\n    };\n    if (novosValores.devolvidoEm) novosValores.devolvido = true;\n    const mudouDatas = !!original && !!peguei && (['data', 'devolverAte', 'devolvidoEm'].some(k => (registro[k] || '') !== (novosValores[k] || '')) || !!registro.devolvido !== novosValores.devolvido);\n    if (mudouDatas) {\n      novosValores.manual = true;\n      novosValores.pelaLeitura = false;\n    }\n    Object.assign(registro, novosValores);\n    if (!peguei) l.emprestimos.push(registro);\n  } else if (peguei && !peguei.devolvido) {\n    peguei.devolvido = true;\n  }\n\n  const grupoDepois = grupoDe(l);\n  const mudouGrupo = grupoAntes !== grupoDepois;\n  alterar(() => {\n    if (!original || (mudouGrupo && (grupoDepois === 'digital' || grupoDepois === 'emprestado'))) l.chegada = dados.proximaChegada++;\n    if (original) dados.livros[dados.livros.findIndex(x => x.id === l.id)] = l;\n    else dados.livros.push(l);\n  }, { mensagem: mensagemDeEntrada(l, !original) });\n  fecharModal();\n  if (estado.voltarPara === 'revisao') {\n    estado.voltarPara = null;\n    abrirRevisao();\n  }\n}\n\nfunction mensagemDeEntrada(livro, novo) {\n  if (!novo) return 'Alterações aplicadas';\n  return () => {\n    const codigo = estado.codigos.get(livro.id);\n    return codigo ? `${livro.titulo} entrou como ${codigo}` : `${livro.titulo} entrou na lista de desejos`;\n  };\n}\n\n/* ===== Busca de dados e capas ===== */\n\nfunction esperar(ms) {\n  return new Promise(ok => setTimeout(ok, ms));\n}\n\nasync function obterJSON(url, { tempo = 12000, tentativas = 3 } = {}) {\n  for (let tentativa = 1; ; tentativa++) {\n    const controle = new AbortController();\n    const timer = setTimeout(() => controle.abort(), tempo);\n    let resposta;\n    try {\n      resposta = await fetch(url, { signal: controle.signal });\n    } catch (e) {\n      e.rede = true;\n      throw e;\n    } finally {\n      clearTimeout(timer);\n    }\n    if (resposta.status === 404) return null;\n    if (resposta.status === 429 && tentativa < tentativas) {\n      await esperar(1500 * tentativa);\n      continue;\n    }\n    if (!resposta.ok) {\n      const erro = new Error('HTTP ' + resposta.status);\n      erro.status = resposta.status;\n      try {\n        const corpo = await resposta.json();\n        const detalhe = corpo && (corpo.error || corpo.message);\n        erro.detalhe = typeof detalhe === 'string' ? detalhe : (detalhe && detalhe.message) || '';\n      } catch (e) { erro.detalhe = ''; }\n      throw erro;\n    }\n    return await resposta.json();\n  }\n}\n\nfunction isbn10De(isbn) {\n  if (!/^978\\d{10}$/.test(isbn || '')) return null;\n  const base = isbn.slice(3, 12);\n  const soma = [...base].reduce((s, c, i) => s + Number(c) * (10 - i), 0);\n  const dv = (11 - (soma % 11)) % 11;\n  return base + (dv === 10 ? 'X' : String(dv));\n}\n\nfunction imagemCarrega(url, tempo = 9000) {\n  return new Promise(resolver => {\n    const img = new Image();\n    const timer = setTimeout(() => resolver(false), tempo);\n    img.onload = () => { clearTimeout(timer); resolver(img.naturalWidth >= 40 && img.naturalHeight >= 40); };\n    img.onerror = () => { clearTimeout(timer); resolver(false); };\n    img.referrerPolicy = 'no-referrer';\n    img.src = url;\n  });\n}\n\n/* ----- Caixa de títulos, nomes e editoras ----- */\n\nconst PALAVRAS_MINUSCULAS = new Set(['a', 'à', 'ao', 'aos', 'as', 'às', 'com', 'da', 'das', 'de', 'do', 'dos', 'e', 'em', 'na', 'nas', 'no', 'nos', 'o', 'os', 'ou', 'para', 'pela', 'pelas', 'pelo', 'pelos', 'por', 'sem', 'sob', 'sobre', 'um', 'uma', 'umas', 'uns', 'que', 'se', 'of', 'the', 'and']);\nconst PARTICULAS_NOME = new Set(['de', 'da', 'das', 'do', 'dos', 'e', 'du', 'van', 'von', 'der', 'den', 'del', 'di']);\n\nfunction ajustarTitulo(texto) {\n  const limpo = String(texto || '').replace(/\\s+/g, ' ').trim();\n  if (!limpo) return '';\n  const tudoMaiusculo = limpo === limpo.toLocaleUpperCase('pt-BR') && /[A-ZÀ-Þ]/.test(limpo);\n  let inicio = true;\n  return limpo.split(' ').map(palavra => {\n    const eraInicio = inicio;\n    inicio = /[:.!?–—]$/.test(palavra) || palavra === '-';\n    const letras = palavra.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '');\n    if (!letras) return palavra;\n    if (palavra.includes('&')) return palavra.toLocaleUpperCase('pt-BR');\n    const minuscula = letras === letras.toLocaleLowerCase('pt-BR');\n    const maiuscula = letras === letras.toLocaleUpperCase('pt-BR');\n    if (!minuscula && !(maiuscula && tudoMaiusculo)) return palavra;\n    if (maiuscula && !eraInicio && /^(X{0,3})(IX|IV|V?I{0,3})$/.test(letras)) return palavra;\n    const base = palavra.toLocaleLowerCase('pt-BR');\n    if (!eraInicio && PALAVRAS_MINUSCULAS.has(base.replace(/[^a-zà-öø-ÿ]/g, ''))) return base;\n    return base.replace(/[a-zà-öø-ÿ]/, l => l.toLocaleUpperCase('pt-BR'));\n  }).join(' ');\n}\n\nfunction ajustarNome(texto) {\n  const limpo = String(texto || '').replace(/\\s+/g, ' ').trim();\n  if (!limpo || (limpo !== limpo.toLocaleUpperCase('pt-BR') && limpo !== limpo.toLocaleLowerCase('pt-BR'))) return limpo;\n  return limpo.split(' ').map((parte, i) => {\n    const base = parte.toLocaleLowerCase('pt-BR');\n    if (i > 0 && PARTICULAS_NOME.has(base)) return base;\n    return base.replace(/(^|[-'’.])([a-zà-öø-ÿ])/g, (m, antes, letra) => antes + letra.toLocaleUpperCase('pt-BR'));\n  }).join(' ');\n}\n\nfunction autorDeTexto(texto, papel = 'autor') {\n  const bruto = String(texto || '').replace(/\\s+/g, ' ').trim();\n  const invertido = bruto.match(/^([^,]+),\\s*([^,]+)$/);\n  if (invertido) {\n    const sobrenome = ajustarNome(invertido[1]);\n    return { nome: `${ajustarNome(invertido[2])} ${sobrenome}`, papel, sobrenome };\n  }\n  const nome = ajustarNome(bruto);\n  return { nome, papel, sobrenome: sugerirSobrenome(nome) };\n}\n\nconst PAPEIS_POR_PALAVRA = [\n  [/tradu|trad\\./i, 'traducao'],\n  [/ilustra|ilust\\./i, 'ilustracao'],\n  [/adapta/i, 'adaptacao'],\n  [/organiza|org\\.|coordena|editor/i, 'organizacao'],\n  [/autor/i, 'autor'],\n];\n\nfunction autoresDeTexto(texto, papelPadrao = 'autor') {\n  return String(texto || '')\n    .split(/\\s*;\\s*|\\s*\\|\\s*|\\s+\\/\\s+|\\s+&\\s+/)\n    .map(parte => {\n      let nome = parte.trim();\n      let papel = papelPadrao;\n      const comPapel = nome.match(/^(.*?)\\s*[([]\\s*([^)\\]]+?)\\s*[)\\]]\\s*$/);\n      if (comPapel) {\n        const achado = PAPEIS_POR_PALAVRA.find(([re]) => re.test(comPapel[2]));\n        if (achado) papel = achado[1];\n        nome = comPapel[1];\n      }\n      nome = nome.replace(/,?\\s*\\d{4}\\s*-\\s*(\\d{4})?\\s*$/, '').replace(/[\\s,;.]+$/, '').trim();\n      return nome ? autorDeTexto(nome, papel) : null;\n    })\n    .filter(Boolean);\n}\n\nfunction chaveNome(nome) {\n  return normalizar(nome).replace(/[^a-z]/g, '');\n}\n\nfunction autorConhecido(autor) {\n  if (!dados || !autor || !autor.nome) return autor;\n  const alvo = chaveNome(autor.nome);\n  for (const livro of dados.livros) {\n    for (const a of livro.autores || []) {\n      if (a.nome && chaveNome(a.nome) === alvo) return { ...autor, nome: a.nome, sobrenome: a.sobrenome || autor.sobrenome };\n    }\n  }\n  return autor;\n}\n\nconst SIGLAS_EDITORAS = { lpm: 'L&PM', ftd: 'FTD', jbc: 'JBC', ltc: 'LTC', dvs: 'DVS', sesc: 'Sesc', senac: 'Senac', edusp: 'Edusp', unesp: 'Unesp' };\n\nfunction limparEditora(texto) {\n  let t = String(texto || '').replace(/\\s+/g, ' ').trim();\n  t = t.replace(/[*•#]+/g, '').replace(/\\b(ltda|eireli|s\\/?a|s\\.a\\.|me)\\.?$/i, '').replace(/[\\s,;.\\-–]+$/, '').trim();\n  if (!t) return '';\n  t = ajustarTitulo(t);\n  return t.split(' ').map(p => SIGLAS_EDITORAS[normalizar(p)] || p).join(' ');\n}\n\nfunction anoDeTexto(valor) {\n  const achado = String(valor ?? '').match(/\\b(1[5-9]\\d{2}|20\\d{2})\\b/);\n  return achado ? Number(achado[1]) : null;\n}\n\nfunction paginasDeValor(valor) {\n  const n = parseInt(valor, 10);\n  return n > 0 && n < 20000 ? n : null;\n}\n\nfunction isbnValido(bruto) {\n  const d = String(bruto || '').replace(/[^0-9xX]/g, '').toUpperCase();\n  if (/^\\d{13}$/.test(d)) return [...d].reduce((s, c, i) => s + Number(c) * (i % 2 ? 3 : 1), 0) % 10 === 0;\n  if (/^\\d{9}[\\dX]$/.test(d)) return [...d].reduce((s, c, i) => s + (c === 'X' ? 10 : Number(c)) * (10 - i), 0) % 11 === 0;\n  return false;\n}\n\n/* ----- Série e volume ----- */\n\nfunction pareceColecaoEditorial(nome) {\n  return /(^|\\s)(cole[cç][aã]o|cl[aá]ssicos?|pocket|biblioteca|grandes (obras|nomes|autores|livros)|obras? (completas|primas|escolhidas|essenciais)|literatura|vaga-?lume|para gostar de ler|edi[cç][aã]o|livros? de bolso|best ?bolso|penguin|folha|l&pm|box)(\\s|$)/i.test(nome || '');\n}\n\nfunction normalizarSerie(nome, volume, autores = []) {\n  const serie = String(nome || '')\n    .replace(/\\s*\\([^)]*\\)\\s*$/, '')\n    .replace(/[\\s;,#:–—-]+$/, '')\n    .replace(/^(s[ée]rie|series|saga)\\s+/i, '')\n    .trim();\n  const numero = parseInt(volume, 10);\n  if (!serie || !(numero > 0 && numero < 1000) || pareceColecaoEditorial(serie)) return null;\n  if (autores.some(a => a.nome && normalizar(a.nome) === normalizar(serie))) return null;\n  return { serie: ajustarTitulo(serie), volume: numero };\n}\n\nfunction serieDeTexto(texto) {\n  const achado = String(texto || '').trim().match(/^(.*?)[\\s,;:(–—-]*(?:#|n[º°o]\\.?|v\\.|vol\\.?|volume|book|livro|tomo|parte)?\\s*(\\d{1,3})\\)?\\s*$/i);\n  return achado && achado[1].trim() ? { nome: achado[1].trim(), volume: Number(achado[2]) } : null;\n}\n\nfunction serieDoTitulo(titulo) {\n  const t = String(titulo || '').trim();\n  const estiloGoodreads = t.match(/^(.+?)\\s*\\(([^()]+?),?\\s*#\\s*(\\d{1,3})\\)\\s*$/);\n  if (estiloGoodreads) return { titulo: estiloGoodreads[1].trim(), nome: estiloGoodreads[2].trim(), volume: Number(estiloGoodreads[3]) };\n  const marcador = t.match(/^(.+?)\\s*[,:(–—-]\\s*(?:vol(?:ume)?\\.?|livro|tomo|parte)\\s*(\\d{1,3})\\)?\\s*$/i) || t.match(/^(.+?)\\s+(?:vol\\.|volume)\\s*(\\d{1,3})\\s*$/i);\n  if (marcador) return { titulo: t, nome: marcador[1].trim(), volume: Number(marcador[2]) };\n  return null;\n}\n\n/* ----- Consultas às bases ----- */\n\nfunction chaveGoogle() {\n  const doArquivo = dados && dados.preferencias && dados.preferencias.chaveGoogle;\n  if (doArquivo) return doArquivo;\n  try { return localStorage.getItem('minha-biblioteca:chave-google') || ''; } catch (e) { return ''; }\n}\n\nasync function consultarMercadoEditorial(isbn) {\n  const r = await obterJSON(`https://api.mercadoeditorial.org/api/v1.2/book?isbn=${isbn}`, { tempo: 10000, tentativas: 1 });\n  const b = r && Array.isArray(r.books) && r.books[0];\n  if (!b || !b.titulo) return null;\n  const texto = v => (v && typeof v === 'object' ? (v.nome || v.descricao || v.nome_fantasia || '') : String(v ?? '')).trim();\n  const papelDe = c => {\n    const tipo = normalizar(texto(c.codigo_contribuicao ?? c.tipo_de_contribuicao ?? c.tipo_contribuicao ?? c.contribuicao ?? c.tipo ?? c.codigo ?? ''));\n    if (!tipo) return 'autor';\n    if (/^(1|4|28)$/.test(tipo) || /autor|instituic|espirito/.test(tipo)) return 'autor';\n    if (/^(2|3|5)$/.test(tipo) || /organiza|coordena|^editor$/.test(tipo)) return 'organizacao';\n    if (tipo === '8' || /ilustra/.test(tipo)) return 'ilustracao';\n    if (tipo === '9' || /tradu/.test(tipo)) return 'traducao';\n    if (tipo === '25' || /adapta/.test(tipo)) return 'adaptacao';\n    return null;\n  };\n  const temPapeis = (b.contribuicao || []).some(c = eturn 'Google Books';\n  return 'Mercado Editorial';\n}\n\nasync function preencherPorISBN(form, { automatico = false } = {}) {\n  const status = form.querySelector('[data-isbn-status]');\n  const campo = nome => form.querySelector(`[name=\"${nome}\"]`);\n  const isbn = normalizarISBN(campo('isbn').value);\n  if (!isbn) {\n    if (!automatico) status.textContent = 'Digite um ISBN com 10 ou 13 dígitos.';\n    return;\n  }\n  if (estado.formulario.buscandoIsbn === isbn) return;\n  estado.formulario.buscandoIsbn = isbn;\n  estado.erroGoogle = '';\n  form.dataset.ultimoIsbn = isbn;\n  status.textContent = 'Buscando dados e capa…';\n  try {\n    const precisaCapa = !estado.formulario.capa;\n    const [meta, capaDireta] = await Promise.all([buscarMetadados(isbn), precisaCapa ? buscarCapa(isbn) : Promise.resolve('')]);\n    if (!form.isConnected || normalizarISBN(campo('isbn').value) !== isbn) return;\n    const r = meta.achado;\n    let capa = capaDireta;\n    if (precisaCapa && !capa && r && r.capas.length) capa = await primeiraImagemValida(r.capas);\n\n    const preenchidos = [];\n    const sugestoes = {};\n    const marcar = nome => { const c = campo(nome); if (c) c.closest('.campo').classList.add('auto'); };\n    const aplicar = (nome, valor, rotulo) => {\n      if (valor === null || valor === undefined || valor === '') return;\n      const atual = campo(nome).value.trim();\n      if (!atual) {\n        campo(nome).value = valor;\n        marcar(nome);\n        if (rotulo && !preenchidos.includes(rotulo)) preenchidos.push(rotulo);\n      } else if (normalizar(atual) !== normalizar(String(valor))) {\n        sugestoes[nome] = valor;\n      }\n    };\n\n    if (r) {\n      aplicar('titulo', r.titulo, 'título');\n      const autoresAtuais = lerAutores(form);\n      if (r.autores.length && !autoresAtuais.length) {\n        form.querySelector('[data-autores]').innerHTML = r.autores.map(autorLinhaHTML).join('');\n        form.querySelectorAll('[data-autores] .campo').forEach(c => c.classList.add('auto'));\n        preenchidos.push('autoria');\n      }\n      aplicar('editora', r.editora, 'editora');\n      aplicar('ano', r.ano, 'ano');\n      aplicar('paginas', r.paginas, 'páginas');\n\n      let serie = r.serie;\n      if (!serie && !campo('serie').value.trim()) {\n        try {\n          const wd = await serieNoWikidata(campo('titulo').value.trim() || r.titulo, lerAutores(form).length ? lerAutores(form) : r.autores);\n          if (wd) {\n            serie = normalizarSerie(wd.nome, wd.volume, r.autores);\n            if (serie) r.fontes.add('Wikidata');\n          }\n        } catch (e) { /* sem série */ }\n        if (!form.isConnected) return;\n      }\n      if (serie) {\n        aplicar('serie', serie.serie, 'série');\n        aplicar('volume', serie.volume, 'volume');\n      }\n      if (r.formato && !form.dataset.formatoTocado && estado.formulario.novo && campo('formato').value !== r.formato) {\n        campo('formato').value = r.formato;\n        marcar('formato');\n        preenchidos.push('formato');\n      }\n    }\n    campo('isbn').value = formatarISBN(isbn);\n    if (capa) {\n      estado.formulario.capa = capa;\n      preenchidos.push('capa');\n    }\n    atualizarPreviaCapa(form);\n    estado.formulario.sugestoes = sugestoes;\n\n    const fontes = r ? [...r.fontes] : [];\n    const faltando = r ? [['editora', 'editora'], ['ano', 'ano'], ['paginas', 'páginas']].filter(([nome]) => !campo(nome).value.trim()).map(([, rotulo]) => rotulo) : [];\n    const qtdSugestoes = Object.keys(sugestoes).length;\n    let texto;\n    if (!r && !capa) {\n      texto = meta.falhaDeRede\n        ? 'Sem conexão com a busca de livros agora. Preencha os dados à mão ou tente mais tarde.'\n        : 'Esse ISBN não foi encontrado nas bases consultadas. Preencha os dados à mão e use Buscar na internet para a capa.';\n    } else {\n      texto = preenchidos.length ? `Preenchido: ${juntarNomes(preenchidos)}.` : 'Nenhum campo em branco para preencher.';\n      if (faltando.length) texto += ` Não encontrado: ${juntarNomes(faltando)}.`;\n      if (r && !capa && precisaCapa) texto += ' Sem capa nas bases: use Buscar na internet.';\n      if (fontes.length) texto += ` ${fontes.length === 1 ? 'Fonte' : 'Fontes'}: ${juntarNomes(fontes)}.`;\n      if (capa) texto += ` Capa: ${fonteDaCapa(capa)}.`;\n      if (r && r.avisoAutores && preenchidos.includes('autoria')) texto += ` ${r.avisoAutores}`;\n    }\n    if (estado.erroGoogle) {\n      texto += ` ${estado.erroGoogle}`;\n    }\n    status.innerHTML = esc(texto) + (qtdSugestoes ? ` <button type=\"button\" class=\"link\" data-acao=\"aplicar-sugestoes\">Trocar também ${qtdSugestoes === 1 ? '1 campo que já estava preenchido' : `${qtdSugestoes} campos que já estavam preenchidos`}</button>` : '');\n  } finally {\n    estado.formulario.buscandoIsbn = null;\n  }\n}\n\nfunction aplicarSugestoes(form) {\n  const sugestoes = (estado.formulario && estado.formulario.sugestoes) || {};\n  for (const [nome, valor] of Object.entries(sugestoes)) {\n    const campo = form.querySelector(`[name=\"${nome}\"]`);\n    if (!campo) continue;\n    campo.value = valor;\n    campo.closest('.campo').classList.add('auto');\n  }\n  estado.formulario.sugestoes = {};\n  const botao = form.querySelector('[data-acao=\"aplicar-sugestoes\"]');\n  if (botao) botao.replaceWith(document.createTextNode('Campos trocados pelos dados encontrados.'));\n  atualizarPreviaCapa(form);\n}\n\nfunction reduzirImagem(origem) {\n  return new Promise((ok, erro) => {\n    const desenhar = src => {\n      const img = new Image();\n      img.onload = () => {\n        const escala = Math.min(1, 300 / img.width, 450 / img.height);\n        const tela = document.createElement('canvas');\n        tela.width = Math.max(1, Math.round(img.width * escala));\n        tela.height = Math.max(1, Math.round(img.height * escala));\n        const ctx = tela.getContext('2d');\n        ctx.fillStyle = '#ffffff';\n        ctx.fillRect(0, 0, tela.width, tela.height);\n        ctx.drawImage(img, 0, 0, tela.width, tela.height);\n        ok(tela.toDataURL('image/jpeg', 0.84));\n      };\n      img.onerror = () => erro(new Error('imagem inválida'));\n      img.src = src;\n    };\n    if (typeof origem === 'string') { desenhar(origem); return; }\n    const leitor = new FileReader();\n    leitor.onload = () => desenhar(leitor.result);\n    leitor.onerror = () => erro(leitor.error);\n    leitor.readAsDataURL(origem);\n  });\n}\n\nasync function prepararCapa(conteudo) {\n  if (typeof conteudo === 'string') {\n    const texto = conteudo.trim();\n    if (/^data:image\\//i.test(texto)) return reduzirImagem(texto);\n    if (!urlCapaSegura(texto) || !(await imagemCarrega(texto))) throw new Error('imagem inválida');\n    return texto;\n  }\n  if (!conteudo || !String(conteudo.type || '').startsWith('image/')) throw new Error('não é imagem');\n  return reduzirImagem(conteudo);\n}\n\nasync function aplicarCapaNoFormulario(form, conteudo) {\n  const status = form.querySelector('[data-capa-status]');\n  status.textContent = 'Carregando imagem…';\n  try {\n    estado.formulario.capa = await prepararCapa(conteudo);\n    atualizarPreviaCapa(form);\n    status.textContent = 'Capa aplicada.';\n  } catch (e) {\n    status.textContent = 'Não foi possível usar essa imagem. Copie a própria imagem (botão direito, Copiar imagem).';\n  }\n}\n\nasync function lerAreaDeTransferencia() {\n  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('sem suporte');\n  const itens = await navigator.clipboard.read();\n  for (const item of itens) {\n    const tipo = item.types.find(t => t.startsWith('image/'));\n    if (tipo) return item.getType(tipo);\n  }\n  for (const item of itens) {\n    if (item.types.includes('text/plain')) {\n      const texto = (await (await item.getType('text/plain')).text()).trim();\n      if (/^(https?:\\/\\/\\S+|data:image\\/\\S+)$/i.test(texto)) return texto;\n    }\n  }\n  return null;\n}\n\n/* ===== Livros sem capa ===== */\n\nfunction livrosSemCapa() {\n  return dados.livros\n    .filter(l => !urlCapaSegura(l.capa) || capasQuebradasConfirmadas().has(l.id))\n    .sort((a, b) => compararCodigos(codigoDe(a), codigoDe(b)) || colador.compare(a.titulo, b.titulo));\n}\n\nfunction itemSemCapaHTML(l) {\n  const codigo = codigoDe(l);\n  return `<li class=\"item-sem-capa\" data-item-capa=\"${esc(l.id)}\">\n    <div class=\"item-sem-capa-capa\">${capaHTML(l, 'pequena mini')}</div>\n    <div>\n      <p class=\"item-sem-capa-titulo\">${codigo ? `<span class=\"etiqueta\">${esc(codigo)}</span> ` : ''}${esc(l.titulo)}</p>\n      <p class=\"detalhe\">${esc(nomesAutores(l) || 'Autor não informado')}${l.isbn ? '' : ', sem ISBN'}</p>\n      <p class=\"detalhe situacao-capa\" data-situacao aria-live=\"polite\"></p>\n    </div>\n    <div class=\"acoes\">\n      <a class=\"botao pequeno\" href=\"${esc(linkBuscaCapa(l))}\" target=\"_blank\" rel=\"noopener noreferrer\" data-alvo-capa=\"${esc(l.id)}\">Buscar na internet</a>\n      <button type=\"button\" class=\"botao pequeno\" data-acao=\"colar-capa\" data-id=\"${esc(l.id)}\">Colar imagem</button>\n    </div>\n  </li>`;\n}\n\nfunction abrirSemCapa({ resumo = '' } = {}) {\n  const lista = livrosSemCapa();\n  estado.alvoCapa = null;\n  abrirModal({\n    titulo: 'Livros sem capa',\n    subtitulo: lista.length ? plural(lista.length, 'livro', 'livros') : '',\n    corpo: `${resumo ? `<p class=\"resumo-lote\">${esc(resumo)}</p>` : ''}\n      ${lista.length ? `<p class=\"detalhe\">Em cada livro, clique em Buscar na internet, copie a imagem da capa (botão direito, Copiar imagem) e volte para esta janela. Depois clique em Colar imagem ou aperte Ctrl+V.</p>\n        <ul class=\"lista-sem-capa\" data-sem-capa>${lista.map(itemSemCapaHTML).join('')}</ul>` : '<p>Todos os livros têm capa.</p>'}`,\n    rodape: '<button type=\"button\" class=\"botao primario\" data-acao=\"fechar-modal\">Fechar</button>',\n  });\n}\n\nfunction situacaoCapa(id, texto) {\n  const el = document.querySelector(`#modal [data-item-capa=\"${CSS.escape(id)}\"] [data-situacao]`);\n  if (el) el.textContent = texto;\n}\n\nasync function aplicarCapaColada(id, conteudo) {\n  const l = livroPorId(id);\n  if (!l) return;\n  situacaoCapa(id, 'Carregando imagem…');\n  let capa;\n  try {\n    capa = await prepararCapa(conteudo);\n  } catch (e) {\n    situacaoCapa(id, 'Não foi possível usar essa imagem. Copie a própria imagem (botão direito, Copiar imagem).');\n    return;\n  }\n  estado.capasQuebradas.delete(id);\n  alterar(() => { l.capa = capa; }, { mensagem: `Capa adicionada a ${l.titulo}` });\n  const item = document.querySelector(`#modal [data-item-capa=\"${CSS.escape(id)}\"]`);\n  if (item) {\n    item.querySelector('.item-sem-capa-capa').innerHTML = capaHTML(l, 'pequena mini');\n    item.classList.add('resolvido');\n  }\n  situacaoCapa(id, 'Capa adicionada.');\n}\n\n/* ===== Completar capas e dados em lote ===== */\n\nasync function completarDados() {\n  const alvos = dados.livros.filter(l => l.isbn);\n  if (!alvos.length) { abrirRevisao(); return; }\n  estado.lote = { cancelado: false };\n  estado.erroGoogle = '';\n  abrirModal({\n    titulo: 'Completar capas e dados',\n    classe: 'pequeno',\n    corpo: `<p data-lote-texto>Preparando…</p>\n      <div class=\"progresso progresso-lote\"><span data-lote-barra style=\"width:0%\"></span></div>\n      <p class=\"detalhe\">Consulta Google Books${chaveGoogle() ? '' : ' (sem chave, costuma recusar)'}, Mercado Editorial, CBL, Open Library e Amazon pelo ISBN de cada livro. Só preenche o que está em branco e troca capas que não carregam.</p>`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"cancelar-lote\">Parar</button>',\n  });\n  const fila = [...alvos];\n  const resultados = new Map();\n  const semResposta = [];\n  let feitos = 0;\n  let consultasSemRede = 0;\n  let algumaImagemCarregou = false;\n\n  const mostrarProgresso = titulo => {\n    const texto = document.querySelector('[data-lote-texto]');\n    const barra = document.querySelector('[data-lote-barra]');\n    if (texto) texto.textContent = `${feitos} de ${alvos.length} consultados. Último: ${titulo}`;\n    if (barra) barra.style.width = `${(feitos / alvos.length) * 100}%`;\n  };\n\n  const trabalhar = async () => {\n    while (fila.length && !estado.lote.cancelado) {\n      const l = fila.shift();\n      const r = {};\n      try {\n        let capaFunciona = false;\n        if (urlCapaSegura(l.capa)) {\n          capaFunciona = l.capa.startsWith('data:') || await imagemCarrega(l.capa);\n          if (capaFunciona) algumaImagemCarregou = true;\n        }\n        const faltam = { editora: !l.editora, ano: !l.ano, paginas: !l.paginas, autores: !autorPrincipal(l), formato: !l.formato && l.posse !== 'desejo' };\n        const precisaDados = Object.values(faltam).some(Boolean);\n        const [meta, capaDireta] = await Promise.all([\n          precisaDados ? buscarMetadados(l.isbn) : Promise.resolve({ achado: null, falhaDeRede: false }),\n          capaFunciona ? Promise.resolve('') : buscarCapa(l.isbn),\n        ]);\n        if (meta.falhaDeRede) consultasSemRede++;\n        const a = meta.achado;\n        if (precisaDados && !a) semResposta.push(l.id);\n        if (a) {\n          if (faltam.editora && a.editora) r.editora = a.editora;\n          if (faltam.ano && a.ano) r.ano = a.ano;\n          if (faltam.paginas && a.paginas) r.paginas = a.paginas;\n          if (faltam.autores && a.autores.length) r.autores = a.autores;\n          if (faltam.formato && a.formato) r.formato = a.formato;\n        }\n        if (!capaFunciona) {\n          let capa = capaDireta;\n          if (!capa && a && a.capas.length) capa = await primeiraImagemValida(a.capas);\n          if (capa) { r.capa = capa; algumaImagemCarregou = true; }\n          else if (l.capa && !l.capa.startsWith('data:')) r.capaQuebrada = true;\n        }\n      } catch (e) {\n        consultasSemRede++;\n      }\n      if (Object.keys(r).length) resultados.set(l.id, r);\n      feitos++;\n      mostrarProgresso(l.titulo);\n      await esperar(250);\n    }\n  };\n  await Promise.all([trabalhar(), trabalhar()]);\n\n  const contagem = { capa: 0, editora: 0, ano: 0, paginas: 0, autores: 0, formato: 0 };\n  let removidas = 0;\n  const houveMudanca = [...resultados.values()].some(r => Object.keys(r).some(k => k !== 'capaQuebrada') || (r.capaQuebrada && algumaImagemCarregou));\n  if (houveMudanca) {\n    alterar(() => {\n      for (const [id, r] of resultados) {\n        const l = livroPorId(id);\n        if (!l) continue;\n        if (r.capa) { l.capa = r.capa; estado.capasQuebradas.delete(id); contagem.capa++; }\n        else if (r.capaQuebrada && algumaImagemCarregou) { l.capa = ''; removidas++; }\n        for (const k of ['editora', 'ano', 'paginas', 'formato']) if (r[k] && !l[k]) { l[k] = r[k]; contagem[k]++; }\n        if (r.autores && !autorPrincipal(l)) { l.autores = r.autores; contagem.autores++; }\n      }\n    });\n  }\n\n  const rotulos = { capa: ['capa', 'capas'], editora: ['editora', 'editoras'], ano: ['ano', 'anos'], paginas: ['número de páginas', 'números de páginas'], autores: ['autoria', 'autorias'], formato: ['formato', 'formatos'] };\n  const preenchidos = Object.entries(contagem).filter(([, n]) => n).map(([k, n]) => plural(n, rotulos[k][0], rotulos[k][1]));\n  let resumo;\n  if (!preenchidos.length && consultasSemRede >= Math.min(3, alvos.length) && !algumaImagemCarregou) {\n    resumo = 'Não foi possível consultar as bases de livros agora. Confira a conexão com a internet e tente de novo.';\n  } else {\n    resumo = preenchidos.length ? `Preenchido agora: ${juntarNomes(preenchidos)}.` : 'Nenhum dado novo encontrado nas bases.';\n    if (removidas) resumo += ` ${plural(removidas, 'capa que não carregava foi removida', 'capas que não carregavam foram removidas')}.`;\n    if (semResposta.length) resumo += ` ${plural(semResposta.length, 'ISBN não foi encontrado', 'ISBNs não foram encontrados')} em nenhuma base: use Procurar edição.`;\n    if (estado.erroGoogle) resumo += ` ${estado.erroGoogle}`;\n    if (houveMudanca && !gravaSozinho()) resumo += ' Use Salvar para gravar no arquivo.';\n    if (estado.lote.cancelado) resumo = 'Consulta interrompida. ' + resumo;\n  }\n  abrirRevisao({ resumo });\n}\n\n/* ===== Procurar edição por título e autor ===== */\n\nfunction edicaoDaOpenLibrary(e, obra) {\n  const isbn = normalizarISBN((e.isbn_13 || [])[0] || (e.isbn_10 || [])[0]) || '';\n  return {\n    fonte: 'Open Library',\n    isbn,\n    titulo: e.title || (obra && obra.title) || '',\n    autores: ((obra && obra.author_name) || []).flatMap(n => autoresDeTexto(n)),\n    editora: limparEditora((e.publishers || [])[0]),\n    ano: anoDeTexto(e.publish_date),\n    paginas: paginasDeValor(e.number_of_pages),\n    capas: (e.covers || []).filter(c => c > 0).slice(0, 1).map(c => `https://covers.openlibrary.org/b/id/${c}-M.jpg`),\n  };\n}\n\nasync function procurarEdicoes(livro) {\n  const autor = autorPrincipal(livro);\n  const sobrenome = autor ? (autor.sobrenome || sugerirSobrenome(autor.nome)) : '';\n  const alvo = chaveNome(semArtigo(livro.titulo));\n  const lista = [];\n  let falhas = 0;\n  if (chaveGoogle() || !estado.googleIndisponivel) {\n    try {\n      const q = `intitle:${livro.titulo}${sobrenome ? ` inauthor:${sobrenome}` : ''}`;\n      const r = await obterJSON(urlGoogle(`volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`), { tentativas: 2 });\n      for (const item of (r && r.items) || []) lista.push(edicaoDoGoogle(item));\n    } catch (e) {\n      registrarErroGoogle(e);\n      falhas++;\n    }\n  }\n  try {\n    const r = await obterJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(livro.titulo)}${sobrenome ? `&author=${encodeURIComponent(sobrenome)}` : ''}&limit=3&fields=key,title,author_name`, { tentativas: 1 });\n    for (const obra of ((r && r.docs) || []).slice(0, 2)) {\n      const ed = await obterJSON(`https://openlibrary.org${obra.key}/editions.json?limit=40`, { tentativas: 1 });\n      for (const e of (ed && ed.entries) || []) {\n        const idiomas = (e.languages || []).map(x => x.key);\n        if (idiomas.length && !idiomas.includes('/languages/por')) continue;\n        lista.push(edicaoDaOpenLibrary(e, obra));\n      }\n    }\n  } catch (e) {\n    falhas++;\n  }\n  const vistos = new Set();\n  const filtrada = lista.filter(ed => {\n    const k = chaveNome(semArtigo(ed.titulo));\n    if (!k || !(k.includes(alvo) || alvo.includes(k))) return false;\n    if (!(ed.isbn || ed.editora || ed.ano || ed.paginas)) return false;\n    const chave = ed.isbn || `${k}|${chaveNome(ed.editora)}|${ed.ano}|${ed.paginas}`;\n    if (vistos.has(chave)) return false;\n    vistos.add(chave);\n    return true;\n  });\n  const pontos = ed => (chaveNome(semArtigo(ed.titulo)) === alvo ? 4 : 0) + (ed.isbn ? 2 : 0) + (ed.paginas ? 1 : 0) + (ed.capas.length ? 1 : 0);\n  return { edicoes: filtrada.sort((a, b) => pontos(b) - pontos(a)).slice(0, 15), semConexao: !lista.length && falhas >= 2 };\n}\n\nasync function abrirProcurarEdicao(id) {\n  const l = livroPorId(id);\n  if (!l) return;\n  const voltarRevisao = estado.voltarPara === 'revisao' || !!document.querySelector('#modal[open] .lista-revisao');\n  estado.edicoes = { id, lista: [], voltarRevisao };\n  estado.erroGoogle = '';\n  abrirModal({\n    titulo: 'Procurar edição',\n    subtitulo: `${esc(l.titulo)}${nomesAutores(l) ? `, ${esc(nomesAutores(l))}` : ''}`,\n    corpo: '<p class=\"detalhe\" data-edicoes-status>Procurando edições no Google Books e na Open Library…</p><ul class=\"lista-edicoes\" data-edicoes></ul>',\n    rodape: `${voltarRevisao ? '<button type=\"button\" class=\"botao esquerda\" data-acao=\"revisar-dados\">Voltar à revisão</button>' : ''}<button type=\"button\" class=\"botao primario\" data-acao=\"fechar-modal\">Fechar</button>`,\n  });\n  const { edicoes, semConexao } = await procurarEdicoes(l);\n  const status = document.querySelector('[data-edicoes-status]');\n  const alvo = document.querySelector('[data-edicoes]');\n  if (!status || !alvo || estado.edicoes.id !== id) return;\n  estado.edicoes.lista = edicoes;\n  if (!edicoes.length) {\n    status.textContent = semConexao\n      ? 'Sem conexão com as bases de livros agora. Tente de novo mais tarde.'\n      : `Nenhuma edição encontrada com esse título e autor.${estado.erroGoogle ? ` ${estado.erroGoogle}` : ''} Se tiver o livro em mãos, o ISBN costuma estar na contracapa ou na ficha catalográfica.`;\n    return;\n  }\n  const faltam = ['isbn', 'editora', 'ano', 'paginas'].filter(k => !l[k]);\n  status.textContent = `Escolha a edição que você tem. Serão preenchidos só os campos em branco${faltam.length ? ` (${juntarNomes(faltam.map(k => ({ isbn: 'ISBN', editora: 'editora', ano: 'ano', paginas: 'páginas' })[k]))})` : ''} e a capa, se faltar.${estado.erroGoogle ? ` ${estado.erroGoogle}` : ''}`;\n  alvo.innerHTML = edicoes.map((ed, i) => `<li class=\"edicao\">\n      <div class=\"edicao-capa\">${ed.capas.length ? `<img src=\"${esc(ed.capas[0])}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\">` : ''}</div>\n      <div>\n        <p class=\"edicao-titulo\">${esc(ajustarTitulo(ed.titulo))}</p>\n        <p class=\"detalhe\">${esc(ed.autores.map(a => a.nome).join(', ') || 'Autor não informado')}</p>\n        <p class=\"detalhe\">${esc([ed.editora, ed.ano, ed.paginas ? `${ed.paginas} páginas` : ''].filter(Boolean).join(', ') || 'Sem editora, ano ou páginas')}</p>\n        <p class=\"detalhe\">${ed.isbn ? `ISBN ${esc(ed.isbn)}` : 'Sem ISBN'}, fonte: ${esc(ed.fonte)}</p>\n      </div>\n      <button type=\"button\" class=\"botao pequeno\" data-acao=\"usar-edicao\" data-indice=\"${i}\">Usar esta edição</button>\n    </li>`).join('');\n}\n\nasync function usarEdicao(indice) {\n  const { id, lista, voltarRevisao } = estado.edicoes || {};\n  const l = livroPorId(id);\n  const ed = lista && lista[indice];\n  if (!l || !ed) return;\n  let capa = '';\n  if ((!urlCapaSegura(l.capa) || estado.capasQuebradas.has(l.id)) && ed.capas.length) capa = await primeiraImagemValida(ed.capas);\n  if (!capa && (!urlCapaSegura(l.capa) || estado.capasQuebradas.has(l.id)) && ed.isbn) capa = await buscarCapa(ed.isbn);\n  const preenchidos = [];\n  alterar(() => {\n    if (!l.isbn && !l.semIsbn && ed.isbn) { l.isbn = ed.isbn; preenchidos.push('ISBN'); }\n    if (!l.editora && ed.editora) { l.editora = ed.editora; preenchidos.push('editora'); }\n    if (!l.ano && ed.ano) { l.ano = ed.ano; preenchidos.push('ano'); }\n    if (!l.paginas && ed.paginas) { l.paginas = ed.paginas; preenchidos.push('páginas'); }\n    if (capa) { l.capa = capa; estado.capasQuebradas.delete(l.id); preenchidos.push('capa'); }\n  }, { mensagem: preenchidos.length ? `${l.titulo}: ${juntarNomes(preenchidos)} preenchido${preenchidos.length > 1 ? 's' : ''}` : `${l.titulo}: nada em branco para preencher` });\n  if (voltarRevisao) abrirRevisao();\n  else abrirLivro(id);\n}\n\n/* ===== Leituras ===== */\n\nfunction abrirTerminarLeitura(id) {\n  const l = livroPorId(id);\n  estado.formulario = { id };\n  abrirModal({\n    titulo: 'Marcar como lido',\n    subtitulo: esc(l.titulo),\n    classe: 'pequeno',\n    formulario: 'terminar',\n    corpo: `<div class=\"campos\">\n        <label class=\"campo c6\"><span>Término</span><input type=\"date\" name=\"fim\" value=\"${hojeISO()}\" min=\"${esc(l.inicio || '')}\" required></label>\n        <div class=\"campo c6\"><span>Nota</span>${notaEntradaHTML(l.nota, l.favorito)}</div>\n      </div><p class=\"mensagem-erro\" data-erro-form></p>`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Marcar como lido</button>',\n  });\n}\n\nfunction textoDaComemoracao(livro) {\n  const ano = (livro.fim || hojeISO()).slice(0, 4);\n  const doAno = leiturasConcluidas(dados).filter(r => r.fim.startsWith(ano)).length;\n  const meta = Number(dados.metas[ano]) || 0;\n  const ordinal = `${numero(doAno)}º livro terminado em ${ano}`;\n  if (!meta) return ordinal + '.';\n  if (doAno === meta) return `${ordinal}. Meta de ${ano} cumprida!`;\n  if (doAno > meta) return `${ordinal}, ${plural(doAno - meta, 'livro além da meta', 'livros além da meta')} de ${ano}.`;\n  return `${ordinal}. ${plural(meta - doAno, 'livro', 'livros')} para a meta de ${ano}.`;\n}\n\nfunction soltarConfete(tela) {\n  const ctx = tela.getContext('2d');\n  const proporcao = window.devicePixelRatio || 1;\n  const ajustar = () => {\n    tela.width = innerWidth * proporcao;\n    tela.height = innerHeight * proporcao;\n    ctx.setTransform(proporcao, 0, 0, proporcao, 0, 0);\n  };\n  ajustar();\n  const cores = ['#E4572E', '#F3A712', '#2F6B45', '#4F3B99', '#A43C6E', '#0E6B7D', '#8C5F1D'];\n  const pecas = Array.from({ length: 140 }, () => ({\n    x: Math.random() * innerWidth,\n    y: -30 - Math.random() * innerHeight * 0.6,\n    largura: 5 + Math.random() * 7,\n    altura: 8 + Math.random() * 10,\n    cor: cores[Math.floor(Math.random() * cores.length)],\n    vy: 2.2 + Math.random() * 3.4,\n    vx: -1.2 + Math.random() * 2.4,\n    giro: Math.random() * Math.PI,\n    vgiro: -0.18 + Math.random() * 0.36,\n  }));\n  const inicio = performance.now();\n  const passo = agora => {\n    if (!tela.isConnected) return;\n    const passados = agora - inicio;\n    ctx.clearRect(0, 0, innerWidth, innerHeight);\n    for (const p of pecas) {\n      p.x += p.vx;\n      p.y += p.vy;\n      p.giro += p.vgiro;\n      ctx.save();\n      ctx.translate(p.x, p.y);\n      ctx.rotate(p.giro);\n      ctx.globalAlpha = passados > 3200 ? Math.max(0, 1 - (passados - 3200) / 1200) : 1;\n      ctx.fillStyle = p.cor;\n      ctx.fillRect(-p.largura / 2, -p.altura / 2, p.largura, p.altura);\n      ctx.restore();\n    }\n    if (passados < 4400) requestAnimationFrame(passo);\n  };\n  requestAnimationFrame(passo);\n}\n\nfunction comemorarLeitura(livro) {\n  if (dados.preferencias.comemorar === false) return;\n  const anterior = document.querySelector('.festa');\n  if (anterior) anterior.remove();\n  const festa = document.createElement('div');\n  festa.className = 'festa';\n  festa.setAttribute('role', 'status');\n  festa.innerHTML = `<canvas class=\"festa-confete\" aria-hidden=\"true\"></canvas>\n    <div class=\"festa-cartao\">\n      <p class=\"festa-titulo\">Parabéns!</p>\n      <p class=\"festa-livro\">${esc(livro.titulo)}</p>\n      ${livro.nota ? estrelasHTML(livro.nota, 22) : ''}\n      ${livro.favorito ? '<p class=\"festa-coracao\" aria-hidden=\"true\">♥</p>' : ''}\n      <p class=\"festa-detalhe\">${esc(textoDaComemoracao(livro))}</p>\n      <p class=\"detalhe\">Toque para fechar</p>\n    </div>`;\n  document.body.appendChild(festa);\n  let tempo = null;\n  const fechar = () => { clearTimeout(tempo); festa.remove(); };\n  festa.addEventListener('click', fechar);\n  tempo = setTimeout(fechar, 6000);\n  const reduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  if (!reduzido) soltarConfete(festa.querySelector('canvas'));\n}\n\nfunction enviarTerminar(form) {\n  const l = livroPorId(estado.formulario.id);\n  const fim = form.querySelector('[name=\"fim\"]').value;\n  if (!dataValida(fim)) { form.querySelector('[data-erro-form]').textContent = 'Informe a data de término.'; return; }\n  if (l.inicio && fim < l.inicio) { form.querySelector('[data-erro-form]').textContent = 'O término não pode ser antes do início.'; return; }\n  const nota = Number(form.querySelector('[name=\"nota\"]').value) || null;\n  const favorito = !!form.querySelector('[name=\"favorito\"]').value;\n  alterar(() => Object.assign(l, { status: 'lido', fim, nota, favorito }), { mensagem: `${l.titulo} marcado como lido` });\n  fecharModal();\n  comemorarLeitura(l);\n}\n\nfunction abrirComecarLeitura(id, { releitura = false } = {}) {\n  const l = livroPorId(id);\n  estado.formulario = { id, releitura };\n  abrirModal({\n    titulo: releitura ? 'Registrar releitura' : 'Começar leitura',\n    subtitulo: esc(l.titulo),\n    classe: 'pequeno',\n    formulario: 'comecar',\n    corpo: `${releitura ? '<p>A leitura anterior fica guardada no histórico do livro e continua contando nas estatísticas.</p>' : ''}\n      <div class=\"campos\" style=\"margin-top:12px\"><label class=\"campo c6\"><span>Início</span><input type=\"date\" name=\"inicio\" value=\"${hojeISO()}\" required></label></div>`,\n    rodape: `<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">${releitura ? 'Registrar releitura' : 'Começar leitura'}</button>`,\n  });\n}\n\nfunction enviarComecar(form) {\n  const { id, releitura } = estado.formulario;\n  const l = livroPorId(id);\n  const inicio = form.querySelector('[name=\"inicio\"]').value;\n  if (!dataValida(inicio)) return;\n  alterar(() => {\n    if (releitura && l.status === 'lido') l.releituras.push({ inicio: l.inicio, fim: l.fim, nota: l.nota });\n    Object.assign(l, { status: 'lendo', inicio, fim: null, nota: releitura ? null : l.nota });\n  }, { mensagem: `Leitura de ${l.titulo} iniciada` });\n  fecharModal();\n}\n\n/* ===== Empréstimos ===== */\n\nfunction abrirEmprestar(id) {\n  const disponiveis = livrosOrdenadosPorCodigo('fisico').filter(l => !l.emprestimos.some(e => !e.devolvido));\n  if (!disponiveis.length) { avisar('Todos os seus livros físicos já estão emprestados.'); return; }\n  const escolhido = id && disponiveis.some(l => l.id === id) ? id : '';\n  abrirModal({\n    titulo: 'Emprestar um livro seu',\n    classe: 'pequeno',\n    formulario: 'emprestar',\n    corpo: `<div class=\"campos\">\n        <label class=\"campo c6\"><span>Livro</span><select name=\"livro\" required>${escolhido ? '' : '<option value=\"\">Escolha um livro</option>'}${disponiveis.map(l => `<option value=\"${esc(l.id)}\"${l.id === escolhido ? ' selected' : ''}>${esc(codigoDe(l))}. ${esc(l.titulo)}</option>`).join('')}</select></label>\n        <label class=\"campo c6\"><span>Para quem</span><input type=\"text\" name=\"pessoa\" list=\"pessoas-conhecidas\" required></label>\n        <label class=\"campo c3\"><span>Data</span><input type=\"date\" name=\"data\" value=\"${hojeISO()}\"></label>\n        <label class=\"campo c3\"><span>Devolver até</span><input type=\"date\" name=\"devolver\"></label>\n      </div>${pessoasDatalist()}<p class=\"mensagem-erro\" data-erro-form></p>`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Registrar empréstimo</button>',\n  });\n}\n\nfunction enviarEmprestar(form) {\n  const erro = form.querySelector('[data-erro-form]');\n  const l = livroPorId(form.querySelector('[name=\"livro\"]').value);\n  const pessoa = form.querySelector('[name=\"pessoa\"]').value.trim();\n  if (!l) { erro.textContent = 'Escolha o livro.'; return; }\n  if (!pessoa) { erro.textContent = 'Informe para quem o livro foi emprestado.'; return; }\n  alterar(() => l.emprestimos.push({\n    id: novoId('e'), tipo: 'emprestei', pessoa,\n    data: form.querySelector('[name=\"data\"]').value || null,\n    devolverAte: form.querySelector('[name=\"devolver\"]').value || null,\n    devolvido: false, devolvidoEm: null,\n  }), { mensagem: `${l.titulo} emprestado para ${pessoa}` });\n  fecharModal();\n}\n\nfunction abrirDevolucao(id, empId) {\n  const l = livroPorId(id);\n  const emp = l && l.emprestimos.find(e => e.id === empId);\n  if (!emp) return;\n  estado.formulario = { id, empId };\n  abrirModal({\n    titulo: 'Registrar devolução',\n    subtitulo: `${esc(l.titulo)}, ${emp.tipo === 'peguei' ? `emprestado por ${esc(emp.pessoa || 'pessoa não informada')}` : `com ${esc(emp.pessoa || 'pessoa não informada')}`}`,\n    classe: 'pequeno',\n    formulario: 'devolucao',\n    corpo: `<div class=\"campos\"><label class=\"campo c6\"><span>Devolvido em</span><input type=\"date\" name=\"data\" value=\"${hojeISO()}\"></label></div>`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Registrar devolução</button>',\n  });\n}\n\nfunction enviarDevolucao(form) {\n  const { id, empId } = estado.formulario;\n  const l = livroPorId(id);\n  const emp = l.emprestimos.find(e => e.id === empId);\n  alterar(() => Object.assign(emp, { devolvido: true, devolvidoEm: form.querySelector('[name=\"data\"]').value || null }), { mensagem: 'Devolução registrada' });\n  fecharModal();\n}\n\n/* ===== Desejo que chegou ===== */\n\nfunction abrirChegou(id) {\n  const l = livroPorId(id);\n  estado.formulario = { id };\n  abrirModal({\n    titulo: 'Chegou',\n    subtitulo: esc(l.titulo),\n    classe: 'pequeno',\n    formulario: 'chegou',\n    corpo: `<div class=\"opcoes-radio\">\n        <label class=\"opcao-radio\"><input type=\"radio\" name=\"tipo\" value=\"fisico\" checked><span><strong>Livro físico meu</strong><br><span class=\"detalhe\">Recebe um número na biblioteca pessoal, na posição da categoria.</span></span></label>\n        <label class=\"opcao-radio\"><input type=\"radio\" name=\"tipo\" value=\"digital\"><span><strong>E-book</strong><br><span class=\"detalhe\">Recebe o próximo código E.</span></span></label>\n        <label class=\"opcao-radio\"><input type=\"radio\" name=\"tipo\" value=\"emprestado\"><span><strong>Emprestado</strong><br><span class=\"detalhe\">Recebe o próximo código EMP.</span></span></label>\n      </div>\n      <div class=\"campos\" style=\"margin-top:14px\">\n        <label class=\"campo c3\" data-se-tipo=\"fisico\"><span>Formato</span><select name=\"formato\">${opcoesHTML(FORMATOS.filter(f => ['brochura', 'capa-dura'].includes(f[0])), 'brochura')}</select></label>\n        <label class=\"campo c3\" data-se-tipo=\"emprestado\" hidden><span>Emprestado por</span><input type=\"text\" name=\"pessoa\" list=\"pessoas-conhecidas\"></label>\n        <label class=\"campo c3\" data-se-tipo=\"emprestado\" hidden><span>Devolver até</span><input type=\"date\" name=\"devolver\"></label>\n      </div>${pessoasDatalist()}`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Colocar na biblioteca</button>',\n  });\n}\n\nfunction enviarChegou(form) {\n  const l = livroPorId(estado.formulario.id);\n  const tipo = form.querySelector('[name=\"tipo\"]:checked').value;\n  alterar(() => {\n    l.prioridade = '';\n    l.chegada = dados.proximaChegada++;\n    if (tipo === 'fisico') Object.assign(l, { posse: 'propria', formato: form.querySelector('[name=\"formato\"]').value });\n    if (tipo === 'digital') Object.assign(l, { posse: 'propria', formato: 'e-book' });\n    if (tipo === 'emprestado') {\n      Object.assign(l, { posse: 'emprestada', formato: l.formato === 'e-book' ? '' : l.formato });\n      l.emprestimos.push({ id: novoId('e'), tipo: 'peguei', pessoa: form.querySelector('[name=\"pessoa\"]').value.trim(), data: hojeISO(), devolverAte: form.querySelector('[name=\"devolver\"]').value || null, devolvido: false, devolvidoEm: null });\n    }\n  }, { mensagem: () => `${l.titulo} entrou como ${estado.codigos.get(l.id)}` });\n  fecharModal();\n}\n\n/* ===== Metas, mudanças e categorias ===== */\n\nfunction abrirMeta(ano) {\n  estado.formulario = {};\n  abrirModal({\n    titulo: 'Meta de leitura',\n    classe: 'pequeno',\n    formulario: 'meta',\n    corpo: `<div class=\"campos\">\n        <label class=\"campo c2\"><span>Ano</span><input type=\"number\" name=\"ano\" min=\"1900\" max=\"2100\" value=\"${esc(ano)}\" required></label>\n        <label class=\"campo c4\"><span>Livros para terminar</span><input type=\"number\" name=\"meta\" min=\"1\" max=\"999\" value=\"${esc(dados.metas[ano] || '')}\" required></label>\n      </div><p class=\"mensagem-erro\" data-erro-form></p>`,\n    rodape: '<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Definir meta</button>',\n  });\n  setTimeout(() => $('#modal [name=\"meta\"]')?.focus(), 30);\n}\n\nfunction enviarMeta(form) {\n  const ano = parseInt(form.querySelector('[name=\"ano\"]').value, 10);\n  const meta = parseInt(form.querySelector('[name=\"meta\"]').value, 10);\n  if (!(ano >= 1900 && ano <= 2100) || !(meta > 0)) { form.querySelector('[data-erro-form]').textContent = 'Informe um ano e uma quantidade de livros maior que zero.'; return; }\n  alterar(() => { dados.metas[String(ano)] = meta; }, { mensagem: `Meta de ${ano}: ${plural(meta, 'livro', 'livros')}` });\n  fecharModal();\n}\n\nfunction abrirMudancas({ trocas, entradas, saidas }) {\n  const linhas = [\n    ...entradas.map(m => ({ ordem: Number(m.depois), html: `<tr><td><span class=\"etiqueta\">${esc(m.depois)}</span></td><td>Entrou</td><td class=\"col-titulo\">${esc(m.titulo)}</td></tr>` })),\n    ...trocas.map(m => ({ ordem: Number(m.depois), html: `<tr><td><span class=\"etiqueta\">${esc(m.depois)}</span></td><td>Era ${esc(m.antes)}</td><td class=\"col-titulo\">${esc(m.titulo)}</td></tr>` })),\n    ...saidas.map(m => ({ ordem: 100000 + Number(m.antes), html: `<tr><td>Saiu</td><td>Era ${esc(m.antes)}</td><td class=\"col-titulo\">${esc(m.titulo || '')}</td></tr>` })),\n  ].sort((a, b) => a.ordem - b.ordem).map(x => x.html).join('');\n  abrirModal({\n    titulo: 'Mudanças na numeração',\n    subtitulo: 'Se você usa etiquetas nos livros, estas são as que precisam ser trocadas.',\n    corpo: `<div class=\"rolagem\"><table class=\"tabela\"><thead><tr><th>Agora</th><th>Antes</th><th>Livro</th></tr></thead><tbody>${linhas}</tbody></table></div>`,\n    rodape: '<button type=\"button\" class=\"botao primario\" data-acao=\"fechar-modal\">Fechar</button>',\n  });\n}\n\n/* ===== Editar e excluir registros de empréstimo ===== */\n\nfunction abrirEditarEmprestimo(id, empId) {\n  const l = livroPorId(id);\n  const e = l && l.emprestimos.find(x => x.id === empId);\n  if (!e) return;\n  const peguei = e.tipo === 'peguei';\n  estado.formulario = { id, empId };\n  abrirModal({\n    titulo: 'Editar empréstimo',\n    subtitulo: `${esc(l.titulo)}, ${peguei ? 'livro que você pegou emprestado' : 'livro que você emprestou'}`,\n    classe: 'pequeno',\n    formulario: 'emprestimo',\n    corpo: `<div class=\"campos\">\n        <label class=\"campo c6\"><span>${peguei ? 'Emprestado por' : 'Emprestado para'}</span><input type=\"text\" name=\"pessoa\" value=\"${esc(e.pessoa || '')}\" list=\"pessoas-conhecidas\"></label>\n        <label class=\"campo c3\"><span>Data do empréstimo</span><input type=\"date\" name=\"data\" value=\"${esc(e.data || '')}\"></label>\n        <label class=\"campo c3\"><span>Devolver até</span><input type=\"date\" name=\"devolver\" value=\"${esc(e.devolverAte || '')}\"></label>\n        <label class=\"c3 opcao-check\"><input type=\"checkbox\" name=\"devolvido\"${e.devolvido ? ' checked' : ''}> Já foi devolvido</label>\n        <label class=\"campo c3\"><span>Devolvido em</span><input type=\"date\" name=\"devolvido-em\" value=\"${esc(e.devolvidoEm || '')}\"></label>\n      </div>${pessoasDatalist()}\n      <p class=\"mensagem-erro\" data-erro-form></p>`,\n    rodape: `<button type=\"button\" class=\"botao discreto perigo esquerda\" data-acao=\"excluir-emprestimo\" data-id=\"${esc(id)}\" data-emp=\"${esc(empId)}\">Excluir registro</button><button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">Aplicar alterações</button>`,\n  });\n}\n\nfunction enviarEmprestimo(form) {\n  const { id, empId } = estado.formulario;\n  const l = livroPorId(id);\n  const e = l && l.emprestimos.find(x => x.id === empId);\n  if (!e) return;\n  const valor = nome => form.querySelector(`[name=\"${nome}\"]`).value.trim();\n  const erro = form.querySelector('[data-erro-form]');\n  const data = valor('data') || null;\n  const devolverAte = valor('devolver') || null;\n  const devolvido = form.querySelector('[name=\"devolvido\"]').checked;\n  const devolvidoEm = devolvido ? (valor('devolvido-em') || null) : null;\n  if (data && devolvidoEm && devolvidoEm < data) { erro.textContent = 'A devolução não pode ser antes do empréstimo.'; return; }\n  if (data && devolverAte && devolverAte < data) { erro.textContent = 'O prazo de devolução não pode ser antes do empréstimo.'; return; }\n  alterar(() => Object.assign(e, { pessoa: valor('pessoa'), data, devolverAte, devolvido, devolvidoEm, manual: true, pelaLeitura: false }), { mensagem: 'Empréstimo atualizado' });\n  abrirLivro(id);\n}\n\nasync function excluirEmprestimo(id, empId) {\n  const l = livroPorId(id);\n  const e = l && l.emprestimos.find(x => x.id === empId);\n  if (!e) return;\n  const ok = await confirmar({\n    titulo: 'Excluir registro de empréstimo',\n    texto: `${descricaoEmprestimo(e)} Este registro de ${l.titulo} será apagado. O livro continua na biblioteca.`,\n    ok: 'Excluir registro',\n    perigo: true,\n  });\n  if (!ok) return;\n  const janelaAberta = $('#modal').open;\n  alterar(() => { l.emprestimos = l.emprestimos.filter(x => x.id !== empId); }, { mensagem: 'Registro de empréstimo excluído' });\n  if (janelaAberta) abrirLivro(id);\n}\n\n/* ===== Janela de revisão dos dados ===== */\n\nfunction abrirTodasLeituras() {\n  const leituras = leiturasConcluidas(dados);\n  if (!leituras.length) { avisar('Nenhuma leitura concluída ainda.'); return; }\n  const porAno = new Map();\n  for (const r of leituras) {\n    const ano = r.fim.slice(0, 4);\n    if (!porAno.has(ano)) porAno.set(ano, []);\n    porAno.get(ano).push(r);\n  }\n  const blocos = [...porAno].map(([ano, itens]) => `<section class=\"bloco-leituras\">\n      <h3 class=\"titulo-ano\">${esc(ano)} <span class=\"detalhe\">${plural(itens.length, 'livro', 'livros')}</span></h3>\n      <ul class=\"lista-leituras\">${itens.map(r => `<li class=\"item-leitura\">\n        <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(r.livro.id)}\" aria-label=\"Abrir ${esc(r.livro.titulo)}\">${capaHTML(r.livro, 'pequena mini')}</button>\n        <div class=\"item-leitura-texto\">\n          <p class=\"item-leitura-titulo\">${esc(r.livro.titulo)}${coracaoHTML(r.livro)}</p>\n          <p class=\"detalhe\">${esc(nomesAutores(r.livro))}</p>\n        </div>\n        <div class=\"item-leitura-fim\">\n          ${estrelasHTML(r.nota, 13)}\n          <p class=\"detalhe\">${dataBR(r.fim)}</p>\n        </div>\n      </li>`).join('')}</ul>\n    </section>`).join('');\n  abrirModal({\n    titulo: 'Todas as leituras',\n    subtitulo: `${plural(leituras.length, 'leitura concluída', 'leituras concluídas')}, da mais recente para a mais antiga`,\n    corpo: blocos,\n    rodape: '<button type=\"button\" class=\"botao primario\" data-acao=\"fechar-modal\">Fechar</button>',\n  });\n}\n\nfunction abrirRevisao({ resumo = '' } = {}) {\n  estado.voltarPara = null;\n  const { importantes, complementos } = revisarDados(dados, capasQuebradasConfirmadas());\n  const cabecalhoLivro = l => `${codigoDe(l) ? `<span class=\"etiqueta\">${esc(codigoDe(l))}</span>` : ''}${esc(l.titulo)}`;\n  const botaoEditar = l => `<span class=\"acoes-item\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"procurar-edicao\" data-id=\"${esc(l.id)}\">Procurar edição</button><button type=\"button\" class=\"botao pequeno\" data-acao=\"editar-livro\" data-id=\"${esc(l.id)}\" data-voltar=\"revisao\">Editar</button></span>`;\n  const ordenar = lista => [...lista].sort((a, b) => compararCodigos(codigoDe(a.livro || a), codigoDe(b.livro || b)));\n  const grupos = [\n    ['isbn', 'Sem ISBN', 'Sem ISBN, a busca automática não funciona para o livro. Se a edição realmente não tem ISBN, use Não tem ISBN e ela sai desta lista.'],\n    ['paginas', 'Sem número de páginas', 'Livros ainda não lidos; ao terminar a leitura, eles entram no total de páginas.'],\n    ['editora', 'Sem editora', ''],\n    ['ano', 'Sem ano da edição', ''],\n    ['formato', 'Formato não informado', ''],\n    ['capa', 'Sem capa', ''],\n  ];\n  const livrosComComplemento = new Set(Object.values(complementos).flat().map(l => l.id)).size;\n  abrirModal({\n    titulo: 'Revisão dos dados',\n    subtitulo: `${plural(dados.livros.length, 'livro verificado', 'livros verificados')}`,\n    corpo: `${resumo ? `<p class=\"resumo-lote destaque-lote\">${esc(resumo)}</p>` : ''}<p class=\"resumo-lote\">${importantes.length ? `${plural(importantes.length, 'livro tem', 'livros têm')} algo que afeta a estante ou as estatísticas.` : 'Nada que afete a estante ou as estatísticas.'}${livrosComComplemento ? ` ${plural(livrosComComplemento, 'livro tem', 'livros têm')} complementos em branco.` : ''}</p>\n      ${importantes.length ? `<h3 class=\"titulo-revisao\">Afetam a estante ou as estatísticas</h3>\n        <ul class=\"lista-revisao\">${ordenar(importantes).map(({ livro, itens }) => `<li class=\"item-revisao\">\n          <div><p class=\"item-revisao-titulo\">${cabecalhoLivro(livro)}</p><p class=\"detalhe\">${esc(itens.join('; ').replace(/^./, c => c.toUpperCase()))}.</p></div>\n          ${botaoEditar(livro)}\n        </li>`).join('')}</ul>` : ''}\n      <h3 class=\"titulo-revisao\">Complementos em branco</h3>\n      <p class=\"detalhe\">Não mudam a estante nem as estatísticas, mas deixam o catálogo completo.</p>\n      ${grupos.filter(([chave]) => complementos[chave].length).map(([chave, rotulo, explicacao]) => `<details class=\"grupo-revisao\">\n        <summary><span>${rotulo}</span><span class=\"qtd\">${plural(complementos[chave].length, 'livro', 'livros')}</span></summary>\n        ${explicacao ? `<p class=\"detalhe\" style=\"margin-top:8px\">${explicacao}</p>` : ''}\n        <ul class=\"lista-revisao\">${ordenar(complementos[chave]).map(l => `<li class=\"item-revisao\"><p class=\"item-revisao-titulo\">${cabecalhoLivro(l)}</p>${chave === 'isbn' ? botaoEditar(l).replace('<span class=\"acoes-item\">', `<span class=\"acoes-item\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"marcar-sem-isbn\" data-id=\"${esc(l.id)}\">Não tem ISBN</button>`) : botaoEditar(l)}</li>`).join('')}</ul>\n      </details>`).join('') || '<p class=\"vazio\">Nenhum complemento em branco.</p>'}`,\n    rodape: `<button type=\"button\" class=\"botao esquerda\" data-acao=\"completar-dados\">Completar pelo ISBN</button><button type=\"button\" class=\"botao\" data-acao=\"ver-sem-capa\">Ver livros sem capa</button><button type=\"button\" class=\"botao primario\" data-acao=\"fechar-modal\">Fechar</button>`,\n  });\n}\n\n/* ===== Ações dos botões ===== */\n\nconst PALETAS = [\n  ['', 'Biblioteca', '#E6EAE4', '#4F3B99'],\n  ['rose', 'Rosé', '#F6EDEF', '#A43C6E'],\n  ['lavanda', 'Lavanda', '#EFEBF7', '#6D4FB3'],\n  ['oceano', 'Oceano', '#E3ECF0', '#0E6B7D'],\n];\n\nfunction paletaAtual() {\n  try { return localStorage.getItem('minha-biblioteca:paleta') || ''; } catch (e) { return ''; }\n}\n\nfunction aplicarPaleta(paleta) {\n  try {\n    if (paleta) localStorage.setItem('minha-biblioteca:paleta', paleta);\n    else localStorage.removeItem('minha-biblioteca:paleta');\n  } catch (e) { /* ignora */ }\n  if (paleta) document.documentElement.dataset.paleta = paleta;\n  else delete document.documentElement.dataset.paleta;\n}\n\nfunction aplicarTema(tema) {\n  try {\n    if (tema) localStorage.setItem('minha-biblioteca:tema', tema);\n    else localStorage.removeItem('minha-biblioteca:tema');\n  } catch (e) { /* ignora */ }\n  if (tema) document.documentElement.dataset.tema = tema;\n  else delete document.documentElement.dataset.tema;\n}\n\nfunction atualizarResultados() {\n  const alvo = $('#resultados');\n  if (!alvo) return;\n  if (estado.aba === 'biblioteca') alvo.innerHTML = conteudoBiblioteca();\n  if (estado.aba === 'todos') alvo.innerHTML = conteudoTodos();\n}\n\nfunction irPara(aba) {\n  estado.aba = aba;\n  render();\n  window.scrollTo(0, 0);\n}\n\nconst AC  obterJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:9788535909555&key=${encodeURIComponent(valor)}`, { tentativas: 1 });\n    const titulo = r && r.items && r.items[0] && r.items[0].volumeInfo && r.items[0].volumeInfo.title;\n    const texto = titulo ? `Chave guardada e funcionando: o Google Books respondeu com ${titulo}.` : 'Chave guardada e aceita pelo Google.';\n    if (situacao()) situacao().textContent = texto;\n    avisar(texto + final);\n  } catch (e) {\n    const texto = `Chave guardada, mas o teste falhou. ${explicarErroGoogle(e)}`;\n    if (situacao()) situacao().textContent = texto;\n    avisar(texto + final, { tempo: 12000 });\n  }\n}\n\n/* ===== Eventos ===== */\n\nfunction ligarDeslizar() {\n  let inicioX = null, inicioY = null, inicioEm = 0;\n  document.addEventListener('touchstart', e => {\n    inicioX = null;\n    if (e.touches.length !== 1) return;\n    const alvo = e.target;\n    if (alvo.closest && alvo.closest('dialog, .rolagem, .abas, .festa, input, textarea, select, [contenteditable]')) return;\n    const toque = e.touches[0];\n    if (toque.clientX < 32 || toque.clientX > innerWidth - 32) return;\n    inicioX = toque.clientX;\n    inicioY = toque.clientY;\n    inicioEm = Date.now();\n  }, { passive: true });\n\n  document.addEventListener('touchend', e => {\n    if (inicioX === null) return;\n    const toque = e.changedTouches[0];\n    const dx = toque.clientX - inicioX;\n    const dy = toque.clientY - inicioY;\n    const tempo = Date.now() - inicioEm;\n    inicioX = null;\n    if (tempo > 700 || Math.abs(dx) < 70 || Math.abs(dy) > 55) return;\n    if ($('#modal').open || $('#modal-confirmar').open) return;\n    const ordem = ABAS_MENU.map(a => a[0]);\n    const atual = ordem.indexOf(estado.aba);\n    if (atual === -1) {\n      if (dx > 0) { estado.aba = 'inicio'; render(); window.scrollTo(0, 0); }\n      return;\n    }\n    const destino = atual + (dx < 0 ? 1 : -1);\n    if (destino < 0 || destino >= ordem.length) return;\n    estado.aba = ordem[destino];\n    render();\n    window.scrollTo(0, 0);\n    const botao = document.querySelector(`.aba[data-aba=\"${estado.aba}\"]`);\n    if (botao && botao.scrollIntoView) botao.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });\n  }, { passive: true });\n}\n\nfunction bloquearZoom() {\n  if (!noApp()) return;\n  document.documentElement.classList.add('sem-zoom');\n  const impedir = e => { if (e.cancelable) e.preventDefault(); };\n  ['gesturestart', 'gesturechange', 'gestureend'].forEach(nome => document.addEventListener(nome, impedir, { passive: false }));\n  document.addEventListener('touchmove', e => {\n    if (e.touches.length > 1 && e.cancelable) e.preventDefault();\n  }, { passive: false });\n  document.addEventListener('dblclick', impedir, { passive: false });\n}\n\nfunction ligarEventos() {\n  bloquearZoom();\n  ligarDeslizar();\n\n  if (window.matchMedia) {\n    const estreita = window.matchMedia('(max-width: 680px)');\n    const redesenhar = () => { if (dados) render(); };\n    if (estreita.addEventListener) estreita.addEventListener('change', redesenhar);\n    else if (estreita.addListener) estreita.addListener(redesenhar);\n  }\n\n  document.addEventListener('toggle', e => {\n    const secao = e.target;\n    if (!secao || !secao.matches || !secao.matches('details.config-secao')) return;\n    if (!estado.configAbertas) estado.configAbertas = new Set();\n    if (secao.open) estado.configAbertas.add(secao.dataset.secao);\n    else estado.configAbertas.delete(secao.dataset.secao);\n  }, true);\n  let temporizadorPrevia = null;\n\n  document.addEventListener('click', e => {\n    const buscaCapa = e.target.closest('[data-alvo-capa]');\n    if (buscaCapa) {\n      estado.alvoCapa = buscaCapa.dataset.alvoCapa;\n      situacaoCapa(estado.alvoCapa, 'Copie a imagem da capa e volte para esta janela: clique em Colar imagem ou aperte Ctrl+V.');\n      return;\n    }\n    const linkForm = e.target.closest('[data-link-busca-capa]
