xmlformats-officedocument.spreadsheetml.sheet';\n  if ('showSaveFilePicker' in window) {\n    try {\n      const h = await window.showSaveFilePicker({ id: 'minha-biblioteca-excel', suggestedName: nome, types: [{ description: 'Planilha do Excel', accept: { [tipo]: ['.xlsx'] } }] });\n      const escrita = await h.createWritable();\n      await escrita.write(new Blob([bytes], { type: tipo }));\n      await escrita.close();\n      avisar(`Planilha salva em ${h.name}`);\n      return;\n    } catch (e) {\n      if (e.name === 'AbortError') return;\n    }\n  }\n  baixarArquivo(bytes, nome, tipo);\n  avisar('Planilha baixada');\n}\n\n/* ===== Janelas, confirmações e avisos ===== */\n\nfunction abrirModal({ titulo, subtitulo = '', corpo, rodape = '', classe = '', formulario = '' }) {\n  const janela = $('#modal');\n  janela.className = 'modal ' + classe;\n  const cabecalho = `<div class=\"modal-cabecalho\"><div><h2 class=\"modal-titulo\">${titulo}</h2>${subtitulo ? `<p class=\"modal-sub\">${subtitulo}</p>` : ''}</div><button type=\"button\" class=\"botao-fechar\" data-acao=\"fechar-modal\" aria-label=\"Fechar\">×</button></div>`;\n  const miolo = `<div class=\"modal-corpo\">${corpo}</div>${rodape ? `<div class=\"modal-rodape\">${rodape}</div>` : ''}`;\n  janela.innerHTML = cabecalho + (formulario ? `<form data-form=\"${formulario}\" novalidate>${miolo}</form>` : miolo);\n  if (!janela.open) janela.showModal();\n  janela.scrollTop = 0;\n  const corpoEl = janela.querySelector('.modal-corpo');\n  if (corpoEl) corpoEl.scrollTop = 0;\n}\n\nfunction fecharModal() {\n  const janela = $('#modal');\n  if (janela.open) janela.close();\n}\n\nfunction confirmar({ titulo, texto, ok = 'Confirmar', cancelar = 'Cancelar', perigo = false }) {\n  return new Promise(resolver => {\n    const janela = $('#modal-confirmar');\n    let respondido = false;\n    const responder = valor => {\n      if (respondido) return;\n      respondido = true;\n      if (janela.open) janela.close();\n      resolver(valor);\n    };\n    janela.innerHTML = `<div class=\"modal-cabecalho\"><h2 class=\"modal-titulo\">${esc(titulo)}</h2></div>\n      <div class=\"modal-corpo\"><p>${esc(texto)}</p></div>\n      <div class=\"modal-rodape\"><button type=\"button\" class=\"botao\" data-resposta=\"nao\">${esc(cancelar)}</button><button type=\"button\" class=\"botao ${perigo ? 'perigo-cheio' : 'primario'}\" data-resposta=\"sim\">${esc(ok)}</button></div>`;\n    janela.onclick = e => {\n      const botao = e.target.closest('[data-resposta]');\n      if (botao) responder(botao.dataset.resposta === 'sim');\n    };\n    janela.oncancel = () => responder(false);\n    janela.onclose = () => responder(false);\n    janela.showModal();\n    janela.querySelector('[data-resposta=\"sim\"]').focus();\n  });\n}\n\nfunction avisar(texto, { acao, fn, tempo = 6000 } = {}) {\n  const el = $('#aviso');\n  el.innerHTML = `<span>${esc(texto)}</span>${acao ? `<button type=\"button\" data-acao=\"aviso-acao\">${esc(acao)}</button>` : ''}`;\n  el.hidden = false;\n  estado.avisoFn = fn || null;\n  clearTimeout(estado.avisoTimer);\n  estado.avisoTimer = setTimeout(() => { el.hidden = true; }, tempo);\n}\n\n/* ===== Componentes ===== */\n\nconst ABAS = [\n  ['inicio', 'Início'],\n  ['biblioteca', 'Biblioteca pessoal'],\n  ['todos', 'Todos os livros'],\n  ['desejos', 'Desejos'],\n  ['emprestimos', 'Empréstimos'],\n  ['estatisticas', 'Estatísticas'],\n  ['config', 'Configurações'],\n];\n\nfunction capaHTML(livro, tamanho = '') {\n  const codigo = codigoDe(livro);\n  const imagem = urlCapaSegura(livro.capa) ? `<img class=\"capa-img\" src=\"${esc(livro.capa)}\" alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" data-livro=\"${esc(livro.id)}\">` : '';\n  return `<div class=\"capa ${tamanho}${imagem ? ' com-imagem' : ''}\" style=\"--cor:${corDaCategoria(livro.categoria)}\">${imagem}`\n    + `<span class=\"capa-titulo\">${esc(livro.titulo)}</span><span class=\"capa-autor\">${esc(nomesAutores(livro))}</span>`\n    + `${codigo ? `<span class=\"etiqueta\">${esc(codigo)}</span>` : ''}</div>`;\n}\n\nfunction estrelasHTML(nota, tamanho) {\n  if (!nota) return '';\n  return `<span class=\"estrelas\" style=\"--v:${Number(nota)}${tamanho ? `;--tam:${tamanho}px` : ''}\" role=\"img\" aria-label=\"Nota ${numero(nota, nota % 1 ? 1 : 0)} de 5\"></span>`;\n}\n\nfunction statusHTML(status) {\n  return `<span class=\"status status-${esc(status)}\">${esc(STATUS_ROTULO[status] || '')}</span>`;\n}\n\nfunction opcoesHTML(lista, selecionado) {\n  return lista.map(([valor, rotulo]) => `<option value=\"${esc(valor)}\"${String(valor) === String(selecionado ?? '') ? ' selected' : ''}>${esc(rotulo)}</option>`).join('');\n}\n\nfunction faixaNumeros(codigos) {\n  if (codigos.length === 1) return `Nº ${codigos[0]}`;\n  if (codigos.length === 2) return `${codigos[0]} e ${codigos[1]}`;\n  return `${codigos[0]} a ${codigos[codigos.length - 1]}`;\n}\n\nfunction bateBusca(livro, busca) {\n  if (!busca) return true;\n  const alvo = normalizar([livro.titulo, livro.serie, nomesAutores(livro, { papeis: true }), livro.isbn, codigoDe(livro), livro.editora].join(' '));\n  return normalizar(busca).split(/\\s+/).filter(Boolean).every(p => alvo.includes(p));\n}\n\nfunction livrosOrdenadosPorCodigo(grupo) {\n  return dados.livros.filter(l => grupoDe(l) === grupo).sort((a, b) => compararCodigos(codigoDe(a), codigoDe(b)));\n}\n\n/* ===== Estrutura ===== */\n\nfunction montarEsqueleto() {\n  $('#app').innerHTML = `\n    <header class=\"topo\"><div class=\"topo-interno\">\n      <div class=\"topo-linha\">\n        <h1 class=\"marca\">Minha biblioteca</h1>\n        <span class=\"estado-salvo\" id=\"estado-salvo\" aria-live=\"polite\"></span>\n        <button type=\"button\" class=\"botao\" data-acao=\"novo-livro\">Adicionar livro</button>\n        ${gravaSozinho() ? '' : '<button type=\"button\" class=\"botao\" id=\"botao-salvar\" data-acao=\"salvar\">Salvar</button>'}\n      </div>\n      <nav class=\"abas\" aria-label=\"Seções\">${ABAS.map(([id, nome]) => `<button type=\"button\" class=\"aba${id === 'config' ? ' aba-config' : ''}\" data-acao=\"aba\" data-aba=\"${id}\">${nome}</button>`).join('')}</nav>\n    </div></header>\n    <main class=\"conteudo\" id=\"conteudo\"></main>\n    <dialog class=\"modal\" id=\"modal\"></dialog>\n    <dialog class=\"modal pequeno\" id=\"modal-confirmar\"></dialog>\n    <div class=\"aviso\" id=\"aviso\" role=\"status\" hidden></div>\n    <input type=\"file\" accept=\".html,.htm,text/html\" data-importar hidden>`;\n}\n\nfunction renderEstadoSalvo() {\n  const el = $('#estado-salvo');\n  const botao = $('#botao-salvar');\n  if (!el) return;\n  if (noApp()) {\n    if (estado.erroOneDrive) { el.textContent = estado.erroOneDrive; el.className = 'estado-salvo pendente'; }\n    else if (estado.sincronizando) { el.textContent = 'Sincronizando com o OneDrive…'; el.className = 'estado-salvo'; }\n    else if (estado.erroGravacao) { el.textContent = estado.erroGravacao; el.className = 'estado-salvo pendente'; }\n    else if (oneDriveLigado() && lerSessaoOneDrive().ultimoSync) { el.textContent = `Sincronizado às ${dataHoraBR(lerSessaoOneDrive().ultimoSync).split(' às ')[1]}`; el.className = 'estado-salvo'; }\n    else if (estado.gravando || estado.pendentes) { el.textContent = 'Guardando…'; el.className = 'estado-salvo'; }\n    else el.textContent = estado.ultimoSalvo ? `Guardado no aparelho às ${dataHoraBR(estado.ultimoSalvo).split(' às ')[1]}` : 'Guardado no aparelho';\n    return;\n  }\n  if (naNuvem()) {\n    if (estado.erroNuvem) { el.textContent = estado.erroNuvem; el.className = 'estado-salvo pendente'; }\n    else if (estado.gravando || estado.pendentes) { el.textContent = 'Salvando na nuvem…'; el.className = 'estado-salvo'; }\n    else el.textContent = estado.ultimoSalvo ? `Salvo na nuvem às ${dataHoraBR(estado.ultimoSalvo).split(' às ')[1]}` : 'Salvo na nuvem';\n    return;\n  }\n  if (!botao) return;\n  if (estado.salvando) {\n    el.textContent = 'Salvando…';\n    el.className = 'estado-salvo';\n  } else if (estado.alterado) {\n    el.textContent = 'Alterações não salvas';\n    el.className = 'estado-salvo pendente';\n  } else {\n    el.textContent = `Salvo em ${dataHoraBR(dados.salvoEm)}`;\n    el.className = 'estado-salvo';\n  }\n  botao.className = 'botao' + (estado.alterado ? ' primario' : '');\n  botao.disabled = estado.salvando;\n}\n\nfunction render() {\n  if (estado.destaqueAte && Date.now() > estado.destaqueAte) {\n    estado.destaque = new Set();\n    estado.destaqueAte = 0;\n  }\n  document.querySelectorAll('.aba').forEach(b => {\n    if (b.dataset.aba === estado.aba) b.setAttribute('aria-current', 'page');\n    else b.removeAttribute('aria-current');\n  });\n  renderEstadoSalvo();\n  const telas = { inicio: telaInicio, biblioteca: telaBiblioteca, todos: telaTodos, desejos: telaDesejos, emprestimos: telaEmprestimos, estatisticas: telaEstatisticas, config: telaConfig };\n  $('#conteudo').innerHTML = (telas[estado.aba] || telaInicio)();\n}\n\n/* ===== Início ===== */\n\nfunction telaInicio() {\n  const hoje = hojeISO();\n  const ano = hoje.slice(0, 4);\n  const lendo = dados.livros.filter(l => l.status === 'lendo' && l.posse !== 'desejo')\n    .sort((a, b) => String(b.inicio || '').localeCompare(String(a.inicio || '')));\n  const pausados = dados.livros.filter(l => l.status === 'pausado' && l.posse !== 'desejo');\n  const concluidas = leiturasConcluidas(dados);\n  const lidosNoAno = concluidas.filter(r => r.fim.startsWith(ano)).length;\n  const abertos = emprestimosDe(dados, { abertos: true });\n  const semCapa = livrosSemCapa().length;\n  const paraRevisar = revisarDados(dados, capasQuebradasConfirmadas()).importantes.length;\n\n  const itemLendo = l => {\n    const dias = dataValida(l.inicio) ? diasEntre(l.inicio, hoje) : null;\n    const quando = dias === null ? 'Sem data de início.' : dias <= 0 ? `Começou hoje.` : `Começou em ${dataBR(l.inicio)}, há ${plural(dias, 'dia', 'dias')}.`;\n    return `<article class=\"lendo-item\">\n      <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\" aria-label=\"Abrir ${esc(l.titulo)}\">${capaHTML(l)}</button>\n      <div>\n        <h3 class=\"lendo-titulo\"><button type=\"button\" class=\"link-titulo\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">${esc(l.titulo)}</button></h3>\n        <p class=\"autor\">${esc(nomesAutores(l))}</p>\n        <p class=\"detalhe\">${quando}</p>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao primario pequeno\" data-acao=\"terminar-leitura\" data-id=\"${esc(l.id)}\">Marcar como lido</button>\n          <button type=\"button\" class=\"botao pequeno\" data-acao=\"pausar-leitura\" data-id=\"${esc(l.id)}\">Pausar</button>\n        </div>\n      </div>\n    </article>`;\n  };\n\n  const itemUltima = r => `<div class=\"ultima\">\n      <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(r.livro.id)}\" aria-label=\"Abrir ${esc(r.livro.titulo)}\">${capaHTML(r.livro, 'pequena')}</button>\n      <p class=\"ultima-titulo\">${esc(r.livro.titulo)}</p>\n      ${estrelasHTML(r.nota, 12)}\n      <p class=\"detalhe\">Lido em ${dataBR(r.fim)}</p>\n    </div>`;\n\n  const itemEmprestimo = ({ livro, emp }) => {\n    const atraso = dataValida(emp.devolverAte) ? diasEntre(emp.devolverAte, hoje) : null;\n    const prazo = atraso === null ? '' : atraso > 0 ? `<span class=\"atrasado\">Atrasado há ${plural(atraso, 'dia', 'dias')}</span>` : `Devolver até ${dataBR(emp.devolverAte)}`;\n    const quem = emp.tipo === 'peguei' ? `De ${esc(emp.pessoa || 'pessoa não informada')}` : `Com ${esc(emp.pessoa || 'pessoa não informada')}`;\n    return `<li><button type=\"button\" class=\"link-titulo emprestimo-livro\" data-acao=\"abrir-livro\" data-id=\"${esc(livro.id)}\">${esc(livro.titulo)}</button>\n      <p class=\"detalhe\">${quem}${prazo ? '. ' + prazo : ''}</p></li>`;\n  };\n\n  const vazio = noApp() && !dados.livros.length;\n  if (vazio) return `<div class=\"cabecalho-pagina\"><div>\n      <h1 class=\"titulo-pagina\">Traga a sua biblioteca</h1>\n      <p class=\"subtitulo\">Este aplicativo começa vazio. Baixe o arquivo Biblioteca.html do OneDrive para o celular e escolha-o aqui: os livros, as capas e as leituras vêm junto.</p>\n    </div></div>\n    <div class=\"acoes\"><button type=\"button\" class=\"botao primario\" data-acao=\"importar-arquivo\">Escolher o arquivo da biblioteca</button><button type=\"button\" class=\"botao\" data-acao=\"novo-livro\">Começar do zero</button></div>`;\n  return `<div class=\"inicio\">\n    <div>\n      <section>\n        <h2 class=\"titulo-secao\">Lendo agora</h2>\n        ${lendo.length ? lendo.map(itemLendo).join('') : '<p class=\"vazio\">Nenhum livro em leitura. Abra um livro e escolha Começar leitura.</p>'}\n        ${pausados.length ? `<p class=\"linha-pausados\">Pausados: ${pausados.map(l => `<button type=\"button\" class=\"link\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">${esc(l.titulo)}</button>`).join(', ')}</p>` : ''}\n      </section>\n      <section class=\"secao\">\n        <h2 class=\"titulo-secao\">Últimas leituras</h2>\n        ${concluidas.length ? `<div class=\"fila-capas\">${concluidas.slice(0, 5).map(itemUltima).join('')}</div>` : '<p class=\"vazio\">As leituras concluídas aparecem aqui.</p>'}\n      </section>\n    </div>\n    <aside>\n      <section>${blocoMeta(ano, lidosNoAno)}</section>\n      <section class=\"secao\">\n        <h2 class=\"titulo-secao\">Empréstimos em aberto</h2>\n        ${abertos.length ? `<ul class=\"lista-emprestimos\">${abertos.map(itemEmprestimo).join('')}</ul>` : '<p class=\"vazio\">Nenhum livro emprestado agora.</p>'}\n      </section>\n      ${paraRevisar ? `<section class=\"secao\">\n        <h2 class=\"titulo-secao\">Revisão</h2>\n        <p class=\"detalhe\">${paraRevisar === 1 ? '1 livro tem' : `${numero(paraRevisar)} livros têm`} informação faltando que afeta a estante ou as estatísticas.</p>\n        <div class=\"acoes\"><button type=\"button\" class=\"botao pequeno\" data-acao=\"revisar-dados\">Revisar dados</button></div>\n      </section>` : ''}\n      ${semCapa ? `<section class=\"secao\">\n        <h2 class=\"titulo-secao\">Capas</h2>\n        <p class=\"detalhe\">${semCapa === 1 ? '1 livro está sem capa.' : `${numero(semCapa)} livros estão sem capa.`} A busca pelo ISBN também completa editora, ano e páginas em branco.</p>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao pequeno\" data-acao=\"completar-dados\">Completar capas e dados</button>\n          <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"ver-sem-capa\">Ver livros sem capa</button>\n        </div>\n      </section>` : ''}\n    </aside>\n  </div>`;\n}\n\nfunction blocoMeta(ano, lidos) {\n  const meta = Number(dados.metas[ano]) || 0;\n  if (!meta) {\n    return `<h2 class=\"titulo-secao\">Meta de ${ano}</h2>\n      <p class=\"meta-numeros\"><strong>${numero(lidos)}</strong> ${lidos === 1 ? 'livro lido' : 'livros lidos'} até agora</p>\n      <div class=\"acoes\"><button type=\"button\" class=\"botao pequeno\" data-acao=\"definir-meta\" data-ano=\"${ano}\">Definir meta de ${ano}</button></div>`;\n  }\n  const inicioAno = new Date(Number(ano), 0, 1);\n  const fimAno = new Date(Number(ano) + 1, 0, 1);\n  const fracao = Math.min(1, Math.max(0, (Date.now() - inicioAno) / (fimAno - inicioAno)));\n  const esperado = Math.floor(meta * fracao);\n  const projecao = fracao > 0.08 ? Math.round(lidos / fracao) : null;\n  let situacao;\n  if (lidos >= meta) situacao = 'Meta cumprida.';\n  else if (lidos >= esperado) situacao = `Você está no ritmo: o esperado até hoje era ${plural(esperado, 'livro', 'livros')}.`;\n  else situacao = `O esperado até hoje era ${plural(esperado, 'livro', 'livros')}.`;\n  if (projecao !== null && lidos < meta) situacao += ` No ritmo atual, você fecha o ano com ${plural(projecao, 'livro', 'livros')}.`;\n  return `<h2 class=\"titulo-secao\">Meta de ${ano}</h2>\n    <p class=\"meta-numeros\"><strong>${numero(lidos)}</strong> de ${plural(meta, 'livro', 'livros')}</p>\n    <div class=\"progresso\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"${meta}\" aria-valuenow=\"${lidos}\">\n      <span style=\"width:${Math.min(100, lidos / meta * 100)}%\"></span>\n      <i style=\"left:${Math.min(100, fracao * 100)}%\" title=\"Esperado até hoje\"></i>\n    </div>\n    <p class=\"detalhe\">${situacao}</p>\n    <div class=\"acoes\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"definir-meta\" data-ano=\"${ano}\">Alterar meta</button></div>`;\n}\n\n/* ===== Biblioteca pessoal ===== */\n\nfunction telaBiblioteca() {\n  const fisicos = livrosOrdenadosPorCodigo('fisico');\n  const fora = numerarPresentes(dados) ? fisicos.filter(estaForaDaEstante) : [];\n  const v = estado.biblioteca;\n  return `<div class=\"cabecalho-pagina\">\n      <div>\n        <h1 class=\"titulo-pagina\">Biblioteca pessoal</h1>\n        <p class=\"subtitulo\">${plural(fisicos.length, 'livro físico', 'livros físicos')} na ordem da prateleira: por categoria e, dentro dela, pelo sobrenome do autor.${fora.length ? ` ${plural(fisicos.length - fora.length, 'está na estante', 'estão na estante')} e ${fora.length === 1 ? '1 está fora' : `${numero(fora.length)} estão fora`} agora.` : ''}</p>\n      </div>\n    </div>\n    <div class=\"barra\">\n      <input type=\"search\" placeholder=\"Buscar por título, autor ou número\" value=\"${esc(v.busca)}\" data-filtro=\"biblioteca-busca\" aria-label=\"Buscar na biblioteca pessoal\">\n      <div class=\"segmentado\" role=\"group\" aria-label=\"Visualização\">\n        <button type=\"button\" data-acao=\"visao-biblioteca\" data-visao=\"estante\" aria-pressed=\"${v.visao === 'estante'}\">Estante</button>\n        <button type=\"button\" data-acao=\"visao-biblioteca\" data-visao=\"lista\" aria-pressed=\"${v.visao === 'lista'}\">Lista</button>\n      </div>\n    </div>\n    <div id=\"resultados\">${conteudoBiblioteca()}</div>`;\n}\n\nfunction blocoForaDaEstante(fora, busca) {\n  if (!fora.length) return '';\n  return `<section class=\"fora-bloco\">\n      <h2 class=\"titulo-secao\">Fora da estante</h2>\n      <p class=\"detalhe\">Enquanto estão fora, estes livros ficam com um código temporário e a numeração da estante conta só os que estão lá.</p>\n      <ul class=\"lista-fora\">${fora.map(l => `<li class=\"item-fora${busca && !bateBusca(l, busca) ? ' apagada' : ''}\">\n        <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\" aria-label=\"Abrir ${esc(l.titulo)}\">${capaHTML(l, 'pequena mini')}</button>\n        <div>\n          <p class=\"item-fora-titulo\"><span class=\"etiqueta\">${esc(codigoDe(l))}</span>${esc(l.titulo)}</p>\n          <p class=\"detalhe\">${esc(motivoDeSaida(l))}. Ao voltar, entra como nº ${numeroDeVolta(dados, l)}.</p>\n        </div>\n      </li>`).join('')}</ul>\n    </section>`;\n}\n\nfunction conteudoBiblioteca() {\n  const todos = livrosOrdenadosPorCodigo('fisico');\n  const separar = numerarPresentes(dados);\n  const fora = separar ? todos.filter(estaForaDaEstante) : [];\n  const fisicos = separar ? todos.filter(l => !estaForaDaEstante(l)) : todos;\n  const busca = estado.biblioteca.busca.trim();\n  if (!todos.length) return '<p class=\"vazio\">Nenhum livro físico cadastrado. Use Adicionar livro para começar.</p>';\n  const blocos = dados.categorias.map(cat => ({ cat, livros: fisicos.filter(l => l.categoria === cat.id) })).filter(b => b.livros.length);\n  const semCategoria = fisicos.filter(l => !categoriaPorId(l.categoria));\n  if (semCategoria.length) blocos.push({ cat: { id: '', nome: 'Sem categoria', cor: '#5B626D' }, livros: semCategoria });\n\n  if (estado.biblioteca.visao === 'lista') {\n    const linhas = blocos.map(({ cat, livros }) => {\n      const visiveis = livros.filter(l => bateBusca(l, busca));\n      if (!visiveis.length) return '';\n      return `<tr class=\"linha-categoria\"><td colspan=\"5\">${esc(cat.nome)}</td></tr>`\n        + visiveis.map(l => `<tr class=\"clicavel\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">\n            <td><span class=\"etiqueta\">${esc(codigoDe(l))}</span></td>\n            <td class=\"col-titulo\">${esc(l.titulo)}${emprestadoPorMim(l) ? `<span class=\"marca-emprestado-lista\" title=\"${esc(`Emprestado para ${emprestadoPorMim(l).pessoa || 'pessoa não informada'}`)}\">*</span><span class=\"sr-only\">, emprestado</span>` : ''}</td>\n            <td>${esc(nomesAutores(l, { papeis: true }))}</td>\n            <td>${statusHTML(l.status)}</td>\n            <td>${estrelasHTML(l.nota)}</td>\n          </tr>`).join('');\n    }).join('');\n    const linhasFora = fora.filter(l => bateBusca(l, busca)).map(l => `<tr class=\"clicavel\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">\n        <td><span class=\"etiqueta\">${esc(codigoDe(l))}</span></td>\n        <td class=\"col-titulo\">${esc(l.titulo)}</td>\n        <td>${esc(nomesAutores(l, { papeis: true }))}</td>\n        <td>${statusHTML(l.status)}</td>\n        <td>${esc(motivoDeSaida(l))}</td>\n      </tr>`).join('');\n    const corpo = linhas + (linhasFora ? `<tr class=\"linha-categoria\"><td colspan=\"5\">Fora da estante</td></tr>${linhasFora}` : '');\n    if (!corpo) return '<p class=\"vazio\">Nenhum livro físico corresponde à busca.</p>';\n    return `<div class=\"rolagem\"><table class=\"tabela\"><thead><tr><th>Nº</th><th>Título</th><th>Autor</th><th>Status</th><th>Nota</th></tr></thead><tbody>${corpo}</tbody></table></div>`;\n  }\n\n  const algum = !busca || todos.some(l => bateBusca(l, busca));\n  const prateleira = blocos.map(({ cat, livros }) => {\n    const [primeiro, ...resto] = livros;\n    const divisoria = `<div class=\"lombada-slot\"><div class=\"divisoria\" style=\"--cor:${corSegura(cat.cor)}\" role=\"img\" aria-label=\"${esc(cat.nome)}, ${esc(faixaNumeros(livros.map(codigoDe)))}\"><span class=\"divisoria-texto\"><span class=\"divisoria-nome\">${esc(cat.nome)}</span><span class=\"divisoria-faixa\">${esc(faixaNumeros(livros.map(codigoDe)))}</span></span></div></div>`;\n    return `<div class=\"inicio-secao\">${divisoria}${lombadaHTML(primeiro, cat, busca)}</div>` + resto.map(l => lombadaHTML(l, cat, busca)).join('');\n  }).join('');\n  return `<p class=\"legenda\">As divisórias marcam o começo de cada categoria. A etiqueta mostra o número do livro. Livros em leitura ou emprestados saem da estante e ficam listados embaixo, com código temporário.${algum ? '' : ' Nenhum livro corresponde à busca.'}</p>`\n    + `<div class=\"prateleira\">${prateleira}</div>`\n    + blocoForaDaEstante(fora, busca);\n}\n\nfunction lombadaHTML(livro, cat, busca) {\n  const h = hashTexto(livro.id + livro.titulo);\n  const paginas = livro.paginas || 220;\n  const largura = Math.round(Math.min(64, Math.max(20, 14 + paginas * 0.045)));\n  const altura = 164 + (h % 5) * 8 + (livro.formato === 'capa-dura' ? 8 : 0);\n  const tom = [0, 7, 13][(h >>> 4) % 3];\n  const mistura = (h >>> 7) % 2 ? 'black' : 'white';\n  const codigo = codigoDe(livro);\n  const classes = ['lombada'];\n  if (livro.status === 'lendo') classes.push('lendo');\n  if (busca && !bateBusca(livro, busca)) classes.push('apagada');\n  if (estado.destaque.has(livro.id)) classes.push('destacada');\n  const emprestimo = emprestadoPorMim(livro);\n  if (emprestimo) classes.push('emprestado');\n  const rotulo = `${codigo}. ${livro.titulo}, ${nomesAutores(livro)}${emprestimo ? `. Emprestado para ${emprestimo.pessoa || 'pessoa não informada'}` : ''}`;\n  return `<div class=\"lombada-slot\"><button type=\"button\" class=\"${classes.join(' ')}\" style=\"--cor:${corSegura(cat.cor)};--larg:${largura}px;--alt:${altura}px;--tom:${tom}%;--mistura:${mistura}\" data-acao=\"abrir-livro\" data-id=\"${esc(livro.id)}\" title=\"${esc(rotulo)}\" aria-label=\"${esc(rotulo)}\">${emprestimo ? '<span class=\"marca-emprestado\" aria-hidden=\"true\">*</span>' : ''}<span class=\"lombada-titulo\">${esc(livro.titulo)}</span><span class=\"etiqueta\">${esc(codigo)}</span></button></div>`;\n}\n\n/* ===== Todos os livros ===== */\n\nfunction telaTodos() {\n  const f = estado.todos;\n  const tipos = [['', 'Todos os tipos'], ['fisico', 'Físicos'], ['digital', 'E-books'], ['emprestado', 'Emprestados']];\n  const status = [['', 'Todos os status'], ...STATUS];\n  const categorias = [['', 'Todas as categorias'], ...dados.categorias.map(c => [c.id, c.nome])];\n  const ordens = [['codigo', 'Ordenar por número'], ['titulo', 'Ordenar por título'], ['autor', 'Ordenar por autor'], ['fim', 'Leitura mais recente'], ['nota', 'Maior nota']];\n  return `<div class=\"cabecalho-pagina\"><div>\n      <h1 class=\"titulo-pagina\">Todos os livros</h1>\n      <p class=\"subtitulo\">Físicos, e-books e emprestados, com as leituras de cada um.</p>\n    </div></div>\n    <div class=\"barra${f.filtrosAbertos || f.tipo || f.status || f.categoria ? ' mostrar-filtros' : ''}\">\n      <input type=\"search\" placeholder=\"Buscar por título, autor, ISBN ou número\" value=\"${esc(f.busca)}\" data-filtro=\"todos-busca\" aria-label=\"Buscar em todos os livros\">\n      <button type=\"button\" class=\"botao pequeno botao-filtros\" data-acao=\"alternar-filtros\" aria-expanded=\"${!!(f.filtrosAbertos || f.tipo || f.status || f.categoria)}\">Filtros${[f.tipo, f.status, f.categoria].filter(Boolean).length ? ` (${[f.tipo, f.status, f.categoria].filter(Boolean).length})` : ''}</button>\n      <div class=\"filtros-extra\">\n        <select data-filtro=\"todos-tipo\" aria-label=\"Tipo\">${opcoesHTML(tipos, f.tipo)}</select>\n        <select data-filtro=\"todos-status\" aria-label=\"Status\">${opcoesHTML(status, f.status)}</select>\n        <select data-filtro=\"todos-categoria\" aria-label=\"Categoria\">${opcoesHTML(categorias, f.categoria)}</select>\n        <select data-filtro=\"todos-ordem\" aria-label=\"Ordem\">${opcoesHTML(ordens.some(o => o[0] === f.ordem) ? ordens : [...ordens, [f.ordem, 'Ordem da tabela']], f.ordem)}</select>\n      </div>\n      <div class=\"segmentado\" role=\"group\" aria-label=\"Visualização\">\n        <button type=\"button\" data-acao=\"visao-todos\" data-visao=\"capas\" aria-pressed=\"${f.visao === 'capas'}\">Capas</button>\n        <button type=\"button\" data-acao=\"visao-todos\" data-visao=\"lista\" aria-pressed=\"${f.visao === 'lista'}\">Lista</button>\n      </div>\n    </div>\n    <div id=\"resultados\">${conteudoTodos()}</div>`;\n}\n\nfunction filtrarTodos() {\n  const f = estado.todos;\n  const lista = dados.livros.filter(l => l.posse !== 'desejo'\n    && (!f.tipo || grupoDe(l) === f.tipo)\n    && (!f.status || l.status === f.status)\n    && (!f.categoria || l.categoria === f.categoria)\n    && (!f.semPaginas || (!l.paginas && (l.status === 'lido' || l.releituras.length)))\n    && bateBusca(l, f.busca.trim()));\n  const nomeCat = l => (categoriaPorId(l.categoria) || {}).nome || '';\n  const dias = l => (dataValida(l.inicio) && dataValida(l.fim) ? diasEntre(l.inicio, l.fim) : -1);\n  const comparadores = {\n    codigo: (a, b) => compararCodigos(codigoDe(a), codigoDe(b)),\n    titulo: (a, b) => colador.compare(semArtigo(a.titulo), semArtigo(b.titulo)),\n    autor: (a, b) => colador.compare(chaveSobrenome(a), chaveSobrenome(b)) || colador.compare(semArtigo(a.titulo), semArtigo(b.titulo)),\n    categoria: (a, b) => colador.compare(nomeCat(a), nomeCat(b)),\n    status: (a, b) => colador.compare(STATUS_ROTULO[a.status], STATUS_ROTULO[b.status]),\n    inicio: (a, b) => String(b.inicio || '').localeCompare(String(a.inicio || '')),\n    fim: (a, b) => String(b.fim || '').localeCompare(String(a.fim || '')),\n    dias: (a, b) => dias(b) - dias(a),\n    nota: (a, b) => (b.nota || 0) - (a.nota || 0),\n  };\n  const comparar = comparadores[f.ordem] || comparadores.codigo;\n  return lista.sort((a, b) => (comparar(a, b) * f.dir) || compararCodigos(codigoDe(a), codigoDe(b)));\n}\n\nfunction conteudoTodos() {\n  const f = estado.todos;\n  const lista = filtrarTodos();\n  const total = dados.livros.filter(l => l.posse !== 'desejo').length;\n  const filtroExtra = f.semPaginas ? ` <span class=\"filtro-ativo\">Leituras sem número de páginas <button type=\"button\" data-acao=\"limpar-sem-paginas\" aria-label=\"Remover filtro\">×</button></span>` : '';\n  const contagem = `<p class=\"contagem\">${lista.length === total ? plural(total, 'livro', 'livros') : `${numero(lista.length)} de ${plural(total, 'livro', 'livros')}`}${filtroExtra}</p>`;\n  if (!lista.length) return contagem + '<p class=\"vazio\">Nenhum livro corresponde aos filtros. Ajuste a busca ou os filtros acima.</p>';\n\n  if (f.visao === 'lista') {\n    const coluna = (id, rotulo, classe = '') => {\n      const ativa = f.ordem === id;\n      return `<th class=\"${classe}\"><button type=\"button\" data-acao=\"ordenar-todos\" data-ordem=\"${id}\"${ativa ? ` aria-sort=\"${f.dir === 1 ? 'ascending' : 'descending'}\"` : ''}>${rotulo}${ativa ? (f.dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;\n    };\n    const linhas = lista.map(l => {\n      const dias = dataValida(l.inicio) && dataValida(l.fim) ? diasEntre(l.inicio, l.fim) : '';\n      return `<tr class=\"clicavel\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">\n        <td><span class=\"etiqueta\">${esc(codigoDe(l))}</span></td>\n        <td class=\"col-titulo\">${esc(l.titulo)}</td>\n        <td>${esc(nomesAutores(l, { papeis: true }))}</td>\n        <td>${esc((categoriaPorId(l.categoria) || {}).nome || '')}</td>\n        <td>${statusHTML(l.status)}</td>\n        <td class=\"nowrap\">${dataBR(l.inicio)}</td>\n        <td class=\"nowrap\">${dataBR(l.fim)}</td>\n        <td class=\"col-num\">${dias}</td>\n        <td class=\"nowrap\">${estrelasHTML(l.nota)}</td>\n      </tr>`;\n    }).join('');\n    return contagem + `<div class=\"rolagem\"><table class=\"tabela\"><thead><tr>\n      ${coluna('codigo', 'Nº')}${coluna('titulo', 'Título')}${coluna('autor', 'Autor')}${coluna('categoria', 'Categoria')}${coluna('status', 'Status')}${coluna('inicio', 'Início')}${coluna('fim', 'Término')}${coluna('dias', 'Dias', 'col-num')}${coluna('nota', 'Nota')}\n    </tr></thead><tbody>${linhas}</tbody></table></div>`;\n  }\n\n  return contagem + `<div class=\"grade-capas\">${lista.map(l => `<div class=\"item-capa\">\n      <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\" aria-label=\"Abrir ${esc(l.titulo)}\">${capaHTML(l)}</button>\n      <p class=\"item-capa-titulo\">${esc(l.titulo)}</p>\n      <p class=\"detalhe\">${esc(nomesAutores(l))}</p>\n      ${l.status === 'lido' ? estrelasHTML(l.nota, 12) : `<p class=\"detalhe\">${esc(STATUS_ROTULO[l.status])}</p>`}\n    </div>`).join('')}</div>`;\n}\n\n/* ===== Desejos ===== */\n\nfunction telaDesejos() {\n  const desejos = dados.livros.filter(l => l.posse === 'desejo');\n  const cabecalho = `<div class=\"cabecalho-pagina\">\n      <div>\n        <h1 class=\"titulo-pagina\">Desejos</h1>\n        <p class=\"subtitulo\">Livros que você quer ter. Quando um chegar, use Chegou para colocá-lo na biblioteca com o número certo.</p>\n      </div>\n      <button type=\"button\" class=\"botao primario\" data-acao=\"novo-desejo\">Adicionar desejo</button>\n    </div>`;\n  if (!desejos.length) return cabecalho + '<p class=\"vazio\">Sua lista de desejos está vazia. Adicione livros que você quer ler ou comprar.</p>';\n  const grupos = PRIORIDADES.map(([valor, rotulo]) => ({ rotulo, livros: desejos.filter(l => (l.prioridade || '') === valor).sort((a, b) => colador.compare(a.titulo, b.titulo)) }))\n    .filter(g => g.livros.length);\n  return cabecalho + grupos.map(g => `<section class=\"grupo-desejos\">\n      <h2 class=\"titulo-secao\">${g.rotulo === 'Sem prioridade' ? 'Sem prioridade' : `Prioridade ${g.rotulo.toLowerCase()}`}</h2>\n      ${g.livros.map(l => `<article class=\"desejo\">\n        <button type=\"button\" class=\"capa-botao\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\" aria-label=\"Abrir ${esc(l.titulo)}\">${capaHTML(l, 'pequena')}</button>\n        <div>\n          <h3 class=\"desejo-titulo\"><button type=\"button\" class=\"link-titulo\" data-acao=\"abrir-livro\" data-id=\"${esc(l.id)}\">${esc(l.titulo)}</button></h3>\n          <p class=\"autor\">${esc(nomesAutores(l, { papeis: true }))}</p>\n          <p class=\"detalhe\">${esc((categoriaPorId(l.categoria) || {}).nome || 'Sem categoria')}${l.obs ? `. ${esc(l.obs)}` : ''}</p>\n        </div>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao primario pequeno\" data-acao=\"chegou\" data-id=\"${esc(l.id)}\">Chegou</button>\n          <button type=\"button\" class=\"botao pequeno\" data-acao=\"editar-livro\" data-id=\"${esc(l.id)}\">Editar</button>\n        </div>\n      </article>`).join('')}\n    </section>`).join('');\n}\n\n/* ===== Empréstimos ===== */\n\nfunction telaEmprestimos() {\n  const hoje = hojeISO();\n  const abertos = emprestimosDe(dados, { abertos: true });\n  const comVoce = abertos.filter(e => e.emp.tipo === 'peguei');\n  const comOutros = abertos.filter(e => e.emp.tipo === 'emprestei');\n  const historico = emprestimosDe(dados, { abertos: false })\n    .sort((a, b) => String(b.emp.devolvidoEm || b.emp.data || '').localeCompare(String(a.emp.devolvidoEm || a.emp.data || '')));\n\n  const item = ({ livro, emp }) => {\n    const atraso = dataValida(emp.devolverAte) ? diasEntre(emp.devolverAte, hoje) : null;\n    const partes = [];\n    partes.push(emp.tipo === 'peguei' ? `Emprestado por ${esc(emp.pessoa || 'pessoa não informada')}` : `Com ${esc(emp.pessoa || 'pessoa não informada')}`);\n    if (dataValida(emp.data)) partes.push(`desde ${dataBR(emp.data)}`);\n    const prazo = atraso === null ? '' : atraso > 0 ? `<span class=\"atrasado\">Atrasado há ${plural(atraso, 'dia', 'dias')}</span>` : `Devolver até ${dataBR(emp.devolverAte)}`;\n    return `<li>\n      <button type=\"button\" class=\"link-titulo emprestimo-livro\" data-acao=\"abrir-livro\" data-id=\"${esc(livro.id)}\">${esc(livro.titulo)}</button>\n      <p class=\"detalhe\">${partes.join(', ')}.${prazo ? ' ' + prazo + '.' : ''}</p>\n      <div class=\"acoes\"><button type=\"button\" class=\"botao pequeno\" data-acao=\"registrar-devolucao\" data-id=\"${esc(livro.id)}\" data-emp=\"${esc(emp.id)}\">Registrar devolução</button><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"editar-emprestimo\" data-id=\"${esc(livro.id)}\" data-emp=\"${esc(emp.id)}\">Editar</button></div>\n    </li>`;\n  };\n\n  const linhasHistorico = historico.map(({ livro, emp }) => `<tr class=\"clicavel\" data-acao=\"abrir-livro\" data-id=\"${esc(livro.id)}\">\n      <td><span class=\"etiqueta\">${esc(codigoDe(livro))}</span></td>\n      <td class=\"col-titulo\">${esc(livro.titulo)}</td>\n      <td>${emp.tipo === 'peguei' ? 'Você pegou' : 'Você emprestou'}</td>\n      <td>${esc(emp.pessoa || 'Não informada')}</td>\n      <td class=\"nowrap\"><span class=\"acoes-inline\"><button type=\"button\" class=\"link\" data-acao=\"editar-emprestimo\" data-id=\"${esc(livro.id)}\" data-emp=\"${esc(emp.id)}\">Editar</button><button type=\"button\" class=\"link perigo-link\" data-acao=\"excluir-emprestimo\" data-id=\"${esc(livro.id)}\" data-emp=\"${esc(emp.id)}\">Excluir</button></span></td>\n    </tr>`).join('');\n\n  return `<div class=\"cabecalho-pagina\">\n      <div>\n        <h1 class=\"titulo-pagina\">Empréstimos</h1>\n        <p class=\"subtitulo\">Livros de outras pessoas que estão com você e livros seus que estão com outras pessoas.</p>\n      </div>\n      <div class=\"acoes-pagina\">\n        <button type=\"button\" class=\"botao primario\" data-acao=\"emprestar\">Emprestar um livro seu</button>\n        <button type=\"button\" class=\"botao\" data-acao=\"novo-emprestado\">Registrar livro que pegou emprestado</button>\n      </div>\n    </div>\n    <div class=\"duas-colunas\">\n      <section><h2 class=\"titulo-secao\">Com você</h2>${comVoce.length ? `<ul class=\"lista-emprestimos\">${comVoce.map(item).join('')}</ul>` : '<p class=\"vazio\">Nenhum livro de outra pessoa está com você.</p>'}</section>\n      <section><h2 class=\"titulo-secao\">Com outras pessoas</h2>${comOutros.length ? `<ul class=\"lista-emprestimos\">${comOutros.map(item).join('')}</ul>` : '<p class=\"vazio\">Nenhum livro seu está emprestado.</p>'}</section>\n    </div>\n    <section class=\"secao\">\n      <h2 class=\"titulo-secao\">Histórico</h2>\n      ${historico.length ? `<div class=\"rolagem\"><table class=\"tabela\"><thead><tr><th>Nº</th><th>Livro</th><th>Sentido</th><th>Pessoa</th><th><span class=\"sr-only\">Ações</span></th></tr></thead><tbody>${linhasHistorico}</tbody></table></div>` : '<p class=\"vazio\">Os empréstimos devolvidos aparecem aqui.</p>'}\n    </section>`;\n}\n\n/* ===== Estatísticas ===== */\n\nfunction graficoColunas(rotulos, valores, formatar = v => numero(v)) {\n  const poucos = rotulos.length <= 4;\n  const largura = poucos ? 46 : 19, espaco = poucos ? 26 : 9, topo = 22, base = 24, altura = 190;\n  const total = rotulos.length * (largura + espaco) + espaco;\n  const maximo = Math.max(1, ...valores);\n  const colunas = valores.map((v, i) => {\n    const x = espaco + i * (largura + espaco);\n    const alt = Math.round((altura - topo - base) * v / maximo);\n    const y = altura - base - alt;\n    return `<rect class=\"barra\" x=\"${x}\" y=\"${y}\" width=\"${largura}\" height=\"${alt}\" rx=\"2\"></rect>`\n      + (v ? `<text class=\"valor\" x=\"${x + largura / 2}\" y=\"${y - 7}\" text-anchor=\"middle\">${formatar(v)}</text>` : '')\n      + `<text x=\"${x + largura / 2}\" y=\"${altura - 8}\" text-anchor=\"middle\">${esc(rotulos[i])}</text>`;\n  }).join('');\n  return `<svg viewBox=\"0 0 ${total} ${altura}\" style=\"max-width:${Math.round(total * 1.15)}px\" role=\"img\"><line class=\"eixo\" x1=\"0\" x2=\"${total}\" y1=\"${altura - base + 0.5}\" y2=\"${altura - base + 0.5}\"></line>${colunas}</svg>`;\n}\n\nfunction rankingHTML(itens) {\n  const maximo = Math.max(1, ...itens.map(i => i.valor));\n  return `<ol class=\"ranking\">${itens.map(i => `<li><span class=\"nome\" title=\"${esc(i.rotulo)}\">${esc(i.rotulo)}</span><span class=\"trilho\"><span style=\"width:${i.valor / maximo * 100}%${i.cor ? `;background:${corSegura(i.cor)}` : ''}\"></span></span><span class=\"qtd\">${numero(i.valor)}</span></li>`).join('')}</ol>`;\n}\n\nfunction telaEstatisticas() {\n  const todas = leiturasConcluidas(dados);\n  const anoAtual = hojeISO().slice(0, 4);\n  const anos = [...new Set([...todas.map(r => r.fim.slice(0, 4)), anoAtual])].sort();\n  if (estado.estatisticas.ano !== 'todos' && !anos.includes(estado.estatisticas.ano)) estado.estatisticas.ano = anoAtual;\n  const sel = estado.estatisticas.ano;\n  const leituras = sel === 'todos' ? todas : todas.filter(r => r.fim.startsWith(sel));\n\n  const seletor = `<div class=\"segmentado\" role=\"group\" aria-label=\"Período\">\n    <button type=\"button\" data-acao=\"ano-estatisticas\" data-ano=\"todos\" aria-pressed=\"${sel === 'todos'}\">Todos os anos</button>\n    ${anos.map(a => `<button type=\"button\" data-acao=\"ano-estatisticas\" data-ano=\"${a}\" aria-pressed=\"${sel === a}\">${a}</button>`).join('')}\n  </div>`;\n  const cabecalho = `<div class=\"cabecalho-pagina\"><div><h1 class=\"titulo-pagina\">Estatísticas</h1></div>${seletor}</div>`;\n\n  const paginas = leituras.reduce((s, r) => s + (r.livro.paginas || 0), 0);\n  const semPaginas = leituras.filter(r => !r.livro.paginas).length;\n  const comNota = leituras.filter(r => r.nota);\n  const notaMedia = comNota.length ? comNota.reduce((s, r) => s + Number(r.nota), 0) / comNota.length : null;\n  const comDatas = leituras.filter(r => dataValida(r.inicio) && dataValida(r.fim) && diasEntre(r.inicio, r.fim) >= 0);\n  const mediaDias = comDatas.length ? comDatas.reduce((s, r) => s + diasEntre(r.inicio, r.fim), 0) / comDatas.length : null;\n\n  let resumo;\n  if (!leituras.length) {\n    resumo = sel === 'todos' ? 'Nenhuma leitura concluída ainda.' : `Nenhuma leitura concluída em ${sel} até agora.`;\n  } else {\n    const periodo = sel === 'todos' ? 'No total' : sel === anoAtual ? `Em ${sel}, até agora` : `Em ${sel}`;\n    resumo = `${periodo}, você terminou ${plural(leituras.length, 'livro', 'livros')}, somando ${plural(paginas, 'página', 'páginas')}.`;\n    if (notaMedia !== null) resumo += ` A nota média foi ${numero(notaMedia, 1)}`;\n    if (mediaDias !== null) resumo += `${notaMedia !== null ? ', e cada' : ' Cada'} livro levou em média ${plural(Math.round(mediaDias), 'dia', 'dias')}.`;\n    else if (notaMedia !== null) resumo += '.';\n  }\n  const aviso = semPaginas ? `<p class=\"nota-rodape\">${semPaginas === 1 ? '1 leitura está' : `${numero(semPaginas)} leituras estão`} sem número de páginas, então o total de páginas está incompleto. <button type=\"button\" class=\"link\" data-acao=\"ver-sem-paginas\">Ver quais</button></p>` : '';\n\n  let graficosTempo = '';\n  if (leituras.length) {\n    if (sel === 'todos') {\n      const livrosAno = anos.map(a => todas.filter(r => r.fim.startsWith(a)).length);\n      const paginasAno = anos.map(a => todas.filter(r => r.fim.startsWith(a)).reduce((s, r) => s + (r.livro.paginas || 0), 0));\n      graficosTempo = `<figure class=\"grafico\"><h3>Livros por ano</h3>${graficoColunas(anos, livrosAno)}</figure>\n        <figure class=\"grafico\"><h3>Páginas por ano</h3>${graficoColunas(anos, paginasAno)}</figure>`;\n    } else {\n      const porMes = MESES.map((_, i) => leituras.filter(r => Number(r.fim.slice(5, 7)) === i + 1));\n      graficosTempo = `<figure class=\"grafico\"><h3>Livros por mês</h3>${graficoColunas(MESES, porMes.map(m => m.length))}</figure>\n        <figure class=\"grafico\"><h3>Páginas por mês</h3>${graficoColunas(MESES, porMes.map(m => m.reduce((s, r) => s + (r.livro.paginas || 0), 0)), v => (v >= 1000 ? numero(v / 1000, 1) + ' mil' : numero(v)))}</figure>`;\n    }\n  }\n\n  const porCategoria = dados.categorias.map(c => ({ rotulo: c.nome, cor: c.cor, valor: leituras.filter(r => r.livro.categoria === c.id).length }))\n    .filter(i => i.valor).sort((a, b) => b.valor - a.valor);\n  const contagemAutores = new Map();\n  leituras.forEach(r => {\n    const nome = nomesAutores(r.livro) || 'Sem autor';\n    const chave = normalizar(nome).replace(/[^a-z]/g, '');\n    const atual = contagemAutores.get(chave) || { rotulo: nome, valor: 0 };\n    atual.valor++;\n    contagemAutores.set(chave, atual);\n  });\n  const porAutor = [...contagemAutores.values()]\n    .sort((a, b) => b.valor - a.valor || colador.compare(a.rotulo, b.rotulo)).slice(0, 6);\n\n  const lidosPorAno = {};\n  todas.forEach(r => { const a = r.fim.slice(0, 4); lidosPorAno[a] = (lidosPorAno[a] || 0) + 1; });\n  const anosMetas = [...new Set([...anos, ...Object.keys(dados.metas).filter(a => dados.metas[a])])].sort().reverse();\n  const linhasMetas = anosMetas.map(a => {\n    const meta = Number(dados.metas[a]) || 0;\n    const lidos = lidosPorAno[a] || 0;\n    let resultado;\n    if (!meta) resultado = `<button type=\"button\" class=\"link\" data-acao=\"definir-meta\" data-ano=\"${a}\">Definir meta</button>`;\n    else if (lidos >= meta) resultado = 'Cumprida';\n    else if (a < anoAtual) resultado = `Faltaram ${numero(meta - lidos)}`;\n    else resultado = `Faltam ${numero(meta - lidos)}`;\n    return `<tr><td>${a}</td><td class=\"col-num\">${meta ? numero(meta) : 'Sem meta'}</td><td class=\"col-num\">${numero(lidos)}</td><td>${resultado}</td></tr>`;\n  }).join('');\n\n  return cabecalho\n    + `<p class=\"resumo-ano\">${resumo}</p>${aviso}`\n    + (leituras.length ? `<div class=\"graficos\">\n        ${graficosTempo}\n        <figure class=\"grafico\"><h3>Categorias</h3>${rankingHTML(porCategoria)}</figure>\n        <figure class=\"grafico\"><h3>Autores mais lidos</h3>${rankingHTML(porAutor)}</figure>\n      </div>` : '')\n    + `<section class=\"secao\"><h2 class=\"titulo-secao\">Metas por ano</h2>\n        <div class=\"rolagem\"><table class=\"tabela tabela-metas\"><thead><tr><th>Ano</th><th class=\"col-num\">Meta</th><th class=\"col-num\">Lidos</th><th>Resultado</th></tr></thead><tbody>${linhasMetas}</tbody></table></div>\n      </section>`;\n}\n\n/* ===== Configurações ===== */\n\nfunction telaConfig() {\n  const temAPI = typeof window !== 'undefined' && 'showSaveFilePicker' in window;\n  const vinculo = estado.arquivo ? `Nesta sessão, o Salvar grava em ${esc(estado.arquivo.name)}.` : estado.vinculoSalvo ? 'O navegador lembra qual arquivo usar. No próximo Salvar, ele só pede autorização.' : 'No primeiro Salvar, escolha este mesmo arquivo na pasta do OneDrive.';\n  const contagem = new Map();\n  dados.livros.forEach(l => contagem.set(l.categoria, (contagem.get(l.categoria) || 0) + 1));\n  const metas = Object.keys(dados.metas).filter(a => dados.metas[a]).sort().reverse();\n  const semCapa = livrosSemCapa().length;\n  const incompletos = dados.livros.filter(l => l.isbn && (!l.editora || !l.ano || !l.paginas)).length;\n  const comIsbn = dados.livros.filter(l => l.isbn).length;\n  const tema = (() => { try { return localStorage.getItem('minha-biblioteca:tema') || ''; } catch (e) { return ''; } })();\n\n  return `<div class=\"cabecalho-pagina\"><div><h1 class=\"titulo-pagina\">Configurações</h1></div></div>\n    ${noApp() ? `<section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">OneDrive</h2></div>\n      <div>\n        <p>Com o OneDrive ligado, o aplicativo lê e grava o seu arquivo Biblioteca.html. O computador recebe as alterações pelo próprio OneDrive, e o celular recebe as do computador ao abrir.</p>\n        <p class=\"detalhe\">${esc(textoSituacaoOneDrive())}${estado.erroOneDrive ? ` ${esc(estado.erroOneDrive)}` : ''}</p>\n        <div class=\"acoes\">\n          ${oneDriveLigado()\n            ? `<button type=\"button\" class=\"botao primario\" data-acao=\"sincronizar-onedrive\">Sincronizar agora</button>\n               <button type=\"button\" class=\"botao\" data-acao=\"escolher-arquivo-onedrive\">${lerSessaoOneDrive().item ? 'Trocar o arquivo' : 'Escolher o arquivo'}</button>\n               <button type=\"button\" class=\"botao discreto\" data-acao=\"desligar-onedrive\">Desligar</button>`\n            : '<button type=\"button\" class=\"botao primario\" data-acao=\"conectar-onedrive\">Conectar ao OneDrive</button>'}\n        </div>\n        <div class=\"linha-chave\" style=\"margin-top:14px\">\n          <input type=\"text\" data-id-aplicativo value=\"${esc(idDoAplicativo())}\" placeholder=\"ID do aplicativo da Microsoft\" aria-label=\"ID do aplicativo da Microsoft\" autocomplete=\"off\" spellcheck=\"false\">\n          <button type=\"button\" class=\"botao\" data-acao=\"guardar-id-aplicativo\">Guardar ID</button>\n        </div>\n        <p class=\"detalhe\" style=\"margin-top:8px\">O ID já vem preenchido. Só troque se você registrar outro aplicativo na Microsoft.</p>\n      </div>\n    </section>` : ''}\n    ${gravaSozinho() ? `<section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Cópias e backup</h2></div>\n      <div>\n        <p>${noApp() ? 'Os dados ficam guardados neste aparelho e valem só aqui. Baixe o arquivo de vez em quando e guarde-o no OneDrive: é a sua cópia de segurança e o jeito de levar as alterações para o computador.' : 'Os dados ficam guardados na sua conta do Claude e aparecem em todos os aparelhos onde você abrir esta página. Não é preciso salvar.'}</p>\n        <p class=\"detalhe\">${estado.ultimoSalvo ? `Última gravação: ${esc(dataHoraBR(estado.ultimoSalvo))}.` : ''}${noApp() && typeof diasDesdeBackup === 'function' ? (diasDesdeBackup() === null ? ' Nenhuma cópia baixada por aqui ainda.' : ` Última cópia baixada há ${esc(plural(diasDesdeBackup(), 'dia', 'dias'))}.`) : ' O arquivo Biblioteca.html do OneDrive continua funcionando por conta própria.'}</p>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao\" data-acao=\"baixar-arquivo\">Baixar o arquivo da biblioteca</button>\n          <button type=\"button\" class=\"botao\" data-acao=\"baixar-copia\">Baixar cópia para compartilhar</button>\n          <button type=\"button\" class=\"botao\" data-acao=\"exportar-excel\">Exportar para Excel</button>\n          <button type=\"button\" class=\"botao discreto\" data-acao=\"importar-arquivo\">Trazer dados de um arquivo</button>\n        </div>\n      </div>\n    </section>` : `    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Arquivo</h2></div>\n      <div>\n        <p>Os dados ficam dentro deste arquivo HTML. Use Salvar para gravar as alterações nele.</p>\n        <p class=\"detalhe\">Recebeu uma versão nova do programa? Abra a versão nova, use Trazer dados de outro arquivo e escolha o arquivo que você usava. Depois salve.</p>\n        <p class=\"detalhe\">Última gravação: \\${esc(dataHoraBR(dados.salvoEm))}. \\${temAPI ? vinculo : 'Neste navegador, o Salvar baixa uma cópia atualizada. No Chrome ou no Edge, ele grava direto no arquivo.'}</p>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao primario\" data-acao=\"salvar\">Salvar</button>\n          <button type=\"button\" class=\"botao\" data-acao=\"salvar-copia\">Salvar uma cópia</button>\n          <button type=\"button\" class=\"botao\" data-acao=\"exportar-excel\">Exportar para Excel</button>\n          <button type=\"button\" class=\"botao\" data-acao=\"importar-arquivo\">Trazer dados de outro arquivo</button>\n          \\${temAPI && (estado.arquivo || estado.vinculoSalvo) ? '<button type=\"button\" class=\"botao discreto\" data-acao=\"desvincular\">Desvincular arquivo</button>' : ''}\n        </div>\n      </div>\n    </section>`}\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Metas de leitura</h2></div>\n      <div>\n        <p>Quantos livros você quer terminar em cada ano.</p>\n        <div class=\"metas-lista\">\n          ${metas.map(a => `<div class=\"meta-linha\"><span>${a}</span><input type=\"number\" min=\"1\" max=\"999\" value=\"${esc(dados.metas[a])}\" data-meta-ano=\"${a}\" aria-label=\"Meta de ${a}\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"remover-meta\" data-ano=\"${a}\">Remover</button></div>`).join('')}\n        </div>\n        <div class=\"acoes\"><button type=\"button\" class=\"botao pequeno\" data-acao=\"definir-meta\" data-ano=\"${hojeISO().slice(0, 4)}\">Definir meta de um ano</button></div>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Numeração da estante</h2></div>\n      <div>\n        <p>Livro em leitura ou emprestado não está na prateleira. Você escolhe se a numeração acompanha isso.</p>\n        <div class=\"segmentado\" role=\"group\" aria-label=\"Numeração da estante\">\n          <button type=\"button\" data-acao=\"numeracao\" data-modo=\"presentes\" aria-pressed=\"${numerarPresentes(dados)}\">Contar só os presentes</button>\n          <button type=\"button\" data-acao=\"numeracao\" data-modo=\"fixa\" aria-pressed=\"${!numerarPresentes(dados)}\">Fixa por livro</button>\n        </div>\n        <p class=\"detalhe\" style=\"margin-top:10px\">${numerarPresentes(dados)\n          ? 'Os livros fora ganham código temporário (F1, F2) e os demais são renumerados enquanto isso. A tela mostra quais números mudaram.'\n          : 'Cada livro mantém o número, mesmo fora da estante. Nesse modo, a fita roxa marca leitura e o asterisco vermelho, empréstimo.'}</p>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Categorias</h2></div>\n      <div>\n        <p>A ordem desta lista é a ordem da prateleira. Mudar a ordem renumera a biblioteca pessoal.</p>\n        <p class=\"detalhe\">Regra de desempate: formato e gênero vêm antes de nacionalidade e época.</p>\n        <div class=\"cat-lista\">\n          ${dados.categorias.map((c, i) => `<div class=\"cat-linha\">\n            <span class=\"cat-mover\">\n              <button type=\"button\" data-acao=\"mover-categoria\" data-id=\"${esc(c.id)}\" data-direcao=\"-1\" aria-label=\"Subir ${esc(c.nome)}\"${i === 0 ? ' disabled' : ''}>↑</button>\n              <button type=\"button\" data-acao=\"mover-categoria\" data-id=\"${esc(c.id)}\" data-direcao=\"1\" aria-label=\"Descer ${esc(c.nome)}\"${i === dados.categorias.length - 1 ? ' disabled' : ''}>↓</button>\n            </span>\n            <input type=\"color\" value=\"${corSegura(c.cor)}\" data-cat-campo=\"cor\" data-id=\"${esc(c.id)}\" aria-label=\"Cor de ${esc(c.nome)}\">\n            <input type=\"text\" value=\"${esc(c.nome)}\" data-cat-campo=\"nome\" data-id=\"${esc(c.id)}\" aria-label=\"Nome da categoria\">\n            <input type=\"text\" class=\"cat-descricao\" value=\"${esc(c.descricao)}\" data-cat-campo=\"descricao\" data-id=\"${esc(c.id)}\" aria-label=\"Descrição de ${esc(c.nome)}\" placeholder=\"O que entra nesta categoria\">\n            <span class=\"cat-qtd\">${plural(contagem.get(c.id) || 0, 'livro', 'livros')}</span>\n            <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"excluir-categoria\" data-id=\"${esc(c.id)}\"${contagem.get(c.id) ? ' disabled title=\"Mova os livros para outra categoria antes de excluir\"' : ''}>Excluir</button>\n          </div>`).join('')}\n        </div>\n        <div class=\"acoes\"><button type=\"button\" class=\"botao pequeno\" data-acao=\"nova-categoria\">Adicionar categoria</button></div>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Revisão dos dados</h2></div>\n      <div>\n        <p>Confere se falta alguma informação relevante nos livros: autoria, categoria, datas e nota das leituras, páginas, empréstimos e complementos como ISBN, editora, ano e capa.</p>\n        <p class=\"detalhe\">${(() => { const r = revisarDados(dados, capasQuebradasConfirmadas()); return r.importantes.length ? `${plural(r.importantes.length, 'livro tem', 'livros têm')} algo que afeta a estante ou as estatísticas.` : 'Nada que afete a estante ou as estatísticas.'; })()}</p>\n        <div class=\"acoes\"><button type=\"button\" class=\"botao\" data-acao=\"revisar-dados\">Revisar dados</button></div>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Capas e dados</h2></div>\n      <div>\n        <p>Procura capas na Amazon, na BrasilAPI e na Open Library pelo ISBN, e completa editora, ano e páginas em branco. Nada que você já preencheu é substituído, e capas que não carregam são trocadas.</p>\n        <p class=\"detalhe\">${semCapa ? plural(semCapa, 'livro sem capa', 'livros sem capa') : 'Todos os livros têm capa'}${incompletos ? `. ${plural(incompletos, 'livro com ISBN tem', 'livros com ISBN têm')} editora, ano ou páginas em branco` : ''}.</p>\n        <div class=\"acoes\">\n          <button type=\"button\" class=\"botao\" data-acao=\"completar-dados\"${comIsbn ? '' : ' disabled'}>Completar capas e dados</button>\n          <button type=\"button\" class=\"botao discreto\" data-acao=\"ver-sem-capa\"${semCapa ? '' : ' disabled'}>Ver livros sem capa</button>\n        </div>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Busca por ISBN</h2></div>\n      <div>\n        <p>Ao digitar um ISBN, o programa consulta CBL, Mercado Editorial, Open Library e Wikidata e junta o que cada base tem: título, autoria, editora, ano da edição, páginas, série, volume e capa.</p>\n        <p class=\"detalhe\">Com uma chave gratuita do Google Books, a busca consulta também o Google, que costuma ter autoria, editora, ano e páginas de edições brasileiras e estrangeiras. Sem chave, o Google recusa as consultas. A chave fica guardada dentro deste arquivo; as cópias feitas com Salvar uma cópia saem sem ela. No Google Cloud, deixe a restrição de aplicativos como Nenhuma e restrinja a chave só à Books API. <a class=\"link\" href=\"https://developers.google.com/books/docs/v1/using#APIKey\" target=\"_blank\" rel=\"noopener noreferrer\">Como criar a chave</a></p>\n        <p class=\"detalhe\" data-situacao-chave>${chaveGoogle() ? `Chave guardada neste arquivo, terminando em ${esc(chaveGoogle().slice(-5))}.` : 'Nenhuma chave guardada.'}</p>\n        <div class=\"linha-chave\">\n          <input type=\"text\" data-chave-google value=\"${esc(chaveGoogle())}\" placeholder=\"Cole aqui a chave do Google Books\" aria-label=\"Chave do Google Books\" autocomplete=\"off\" spellcheck=\"false\">\n          <button type=\"button\" class=\"botao\" data-acao=\"guardar-chave-google\">Guardar e testar</button>\n        </div>\n      </div>\n    </section>\n    <section class=\"config-secao\">\n      <div><h2 class=\"titulo-secao\">Aparência</h2></div>\n      <div>\n        <p class=\"rotulo\">Cores</p>\n        <div class=\"amostras-paleta\" role=\"group\" aria-label=\"Cores\">\n          ${PALETAS.map(([id, nome, fundo, destaque]) => `<button type=\"button\" class=\"amostra\" data-acao=\"paleta\" data-paleta=\"${id}\" aria-pressed=\"${paletaAtual() === id}\"><i style=\"background:linear-gradient(90deg, ${fundo} 55%, ${destaque} 55%)\"></i>${nome}</button>`).join('')}\n        </div>\n        <p class=\"rotulo\" style=\"margin-top:16px\">Modo</p>\n        <div class=\"segmentado\" role=\"group\" aria-label=\"Modo\">\n          <button type=\"button\" data-acao=\"tema\" data-tema=\"\" aria-pressed=\"${!tema}\">Automático</button>\n          <button type=\"button\" data-acao=\"tema\" data-tema=\"claro\" aria-pressed=\"${tema === 'claro'}\">Claro</button>\n          <button type=\"button\" data-acao=\"tema\" data-tema=\"escuro\" aria-pressed=\"${tema === 'escuro'}\">Escuro</button>\n        </div>\n        <p class=\"detalhe\" style=\"margin-top:10px\">Cada cor tem versão clara e escura. O automático segue o aparelho. A escolha vale para este navegador, então dá para usar cores diferentes no celular e no computador.</p>\n      </div>\n    </section>`;\n}\n\n/* ===== Ficha do livro ===== */\n\nfunction abrirLivro(id) {\n  const l = livroPorId(id);\n  if (!l) return;\n  const grupo = grupoDe(l);\n  const cat = categoriaPorId(l.categoria);\n  const codigo = codigoDe(l);\n  const hoje = hojeISO();\n  const origem = {\n    fisico: `Biblioteca pessoal${cat ? `, prateleira de ${cat.nome}` : ''}`,\n    digital: `${FORMATO_ROTULO[l.formato]}${cat ? `, ${cat.nome}` : ''}`,\n    emprestado: `Emprestado${cat ? `, ${cat.nome}` : ''}`,\n    desejo: `Desejo${l.prioridade ? `, prioridade ${PRIORIDADE_ROTULO[l.prioridade].toLowerCase()}` : ''}`,\n  }[grupo];\n\n  const fatos = [];\n  const foraDaEstante = numerarPresentes(dados) && estaForaDaEstante(l);\n  if (codigo) fatos.push([foraDaEstante ? 'Código temporário' : 'Número', `<span class=\"etiqueta grande\">${esc(codigo)}</span>`]);\n  if (foraDaEstante) fatos.push(['Fora da estante', `${esc(motivoDeSaida(l))}. Ao voltar, entra como nº ${numeroDeVolta(dados, l)}.`]);\n  if (cat) fatos.push(['Categoria', esc(cat.nome)]);\n  if (l.serie) fatos.push(['Série', `${esc(l.serie)}${l.volume ? `, volume ${esc(l.volume)}` : ''}`]);\n  if (grupo !== 'digital' && l.formato) fatos.push(['Formato', esc(FORMATO_ROTULO[l.formato])]);\n  if (l.editora) fatos.push(['Editora', esc(l.editora)]);\n  if (l.ano) fatos.push(['Ano', esc(l.ano)]);\n  if (l.isbn) fatos.push(['ISBN', esc(formatarISBN(l.isbn))]);\n  else if (l.semIsbn) fatos.push(['ISBN', 'Não possui']);\n  if (l.paginas) fatos.push(['Páginas', numero(l.paginas)]);\n  if (grupo !== 'desejo') {\n    if (dataValida(l.inicio)) fatos.push(['Início', dataBR(l.inicio)]);\n    if (dataValida(l.fim)) fatos.push(['Término', dataBR(l.fim)]);\n    if (dataValida(l.inicio) && dataValida(l.fim)) fatos.push(['Duração', plural(diasEntre(l.inicio, l.fim), 'dia', 'dias')]);\n    else if (l.status === 'lendo' && dataValida(l.inicio)) fatos.push(['Duração', `em leitura há ${plural(Math.max(0, diasEntre(l.inicio, hoje)), 'dia', 'dias')}`]);\n  }\n\n  const releituras = l.releituras.length ? `<div class=\"ficha-bloco\"><h3>Leituras anteriores</h3><ul>${l.releituras.map(r => `<li>${dataBR(r.inicio) || 'Sem início'} a ${dataBR(r.fim) || 'sem término'}${r.nota ? `, nota ${numero(r.nota, r.nota % 1 ? 1 : 0)}` : ''}</li>`).join('')}</ul></div>` : '';\n  const emprestimos = l.emprestimos.length ? `<div class=\"ficha-bloco\"><h3>Empréstimos</h3><ul class=\"lista-emp-ficha\">${l.emprestimos.map(e => `<li>${esc(descricaoEmprestimo(e))}\n      <span class=\"acoes-inline\"><button type=\"button\" class=\"link\" data-acao=\"editar-emprestimo\" data-id=\"${esc(l.id)}\" data-emp=\"${esc(e.id)}\">Editar</button><button type=\"button\" class=\"link perigo-link\" data-acao=\"excluir-emprestimo\" data-id=\"${esc(l.id)}\" data-emp=\"${esc(e.id)}\">Excluir</button></span></li>`).join('')}</ul></div>` : '';\n\n  const abertoPeguei = l.emprestimos.find(e => !e.devolvido && e.tipo === 'peguei');\n  const abertoEmprestei = l.emprestimos.find(e => !e.devolvido && e.tipo === 'emprestei');\n  const botoes = [];\n  if (grupo === 'desejo') {\n    botoes.push(`<button type=\"button\" class=\"botao primario\" data-acao=\"chegou\" data-id=\"${esc(l.id)}\">Chegou</button>`);\n  } else {\n    if (l.status === 'nao-lido' || l.status === 'abandonado') botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"comecar-leitura\" data-id=\"${esc(l.id)}\">Começar leitura</button>`);\n    if (l.status === 'pausado') botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"retomar-leitura\" data-id=\"${esc(l.id)}\">Retomar leitura</button>`);\n    if (l.status === 'lendo') botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"pausar-leitura\" data-id=\"${esc(l.id)}\">Pausar</button><button type=\"button\" class=\"botao\" data-acao=\"terminar-leitura\" data-id=\"${esc(l.id)}\">Marcar como lido</button>`);\n    if (l.status === 'lido') botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"reler\" data-id=\"${esc(l.id)}\">Registrar releitura</button>`);\n    if (abertoPeguei || abertoEmprestei) {\n      const e = abertoPeguei || abertoEmprestei;\n      botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"registrar-devolucao\" data-id=\"${esc(l.id)}\" data-emp=\"${esc(e.id)}\">Registrar devolução</button>`);\n    } else if (grupo === 'fisico') {\n      botoes.push(`<button type=\"button\" class=\"botao\" data-acao=\"emprestar\" data-id=\"${esc(l.id)}\">Emprestar</button>`);\n    }\n  }\n  botoes.push(`<button type=\"button\" class=\"botao primario\" data-acao=\"editar-livro\" data-id=\"${esc(l.id)}\">Editar</button>`);\n\n  abrirModal({\n    titulo: '<span class=\"sr-only\">Ficha do livro</span>',\n    corpo: `<div class=\"ficha\">\n        <div class=\"ficha-capa\">${capaHTML(l, 'grande')}</div>\n        <div>\n          <p class=\"ficha-grupo\">${esc(origem)}</p>\n          <h2 class=\"ficha-titulo\">${esc(l.titulo)}</h2>\n          <p class=\"ficha-autores\">${esc(nomesAutores(l, { papeis: true })) || 'Autor não informado'}</p>\n          ${grupo !== 'desejo' ? `<div class=\"ficha-leitura\">${statusHTML(l.status)}${estrelasHTML(l.nota, 18)}</div>` : ''}\n          <dl class=\"fatos\">${fatos.map(([t, v]) => `<dt>${t}</dt><dd>${v}</dd>`).join('')}</dl>\n          ${releituras}${emprestimos}\n          ${l.obs ? `<div class=\"ficha-bloco\"><h3>Observações</h3><p class=\"ficha-obs\">${esc(l.obs)}</p></div>` : ''}\n        </div>\n      </div>`,\n    rodape: `<button type=\"button\" class=\"botao discreto perigo esquerda\" data-acao=\"excluir-livro\" data-id=\"${esc(l.id)}\">Excluir</button>${botoes.join('')}`,\n  });\n}\n\n/* ===== Formulário de livro ===== */\n\nfunction livroVazio(posse = 'propria') {\n  return {\n    id: novoId('l'), chegada: 0, titulo: '', serie: '', volume: null,\n    autores: [{ nome: '', papel: 'autor', sobrenome: '' }],\n    editora: '', ano: null, isbn: '', paginas: null,\n    categoria: '', formato: posse === 'desejo' ? '' : 'brochura', posse,\n    status: 'nao-lido', inicio: null, fim: null, nota: null,\n    releituras: [], obs: '', capa: '',\n    emprestimos: posse === 'emprestada' ? [{ id: novoId('e'), tipo: 'peguei', pessoa: '', data: hojeISO(), devolverAte: null, devolvido: false, devolvidoEm: null }] : [],\n    prioridade: '',\n  };\n}\n\nfunction autorLinhaHTML(a) {\n  return `<div class=\"autor-linha\">\n    <label class=\"campo\"><span>Nome</span><input type=\"text\" name=\"autor-nome\" value=\"${esc(a.nome)}\" data-sugerir-sobrenome autocomplete=\"off\"></label>\n    <label class=\"campo\"><span>Papel</span><select name=\"autor-papel\">${opcoesHTML(PAPEIS, a.papel || 'autor')}</select></label>\n    <label class=\"campo\"><span>Sobrenome</span><input type=\"text\" name=\"autor-sobrenome\" value=\"${esc(a.sobrenome)}\"></label>\n    <button type=\"button\" class=\"remover\" data-acao=\"remover-autor\" aria-label=\"Remover pessoa\">×</button>\n  </div>`;\n}\n\nfunction notaEntradaHTML(nota) {\n  const v = Number(nota) || 0;\n  return `<div class=\"nota-entrada\" data-nota-entrada>\n    <input type=\"hidden\" name=\"nota\" value=\"${v || ''}\">\n    <span class=\"nota-alvo\">\n      <span class=\"estrelas\" style=\"--v:${v}\"></span>\n      <span class=\"nota-botoes\">${Array.from({ length: 10 }, (_, i) => `<button type=\"button\" data-acao=\"nota\" data-valor=\"${(i + 1) / 2}\" aria-label=\"Nota ${numero((i + 1) / 2, (i + 1) % 2 ? 1 : 0)}\"></button>`).join('')}</span>\n    </span>\n    <span class=\"nota-texto\">${v ? numero(v, v % 1 ? 1 : 0) : 'Sem nota'}</span>\n    <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"nota\" data-valor=\"0\">Limpar</button>\n  </div>`;\n}\n\nfunction abrirFormulario(livro, { novo = false } = {}) {\n  const l = livro;\n  const emp = l.emprestimos.find(e => e.tipo === 'peguei') || { pessoa: '', data: hojeISO(), devolverAte: null, devolvido: false, devolvidoEm: null };\n  estado.formulario = { id: l.id, novo, capa: l.capa || '' };\n  const titulo = novo ? (l.posse === 'desejo' ? 'Adicionar desejo' : l.posse === 'emprestada' ? 'Registrar livro emprestado' : 'Adicionar livro') : 'Editar livro';\n  const botao = novo ? (l.posse === 'desejo' ? 'Adicionar desejo' : 'Adicionar livro') : 'Aplicar alterações';\n  const categorias = [...(l.categoria ? [] : [['', 'Escolha a categoria']]), ...dados.categorias.map(c => [c.id, c.nome])];\n  const descricaoCat = (categoriaPorId(l.categoria) || {}).descricao || '';\n\n  abrirModal({\n    titulo,\n    formulario: 'livro',\n    corpo: `<div class=\"form-livro\">\n      <div class=\"form-capa\" data-zona-capa>\n        <div data-previa-capa>${capaHTML(l)}</div>\n        <input type=\"file\" accept=\"image/*\" data-arquivo-capa hidden>\n        <button type=\"button\" class=\"botao pequeno\" data-acao=\"escolher-capa\">Escolher imagem</button>\n        <a class=\"botao pequeno\" href=\"#\" target=\"_blank\" rel=\"noopener noreferrer\" data-link-busca-capa>Buscar na internet</a>\n        <p class=\"ajuda\">Também dá para colar uma imagem copiada com Ctrl+V ou arrastá-la até a capa.</p>\n        <p class=\"ajuda\" data-capa-status aria-live=\"polite\"></p>\n        <button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"remover-capa\"${l.capa ? '' : ' hidden'}>Remover capa</button>\n      </div>\n      <div>\n        <div class=\"isbn-linha\">\n          <label class=\"campo\"><span>ISBN</span><input type=\"text\" name=\"isbn\" value=\"${esc(formatarISBN(l.isbn))}\" inputmode=\"numeric\" autocomplete=\"off\"${l.semIsbn ? ' disabled' : ''}></label>\n          <button type=\"button\" class=\"botao\" data-acao=\"buscar-isbn\"${l.semIsbn ? ' disabled' : ''}>Buscar dados</button>\n        </div>\n        <label class=\"opcao-sem-isbn\"><input type=\"checkbox\" name=\"sem-isbn\"${l.semIsbn ? ' checked' : ''}> Este livro não tem ISBN</label>\n        <p class=\"isbn-status\" data-isbn-status aria-live=\"polite\"></p>\n        <div class=\"campos\" style=\"margin-top:10px\">\n          <label class=\"campo c6\"><span>Título</span><input type=\"text\" name=\"titulo\" value=\"${esc(l.titulo)}\" required></label>\n          <label class=\"campo c4\"><span>Série</span><input type=\"text\" name=\"serie\" value=\"${esc(l.serie)}\"></label>\n          <label class=\"campo c2\"><span>Volume</span><input type=\"number\" name=\"volume\" min=\"1\" value=\"${esc(l.volume ?? '')}\"></label>\n        </div>\n        <fieldset class=\"grupo-form\">\n          <legend>Autoria</legend>\n          <div class=\"autores-lista\" data-autores>${(l.autores.length ? l.autores : [{ nome: '', papel: 'autor', sobrenome: '' }]).map(autorLinhaHTML).join('')}</div>\n          <div class=\"acoes\" style=\"margin-top:8px\"><button type=\"button\" class=\"botao discreto pequeno\" data-acao=\"adicionar-autor\">Adicionar pessoa</button></div>\n          <p class=\"ajuda\">O sobrenome define a posição na estante. Em nomes como Hwang Bo-reum, o sobrenome vem primeiro.</p>\n        </fieldset>\n        <fieldset class=\"grupo-form\">\n          <legend>Classificação</legend>\n          <div class=\"campos\">\n            <label class=\"campo c3\"><span>Categoria</span><select name=\"categoria\" data-categoria>${opcoesHTML(categorias, l.categoria)}</select></label>\n            <label class=\"campo c3\"><span>Formato</span><select name=\"formato\">${opcoesHTML(FORMATOS, l.formato)}</select></label>\n            <p class=\"ajuda c6\" data-descricao-categoria>${esc(descricaoCat)}</p>\n            <div class=\"campo c6\"><span>Posse</span>\n              <div class=\"segmentado\" role=\"radiogroup\" aria-label=\"Posse\">${POSSES.map(([v, r]) => `<label><input type=\"radio\" name=\"posse\" value=\"${v}\"${l.posse === v ? ' checked' : ''}>${r}</label>`).join('')}</div>\n            </div>\n            <label class=\"campo c4\"><span>Editora</span><input type=\"text\" name=\"editora\" value=\"${esc(l.editora)}\"></label>\n            <label class=\"campo c1\"><span>Ano</span><input type=\"number\" name=\"ano\" min=\"1400\" max=\"2100\" value=\"${esc(l.ano ?? '')}\"></label>\n            <label class=\"campo c1\"><span>Páginas</span><input type=\"number\" name=\"paginas\" min=\"1\" value=\"${esc(l.paginas ?? '')}\"></label>\n          </div>\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"desejo\"${l.posse === 'desejo' ? '' : ' hidden'}>\n          <legend>Desejo</legend>\n          <div class=\"campos\"><label class=\"campo c3\"><span>Prioridade</span><select name=\"prioridade\">${opcoesHTML(PRIORIDADES, l.prioridade || '')}</select></label></div>\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"emprestada\"${l.posse === 'emprestada' ? '' : ' hidden'}>\n          <legend>Empréstimo</legend>\n          <div class=\"campos\">\n            <label class=\"campo c3\"><span>Emprestado por</span><input type=\"text\" name=\"emp-pessoa\" value=\"${esc(emp.pessoa)}\" list=\"pessoas-conhecidas\"></label>\n            <label class=\"campo c3\"><span>Data do empréstimo</span><input type=\"date\" name=\"emp-data\" value=\"${esc(emp.data || '')}\"></label>\n            <label class=\"campo c3\"><span>Devolver até</span><input type=\"date\" name=\"emp-devolver\" value=\"${esc(emp.devolverAte || '')}\"></label>\n            <label class=\"campo c3\"><span>Devolvido em</span><input type=\"date\" name=\"emp-devolvido-em\" value=\"${esc(emp.devolvidoEm || '')}\"></label>\n            <label class=\"c6\" style=\"display:flex;gap:8px;align-items:center\"><input type=\"checkbox\" name=\"emp-devolvido\"${emp.devolvido ? ' checked' : ''}> Já devolvi</label>\n            <p class=\"ajuda c6\">Sem data do empréstimo ou da devolução, o programa usa o início e o término da leitura.</p>\n          </div>\n          ${pessoasDatalist()}\n        </fieldset>\n        <fieldset class=\"grupo-form\" data-se-posse=\"leitura\"${l.posse === 'desejo' ? ' hidden' : ''}>\n          <legend>Leitura</legend>\n          <div class=\"campos\">\n            <label class=\"campo c2\"><span>Status</span><select name=\"status\" data-status>${opcoesHTML(STATUS, l.status)}</select></label>\n            <label class=\"campo c2\"><span>Início</span><input type=\"date\" name=\"inicio\" value=\"${esc(l.inicio || '')}\"></label>\n            <label class=\"campo c2\"><span>Término</span><input type=\"date\" name=\"fim\" value=\"${esc(l.fim || '')}\"></label>\n            <div class=\"campo c6\"><span>Nota</span>${notaEntradaHTML(l.nota)}</div>\n          </div>\n        </fieldset>\n        <fieldset class=\"grupo-form\">\n          <legend>Observações</legend>\n          <textarea name=\"obs\" aria-label=\"Observações\">${esc(l.obs)}</textarea>\n        </fieldset>\n        <p class=\"mensagem-erro\" data-erro-form aria-live=\"assertive\"></p>\n      </div>\n    </div>`,\n    rodape: `<button type=\"button\" class=\"botao\" data-acao=\"fechar-modal\">Cancelar</button><button type=\"submit\" class=\"botao primario\">${botao}</button>`,\n  });\n  estado.formulario.livro = l;\n}\n\nfunction pessoasDatalist() {\n  const nomes = [...new Set(emprestimosDe(dados).map(e => e.emp.pessoa).filter(Boolean))].sort(colador.compare);\n  return `<datalist id=\"pessoas-conhecidas\">${nomes.map(n => `<option value=\"${esc(n)}\"></option>`).join('')}</datalist>`;\n}\n\nfunction atualizarPreviaCapa(form) {\n  const f = estado.formulario;\n  const titulo = form.querySelector('[name=\"titulo\"]').value || 'Título';\n  const provisorio = { ...f.livro, titulo, capa: f.capa, categoria: form.querySelector('[name=\"categoria\"]').value, autores: lerAutores(form) };\n  form.querySelector('[data-previa-capa]').innerHTML = capaHTML(provisorio);\n  form.querySelector('[data-acao=\"remover-capa\"]').hidden = !f.capa;\n}\n\nfunction lerAutores(form) {\n  const nomes = [...form.querySelectorAll('[name=\"autor-nome\"]')].map(i => i.value.trim());\n  const papeis = [...form.querySelectorAll('[name=\"autor-papel\"]')].map(i => i.value);\n  const sobrenomes = [...form.querySelectorAll('[name=\"autor-sobrenome\"]')].map(i => i.value.trim());\n  return nomes.map((nome, i) => ({ nome, papel: papeis[i] || 'autor', sobrenome: sobrenomes[i] || sugerirSobrenome(nome) })).filter(a => a.nome);\n}\n\nfunction enviarFormularioLivro(form) {\n  const f = estado.formulario;\n  const erro = form.querySelector('[data-erro-form]');\n  const valor = nome => (form.querySelector(`[name=\"${nome}\"]`) || {}).value?.trim() ?? '';\n  const inteiro = nome => { const n = parseInt(valor(nome), 10); return Number.isFinite(n) && n > 0 ? n : null; };\n  erro.textContent = '';\n  form.querySelectorAll('.campo.erro').forEach(c => c.classList.remove('erro'));\n  const falhar = (mensagem, campo) => {\n    erro.textContent = mensagem;\n    const alvo = campo && form.querySelector(`[name=\"${campo}\"]`);\n    if (alvo) { alvo.closest('.campo')?.classList.add('erro'); alvo.focus(); }\n  };\n\n  const titulo = valor('titulo');\n  if (!titulo) return falhar('Informe o título do livro.', 'titulo');\n  let isbn = '';\n  if (valor('isbn')) {\n    isbn = normalizarISBN(valor('isbn'));\n    if (!isbn) return falhar('O ISBN precisa ter 10 ou 13 dígitos.', 'isbn');\n  }\n  if (!valor('categoria')) return falhar('Escolha a categoria do livro: ela define a posição na estante.', 'categoria');\n  const semIsbn = !!(form.querySelector('[name=\"sem-isbn\"]') || {}).checked && !isbn;\n  const posse = (form.querySelector('[name=\"posse\"]:checked') || {}).value || 'propria';\n  const inicio = valor('inicio') || null;\n  const fim = valor('fim') || null;\n  if (posse !== 'desejo' && inicio && fim && fim < inicio) return falhar('O término não pode ser antes do início.', 'fim');\n\n  const original = f.novo ? null : livroPorId(f.id);\n  if (isbn && (!original || original.isbn !== isbn)) {\n    const repetido = dados.livros.find(l => l.isbn === isbn && l.id !== f.id);\n    if (repetido && !f.confirmouRepetido) {\n      f.confirmouRepetido = true;\n      return falhar(`Já existe um livro com esse ISBN: ${repetido.titulo}. Para cadastrar mesmo assim, clique de novo no botão.`, 'isbn');\n    }\n  }\n\n  const l = original ? JSON.parse(JSON.stringify(original)) : f.livro;\n  const grupoAntes = original ? grupoDe(original) : null;\n  Object.assign(l, {\n    titulo, isbn, semIsbn,\n    serie: valor('serie'), volume: inteiro('volume'),\n    autores: lerAutores(form),\n    categoria: valor('categoria'), formato: valor('formato'), posse,\n    editora: valor('editora'), ano: inteiro('ano'), paginas: inteiro('paginas'),\n    obs: (form.querySelector('[name=\"obs\"]').value || '').trim(),\n    capa: f.capa || '',\n  });\n  if (posse === 'desejo') {\n    l.prioridade = valor('prioridade');\n  } else {\n    l.prioridade = '';\n    l.status = valor('status') || 'nao-lido';\n    l.inicio = inicio;\n    l.fim = fim;\n    l.nota = Number(valor('nota')) || null;\n  }\n  const peguei = l.emprestimos.find(e => e.tipo === 'peguei');\n  if (posse === 'emprestada') {\n    const registro = peguei || { id: novoId('e'), tipo: 'peguei' };\n    const novosValores = {\n      pessoa: valor('emp-pessoa'), data: valor('emp-data') || null, devolverAte: valor('emp-devolver') || null,\n      devolvido: form.querySelector('[name=\"emp-devolvido\"]').checked, devolvidoEm: valor('emp-devolvido-em') || null,\n    };\n    if (novosValores.devolvidoEm) novosValores.devolvido = true;\n    const mudouDatas = !!original && !!peguei && (['data', 'devolverAte', 'devolvidoEm'].some(k => (registro[k] || '') !== (novosValores[k] || '')) || !!registro.devolvido !== novosValores.devolvido);\n    if (mudouDatas) {\n      novosValores.manual = true;\n      novosValores.pelaLeitura = false;\n    }\n    Object.assign(registro, novosValores);\n    if (!peguei) l.emprestimos.push(registro);\n  } else if (peguei && !peguei.devolvido) {\n    peguei.devolvido = true;\n  }\n\n  const grupoDepois = grupoDe(l);\n  const mudouGrupo = grupoAntes !== grupoDepois;\n  alterar(() => {\n    if (!original || (mudouGrupo && (grupoDepois === 'digital' || grupoDepois === 'emprestado'))) l.chegada = dados.proximaChegada++;\n    if (original) dados.livros[dados.livros.findIndex(x => x.id === l.id)] = l;\n    else dados.livros.push(l);\n  }, { mensagem: mensagemDeEntrada(l, !original) });\n  fecharModal();\n  if (estado.voltarPara === 'revisao') {\n    estado.voltarPara = null;\n    abrirRevisao();\n  }\n}\n\nfunction mensagemDeEntrada(livro, novo) {\n  if (!novo) return 'Alterações aplicadas';\n  return () => {\n    const codigo = estado.codigos.get(livro.id);\n    return codigo ? `${livro.titulo} entrou como ${codigo}` : `${livro.titulo} entrou na lista de desejos`;\n  };\n}\n\n/* ===== Busca de dados e capas ===== */\n\nfunction esperar(ms) {\n  return new Promise(ok => setTimeout(ok, ms));\n}\n\nasync function obterJSON(url, { tempo = 12000, tentativas = 3 } = {}) {\n  for (let tentativa = 1; ; tentativa++) {\n    const controle = new AbortController();\n    const timer = setTimeout(() => controle.abort(), tempo);\n    let resposta;\n    try {\n      resposta = await fetch(url, { signal: controle.signal });\n    } catch (e) {\n      e.rede = true;\n      throw e;\n    } finally {\n      clearTimeout(timer);\n    }\n    if (resposta.status === 404) return null;\n    if (resposta.status === 429 && tentativa < tentativas) {\n      await esperar(1500 * tentativa);\n      continue;\n    }\n    if (!resposta.ok) {\n      const erro = new Error('HTTP ' + resposta.status);\n      erro.status = resposta.status;\n      try {\n        const corpo = await resposta.json();\n        const detalhe = corpo && (corpo.error || corpo.message);\n        erro.detalhe = typeof detalhe === 'string' ? detalhe : (detalhe && detalhe.message) || '';\n      } catch (e) { erro.detalhe = ''; }\n      throw erro;\n    }\n    return await resposta.json();\n  }\n}\n\nfunction isbn10De(isbn) {\n  if (!/^978\\d{10
