/* ===== Utilitários ===== */

function naNuvem() {
  return typeof MODO_NUVEM !== 'undefined' && MODO_NUVEM;
}

function noApp() {
  return typeof MODO_APP !== 'undefined' && MODO_APP;
}

function gravaSozinho() {
  return naNuvem() || noApp();
}

function esc(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function normalizar(texto) {
  return String(texto ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function isoLocal(data) {
  return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0') + '-' + String(data.getDate()).padStart(2, '0');
}

function hojeISO() { return isoLocal(new Date()); }

function dataValida(iso) { return typeof iso === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(iso); }

function paraData(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d);
}

function diasEntre(inicio, fim) {
  return Math.round((paraData(fim) - paraData(inicio)) / 86400000);
}

function dataBR(iso) {
  if (!dataValida(iso)) return '';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function dataHoraBR(isoCompleto) {
  if (!isoCompleto) return '';
  const d = new Date(isoCompleto);
  if (isNaN(d)) return '';
  const hora = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return `${dataBR(isoLocal(d))} às ${hora}`;
}

function numero(n, casas = 0) {
  return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}

function plural(n, um, varios) {
  return `${numero(n)} ${n === 1 ? um : varios}`;
}

function juntarNomes(nomes) {
  const lista = nomes.filter(Boolean);
  if (lista.length <= 1) return lista[0] || '';
  return lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
}

function novoId(prefixo) {
  return prefixo + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function hashTexto(texto) {
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++) {
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function corSegura(cor, reserva = '#3E4A57') {
  return /^#[0-9a-f]{6}$/i.test(cor || '') ? cor : reserva;
}

function urlCapaSegura(url) {
  return /^(https?:\/\/[^\s"'<>]+|data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=]+)$/i.test(url || '');
}

function semArtigo(titulo) {
  return String(titulo || '').trim().replace(/^(o|a|os|as|um|uma|uns|umas)\s+/i, '');
}

function normalizarISBN(bruto) {
  const d = String(bruto || '').replace(/[^0-9xX]/g, '').toUpperCase();
  if (d.length === 13 && /^\d{13}$/.test(d)) return d;
  if (d.length === 10 && /^\d{9}[\dX]$/.test(d)) {
    const base = '978' + d.slice(0, 9);
    const soma = [...base].reduce((s, c, i) => s + Number(c) * (i % 2 ? 3 : 1), 0);
    return base + ((10 - soma % 10) % 10);
  }
  return null;
}

function formatarISBN(isbn) {
  return String(isbn || '');
}

/* ===== Autores ===== */

const SOBRENOMES_LESTE_ASIATICO = new Set('kim lee yi park pak choi jung jeong kang cho jo yoon yun jang lim im han oh seo shin sin kwon hwang ahn song hong jeon ko go moon mun yang son sohn bae baek heo nam sim noh roh ha kwak sung cha joo ju woo min ryu yoo na jin ji eom won chae pyo gong wang li zhang liu chen huang zhao wu zhou xu sun ma zhu hu guo he lin luo gao yu mo su ye tang deng feng cao peng zeng xiao tian dong pan yuan cai jiang du wei xue lu'.split(' '));

function sobrenomeVemPrimeiro(partes) {
  return partes.length === 2 && SOBRENOMES_LESTE_ASIATICO.has(partes[0].toLowerCase()) && /^[A-Za-zÀ-ÿ]+-[A-Za-zÀ-ÿ]+$/.test(partes[1]);
}

function sugerirSobrenome(nome) {
  const limpo = String(nome || '').replace(/\(.*?\)/g, '').trim();
  if (!limpo) return '';
  const partes = limpo.split(/\s+/);
  if (partes.length === 1) return partes[0];
  if (sobrenomeVemPrimeiro(partes)) return partes[0];
  const ultimo = partes[partes.length - 1];
  if (/^(filho|júnior|junior|jr\.?|neto|sobrinho)$/i.test(ultimo) && partes.length > 2) {
    return partes[partes.length - 2] + ' ' + ultimo;
  }
  return ultimo;
}

function autorPrincipal(livro) {
  const autores = (livro.autores || []).filter(a => a.nome);
  return autores.find(a => a.papel === 'autor') || autores[0] || null;
}

function chaveSobrenome(livro) {
  const a = autorPrincipal(livro);
  return a ? (a.sobrenome || sugerirSobrenome(a.nome)) : '';
}

function nomesAutores(livro, { papeis = false } = {}) {
  const autores = (livro.autores || []).filter(a => a.nome);
  const principais = autores.filter(a => a.papel === 'autor').map(a => a.nome);
  const outros = autores.filter(a => a.papel !== 'autor');
  let texto = juntarNomes(principais);
  if (papeis || !texto) {
    const complemento = outros.map(a => `${PAPEL_DE[a.papel] || ''} ${a.nome}`.trim()).join('; ');
    if (complemento) texto = texto ? `${texto}; ${complemento}` : complemento.charAt(0).toUpperCase() + complemento.slice(1);
  }
  return texto;
}

/* ===== Grupos e numeração ===== */

function grupoDe(livro) {
  if (livro.posse === 'desejo') return 'desejo';
  if (livro.posse === 'emprestada') return 'emprestado';
  if (livro.formato === 'e-book' || livro.formato === 'audiobook') return 'digital';
  return 'fisico';
}

function compararEstante(posicaoCategoria) {
  const ordem = l => (posicaoCategoria.has(l.categoria) ? posicaoCategoria.get(l.categoria) : 9999);
  const nomeAutor = l => (autorPrincipal(l) || {}).nome || '';
  return (a, b) => (ordem(a) - ordem(b))
    || colador.compare(chaveSobrenome(a), chaveSobrenome(b))
    || colador.compare(nomeAutor(a), nomeAutor(b))
    || colador.compare(semArtigo(a.serie || a.titulo), semArtigo(b.serie || b.titulo))
    || ((a.volume || 0) - (b.volume || 0))
    || colador.compare(semArtigo(a.titulo), semArtigo(b.titulo))
    || ((a.chegada || 0) - (b.chegada || 0));
}

function estaForaDaEstante(livro) {
  return grupoDe(livro) === 'fisico' && (livro.status === 'lendo' || !!emprestadoPorMim(livro));
}

function dataDeSaida(livro) {
  const emprestimo = emprestadoPorMim(livro);
  return (emprestimo && emprestimo.data) || livro.inicio || '';
}

function motivoDeSaida(livro) {
  const emprestimo = emprestadoPorMim(livro);
  if (emprestimo) return `Emprestado para ${(emprestimo.pessoa || '').trim() || 'pessoa não informada'}${dataValida(emprestimo.data) ? `, desde ${dataBR(emprestimo.data)}` : ''}`;
  return `Em leitura${dataValida(livro.inicio) ? `, desde ${dataBR(livro.inicio)}` : ''}`;
}

function numerarPresentes(dados) {
  return dados.preferencias ? dados.preferencias.numeracaoPresentes !== false : true;
}

function numeroDeVolta(dados, livro) {
  const posicao = new Map(dados.categorias.map((c, i) => [c.id, i]));
  const fila = dados.livros.filter(l => grupoDe(l) === 'fisico' && !estaForaDaEstante(l) && l.id !== livro.id);
  fila.push(livro);
  fila.sort(compararEstante(posicao));
  return fila.findIndex(l => l.id === livro.id) + 1;
}

function calcularCodigos(dados) {
  const posicao = new Map(dados.categorias.map((c, i) => [c.id, i]));
  const codigos = new Map();
  const separar = numerarPresentes(dados);
  const fisicos = dados.livros.filter(l => grupoDe(l) === 'fisico');
  const fora = separar ? fisicos.filter(estaForaDaEstante) : [];
  const presentes = separar ? fisicos.filter(l => !estaForaDaEstante(l)) : fisicos;
  presentes.sort(compararEstante(posicao)).forEach((l, i) => codigos.set(l.id, String(i + 1)));
  fora.sort((a, b) => String(dataDeSaida(a)).localeCompare(String(dataDeSaida(b))) || compararEstante(posicao)(a, b))
    .forEach((l, i) => codigos.set(l.id, 'F' + (i + 1)));
  const porChegada = (a, b) => (a.chegada || 0) - (b.chegada || 0);
  dados.livros.filter(l => grupoDe(l) === 'digital').sort(porChegada)
    .forEach((l, i) => codigos.set(l.id, 'E' + (i + 1)));
  dados.livros.filter(l => grupoDe(l) === 'emprestado').sort(porChegada)
    .forEach((l, i) => codigos.set(l.id, 'EMP' + (i + 1)));
  return codigos;
}

function ordemDoCodigo(codigo) {
  if (!codigo) return [9, 0];
  if (/^\d+$/.test(codigo)) return [0, Number(codigo)];
  if (codigo.startsWith('EMP')) return [3, Number(codigo.slice(3))];
  if (codigo.startsWith('F')) return [1, Number(codigo.slice(1))];
  return [2, Number(codigo.slice(1))];
}

function compararCodigos(ca, cb) {
  const a = ordemDoCodigo(ca), b = ordemDoCodigo(cb);
  return (a[0] - b[0]) || (a[1] - b[1]);
}

/* ===== Leituras e empréstimos ===== */

function leiturasConcluidas(dados) {
  const lista = [];
  for (const livro of dados.livros) {
    if (livro.posse === 'desejo') continue;
    for (const r of livro.releituras || []) {
      if (dataValida(r.fim)) lista.push({ livro, inicio: r.inicio, fim: r.fim, nota: r.nota });
    }
    if (livro.status === 'lido' && dataValida(livro.fim)) {
      lista.push({ livro, inicio: livro.inicio, fim: livro.fim, nota: livro.nota });
    }
  }
  return lista.sort((a, b) => (a.fim < b.fim ? 1 : a.fim > b.fim ? -1 : 0));
}

function emprestimosDe(dados, { abertos } = {}) {
  const lista = [];
  for (const livro of dados.livros) {
    for (const emp of livro.emprestimos || []) {
      if (abertos === undefined || abertos === !emp.devolvido) lista.push({ livro, emp });
    }
  }
  return lista;
}

function normalizarDados(d) {
  if (!d || !Array.isArray(d.livros) || !Array.isArray(d.categorias)) throw new Error('Formato de dados desconhecido');
  d.metas = d.metas && typeof d.metas === 'object' ? d.metas : {};
  d.preferencias = d.preferencias && typeof d.preferencias === 'object' ? d.preferencias : {};
  d.preferencias.chaveGoogle = typeof d.preferencias.chaveGoogle === 'string' ? d.preferencias.chaveGoogle.trim() : '';
  d.preferencias.numeracaoPresentes = d.preferencias.numeracaoPresentes !== false;
  d.categorias.forEach((c, i) => {
    c.id = String(c.id || novoId('c'));
    c.nome = String(c.nome || 'Sem nome');
    c.descricao = String(c.descricao || '');
    c.cor = corSegura(c.cor, CORES_EXTRAS[i % CORES_EXTRAS.length]);
  });
  let maiorChegada = 0;
  d.livros.forEach(l => {
    l.id = String(l.id || novoId('l'));
    l.titulo = String(l.titulo || 'Sem título');
    l.autores = Array.isArray(l.autores) ? l.autores : [];
    l.releituras = Array.isArray(l.releituras) ? l.releituras : [];
    l.semIsbn = !l.isbn && !!l.semIsbn;
    l.emprestimos = Array.isArray(l.emprestimos) ? l.emprestimos : [];
    l.emprestimos.forEach(e => { e.id = String(e.id || novoId('e')); });
    if (!STATUS_ROTULO[l.status]) l.status = 'nao-lido';
    if (!['propria', 'emprestada', 'desejo'].includes(l.posse)) l.posse = 'propria';
    if (!(l.formato in FORMATO_ROTULO)) l.formato = '';
    l.chegada = Number(l.chegada) || 0;
    maiorChegada = Math.max(maiorChegada, l.chegada);
  });
  d.proximaChegada = Math.max(Number(d.proximaChegada) || 0, maiorChegada + 1);
  d.livros.forEach(aplicarRegraDevolucao);
  arrumarNomesEEditoras(d);
  return d;
}

/* ===== Empréstimos sem datas usam as datas da leitura ===== */

function aplicarRegraDevolucao(livro) {
  const pegos = (livro.emprestimos || [])
    .filter(e => e.tipo === 'peguei' && !e.manual)
    .sort((a, b) => String(a.data || '9999').localeCompare(String(b.data || '9999')));
  if (!pegos.length) return false;
  const leituras = [...(livro.releituras || []), { inicio: livro.inicio, fim: livro.status === 'lido' ? livro.fim : null }]
    .filter(r => dataValida(r.inicio) || dataValida(r.fim))
    .sort((a, b) => String(a.inicio || a.fim).localeCompare(String(b.inicio || b.fim)));
  if (!leituras.length) return false;
  let mudou = false;
  pegos.forEach((e, i) => {
    const doEmprestimo = pegos.length === 1 ? leituras : [leituras[i]].filter(Boolean);
    const inicios = doEmprestimo.map(r => r.inicio).filter(dataValida).sort();
    const fins = doEmprestimo.map(r => r.fim).filter(dataValida).sort();
    if (!dataValida(e.data) && inicios.length) {
      e.data = inicios[0];
      e.pelaLeitura = true;
      mudou = true;
    }
    if (!dataValida(e.devolvidoEm) && fins.length) {
      const fim = fins[fins.length - 1];
      if (!dataValida(e.data) || fim >= e.data) {
        e.devolvidoEm = fim;
        e.devolvido = true;
        e.pelaLeitura = true;
        mudou = true;
      }
    }
  });
  return mudou;
}

function descricaoEmprestimo(e) {
  const pessoa = (e.pessoa || '').trim() || 'pessoa não informada';
  const quem = e.tipo === 'peguei' ? `Emprestado por ${pessoa}` : `Emprestado para ${pessoa}`;
  const quando = dataValida(e.data) ? ` em ${dataBR(e.data)}` : '';
  let situacao;
  if (e.devolvido) situacao = `, devolvido${dataValida(e.devolvidoEm) ? ` em ${dataBR(e.devolvidoEm)}` : ''}`;
  else situacao = dataValida(e.devolverAte) ? `, devolver até ${dataBR(e.devolverAte)}` : ', em aberto';
  return `${quem}${quando}${situacao}.`;
}

/* ===== Revisão dos dados ===== */

function revisarDados(dados, capasQuebradas = new Set()) {
  const categorias = new Set(dados.categorias.map(c => c.id));
  const hoje = hojeISO();
  const porIsbn = new Map();
  dados.livros.forEach(l => { if (l.isbn) porIsbn.set(l.isbn, (porIsbn.get(l.isbn) || 0) + 1); });
  const importantes = [];
  const complementos = { isbn: [], paginas: [], editora: [], ano: [], formato: [], capa: [] };
  for (const l of dados.livros) {
    const grupo = grupoDe(l);
    const itens = [];
    if (!autorPrincipal(l)) itens.push('sem autor');
    if (grupo !== 'desejo') {
      const jaLido = l.status === 'lido' || (l.releituras || []).some(r => dataValida(r.fim));
      if (!categorias.has(l.categoria)) itens.push('sem categoria');
      if (l.status === 'lido') {
        if (!dataValida(l.inicio)) itens.push('lido sem data de início');
        if (!dataValida(l.fim)) itens.push('lido sem data de término');
        if (!l.nota) itens.push('lido sem nota');
      }
      if ((l.status === 'lendo' || l.status === 'pausado') && !dataValida(l.inicio)) itens.push('em leitura sem data de início');
      if (dataValida(l.inicio) && dataValida(l.fim) && l.fim < l.inicio) itens.push('término antes do início');
      if (dataValida(l.inicio) && l.inicio > hoje) itens.push('início depois de hoje');
      if (jaLido && !l.paginas) itens.push('lido sem número de páginas, fica fora do total de páginas');
      for (const e of l.emprestimos || []) {
        if (!(e.pessoa || '').trim()) itens.push(e.tipo === 'peguei' ? 'empréstimo sem o nome de quem emprestou' : 'empréstimo sem o nome de quem pegou');
        if (dataValida(e.data) && dataValida(e.devolvidoEm) && e.devolvidoEm < e.data) itens.push('devolução antes do empréstimo');
      }
      if (grupo === 'emprestado' && !(l.emprestimos || []).some(e => e.tipo === 'peguei')) itens.push('marcado como emprestado, sem registro de empréstimo');
      if (l.isbn && porIsbn.get(l.isbn) > 1) itens.push('ISBN igual ao de outro livro');
      if (!l.isbn && !l.semIsbn) complementos.isbn.push(l);
      if (!jaLido && !l.paginas) complementos.paginas.push(l);
      if (!l.editora) complementos.editora.push(l);
      if (!l.ano) complementos.ano.push(l);
      if (!l.formato) complementos.formato.push(l);
      if (!urlCapaSegura(l.capa) || capasQuebradas.has(l.id)) complementos.capa.push(l);
    }
    if (itens.length) importantes.push({ livro: l, itens: [...new Set(itens)] });
  }
  return { importantes, complementos };
}

function emprestadoPorMim(livro) {
  return (livro.emprestimos || []).find(e => e.tipo === 'emprestei' && !e.devolvido) || null;
}

/* ===== Pequenas correções de nomes e editoras ===== */

function arrumarNomesEEditoras(d) {
  const chave = nome => normalizar(nome).replace(/[^a-z]/g, '');
  const variantes = new Map();
  d.livros.forEach(l => {
    if (typeof l.editora === 'string') {
      l.editora = l.editora.replace(/[*•]+/g, '').replace(/\s+/g, ' ').trim().replace(/\bLpm\b/g, 'L&PM');
    }
    (l.autores || []).forEach(a => {
      if (!a.nome) return;
      const k = chave(a.nome);
      if (!variantes.has(k)) variantes.set(k, new Map());
      const m = variantes.get(k);
      m.set(a.nome, (m.get(a.nome) || 0) + 1);
    });
  });
  const preferido = new Map([...variantes].map(([k, m]) => [k, [...m].sort((x, y) => y[1] - x[1])[0][0]]));
  d.livros.forEach(l => (l.autores || []).forEach(a => {
    if (!a.nome) return;
    const nome = preferido.get(chave(a.nome));
    if (nome && nome !== a.nome) a.nome = nome;
    const partes = a.nome.trim().split(/\s+/);
    if (sobrenomeVemPrimeiro(partes) && a.sobrenome === partes[1]) a.sobrenome = partes[0];
  }));
}

/* ===== Excel (.xlsx) sem bibliotecas externas ===== */

const TABELA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABELA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipar(arquivos) {
  const cod = new TextEncoder();
  const locais = [], centrais = [];
  let deslocamento = 0;
  for (const arq of arquivos) {
    const nome = cod.encode(arq.nome);
    const conteudo = cod.encode(arq.conteudo);
    const crc = crc32(conteudo);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(8, 0, true);
    local.setUint16(10, 0, true);
    local.setUint16(12, 0x21, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, conteudo.length, true);
    local.setUint32(22, conteudo.length, true);
    local.setUint16(26, nome.length, true);
    local.setUint16(28, 0, true);
    locais.push(new Uint8Array(local.buffer), nome, conteudo);
    const central = new DataView(new ArrayBuffer(46));
    central.setUint32(0, 0x02014b50, true);
    central.setUint16(4, 20, true);
    central.setUint16(6, 20, true);
    central.setUint16(8, 0x0800, true);
    central.setUint16(10, 0, true);
    central.setUint16(12, 0, true);
    central.setUint16(14, 0x21, true);
    central.setUint32(16, crc, true);
    central.setUint32(20, conteudo.length, true);
    central.setUint32(24, conteudo.length, true);
    central.setUint16(28, nome.length, true);
    central.setUint32(42, deslocamento, true);
    centrais.push(new Uint8Array(central.buffer), nome);
    deslocamento += 30 + nome.length + conteudo.length;
  }
  const tamanhoCentral = centrais.reduce((s, p) => s + p.length, 0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0, 0x06054b50, true);
  fim.setUint16(8, arquivos.length, true);
  fim.setUint16(10, arquivos.length, true);
  fim.setUint32(12, tamanhoCentral, true);
  fim.setUint32(16, deslocamento, true);
  const partes = [...locais, ...centrais, new Uint8Array(fim.buffer)];
  const saida = new Uint8Array(partes.reduce((s, p) => s + p.length, 0));
  let pos = 0;
  for (const p of partes) { saida.set(p, pos); pos += p.length; }
  return saida;
}

function xmlEsc(valor) {
  return String(valor)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function letraColuna(indice) {
  let s = '';
  let n = indice + 1;
  while (n > 0) {
    const r = (n - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function serialExcel(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return Math.round((Date.UTC(a, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}

function planilhaXML(colunas, linhas) {
  const cabecalho = colunas.map((c, i) => `<c r="${letraColuna(i)}1" t="inlineStr" s="1"><is><t>${xmlEsc(c.titulo)}</t></is></c>`).join('');
  const corpo = linhas.map((linha, li) => {
    const r = li + 2;
    const celulas = colunas.map((c, ci) => {
      const v = linha[ci];
      const ref = letraColuna(ci) + r;
      if (v === null || v === undefined || v === '') return '';
      if (c.tipo === 'numero' && typeof v === 'number' && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      if (c.tipo === 'data' && dataValida(v)) return `<c r="${ref}" s="2"><v>${serialExcel(v)}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r}">${celulas}</row>`;
  }).join('');
  const ultima = `${letraColuna(colunas.length - 1)}${linhas.length + 1}`;
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + `<dimension ref="A1:${ultima}"/>`
    + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + `<cols>${colunas.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.largura || 14}" customWidth="1"/>`).join('')}</cols>`
    + `<sheetData><row r="1">${cabecalho}</row>${corpo}</sheetData>`
    + `<autoFilter ref="A1:${ultima}"/>`
    + '</worksheet>';
}

function montarXLSX(abas) {
  const arquivos = [];

  arquivos.push({ nome: '[Content_Types].xml', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + tipos + '</Types>' });
  arquivos.push({ nome: '_rels/.rels', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
  const folhas = abas.map((a, i) => `<sheet name="${xmlEsc(a.nome)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('');

  arquivos.push({ nome: 'xl/workbook.xml', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${folhas}</sheets><definedNames>${filtros}</definedNames></workbook>` });
  const rels = abas.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('');
  arquivos.push({ nome: 'xl/_rels/workbook.xml.rels', conteudo: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}<Relationship Id="rId${abas.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });
  arquivos.push({ nome: 'xl/styles.xml', conteudo: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>' });
  abas.forEach((a, i) => arquivos.push({ nome: `xl/worksheets/sheet${i + 1}.xml`, conteudo: planilhaXML(a.colunas, a.linhas) }));
  return zipar(arquivos);
}

function codigoPlanilha(codigo) {
  return /^\d+$/.test(codigo || '') ? Number(codigo) : (codigo || '');
}

function gerarPlanilhaExcel(dados) {

  const categorias = new Map(dados.categorias.map(c => [c.id, c.nome]));

  const dias = (i, f) => (dataValida(i) && dataValida(f) ? diasEntre(i, f) : null);
  const livros = {

/* ===== Alterações ===== */

function alterar(funcao, { mensagem } = {}) {
  const antes = new Map([...estado.codigos].filter(([, c]) => /^\d+$/.test(c)));
  const titulos = new Map(dados.livros.map(l => [l.id, l.titulo]));
  funcao();
  dados.livros.forEach(aplicarRegraDevolucao);
  estado.codigos = calcularCodigos(dados);
  const depois = new Map([...estado.codigos].filter(([, c]) => /^\d+$/.test(c)));
  const trocas = [], entradas = [], saidas = [];
  for (const [id, c] of depois) {
    if (!antes.has(id)) entradas.push({ id, depois: c, titulo: livroPorId(id).titulo });
    else if (antes.get(id) !== c) trocas.push({ id, antes: antes.get(id), depois: c, titulo: livroPorId(id).titulo });
  }
  for (const [id, c] of antes) {
    if (!depois.has(id)) saidas.push({ id, antes: c, titulo: (livroPorId(id) || {}).titulo || titulos.get(id) });
  }
  agendarGravacao();
  if (trocas.length || entradas.length) {
    estado.destaque = new Set([...trocas, ...entradas].map(m => m.id));
    estado.destaqueAte = Date.now() + 5000;
  }
  render();
  const msg = typeof mensagem === 'function' ? mensagem() : mensagem;
  if (trocas.length) {
    const texto = `${msg ? msg + '. ' : ''}${trocas.length === 1 ? '1 livro mudou' : trocas.length + ' livros mudaram'} de número na estante.`;
    avisar(texto, { acao: 'Ver mudanças', fn: () => abrirMudancas({ trocas, entradas, saidas }), tempo: 9000 });
  } else if (msg) {
    avisar(msg);
  }
}

/* ===== Guarda no próprio aparelho ===== */

function abrirBanco() {
  return new Promise((ok, erro) => {
    const pedido = indexedDB.open('minha-biblioteca-app', 1);
    pedido.onupgradeneeded = () => pedido.result.createObjectStore('dados');
    pedido.onsuccess = () => ok(pedido.result);
    pedido.onerror = () => erro(pedido.error);
  });
}

function configDeDados() {
  return {
    formato: 'minha-biblioteca',
    versao: dados.versao || 1,
    id: dados.id,
    categorias: dados.categorias,
    metas: dados.metas,
    preferencias: dados.preferencias,
    proximaChegada: dados.proximaChegada,
    salvoEm: new Date().toISOString(),
  };
}

function instantaneo() {
  return {
    config: JSON.stringify(configDeDados()),
    livros: new Map(dados.livros.map(l => [l.id, JSON.stringify(l)])),
  };
}

async function lerGuardado() {
  const banco = await abrirBanco();
  return new Promise((ok, erro) => {
    const tx = banco.transaction('dados', 'readonly');
    const loja = tx.objectStore('dados');
    const registros = new Map();
    const cursor = loja.openCursor();
    cursor.onsuccess = () => {
      const c = cursor.result;
      if (c) { registros.set(String(c.key), c.value); c.continue(); }
    };
    tx.oncomplete = () => {
      if (registros.has('atual')) { ok({ antigo: registros.get('atual') }); return; }
      const config = registros.get('config');
      if (!config) { ok(null); return; }
      const livros = [...registros].filter(([k]) => k.startsWith('livro:')).map(([, v]) => v);
      ok({ ...config, livros });
    };
    tx.onerror = () => erro(tx.error);
  });
}

async function gravarMudancas(atual) {
  const banco = await abrirBanco();
  const enviado = estado.ultimoGravado || { config: null, livros: new Map() };
  return new Promise((ok, erro) => {
    const tx = banco.transaction('dados', 'readwrite');
    const loja = tx.objectStore('dados');
    if (enviado.config === null) loja.delete('atual');
    if (atual.config !== enviado.config) loja.put(JSON.parse(atual.config), 'config');
    for (const [id, texto] of atual.livros) {
      if (enviado.livros.get(id) !== texto) loja.put(JSON.parse(texto), 'livro:' + id);
    }
    for (const id of enviado.livros.keys()) {
      if (!atual.livros.has(id)) loja.delete('livro:' + id);
    }
    tx.oncomplete = () => ok();
    tx.onerror = () => erro(tx.error);
  });
}

function agendarGravacao() {
  estado.pendentes = true;
  renderEstadoSalvo();
  gravarAgora();
}

async function gravarAgora() {
  if (estado.gravando) return;
  estado.gravando = true;
  estado.pendentes = false;
  renderEstadoSalvo();
  const atual = instantaneo();
  try {
    await gravarMudancas(atual);
    estado.ultimoGravado = atual;
    estado.ultimoSalvo = new Date().toISOString();
    estado.erroGravacao = '';
  } catch (e) {
    estado.pendentes = true;
    estado.erroGravacao = 'Não foi possível guardar no aparelho. Baixe o arquivo para não perder as alterações.';
  } finally {
    estado.gravando = false;
    renderEstadoSalvo();
    if (estado.pendentes && !estado.erroGravacao) gravarAgora();
    else if (typeof agendarSincronizacao === 'function') agendarSincronizacao();
  }
}

async function iniciarApp() {
  montarEsqueleto();
  ligarEventos();
  let guardados = null;
  try {
    guardados = await lerGuardado();
  } catch (e) { /* primeira abertura ou armazenamento bloqueado */ }
  const antigo = guardados && guardados.antigo;
  dados = normalizarDados(antigo || guardados || JSON.parse(JSON.stringify(DADOS_INICIAIS)));
  estado.codigos = calcularCodigos(dados);
  estado.ultimoSalvo = guardados ? (dados.salvoEm || null) : null;
  estado.ultimoGravado = antigo || !guardados ? { config: null, livros: new Map() } : instantaneo();
  render();
  if (!guardados || antigo) await gravarAgora();
  registrarServicoOffline();
  if (typeof iniciarOneDrive === 'function') await iniciarOneDrive();
  if (!oneDriveLigado()) lembrarBackup();
}

function registrarServicoOffline() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').catch(() => { /* segue sem modo offline */ });
}

/* ===== Cópias de segurança ===== */

function diasDesdeBackup() {
  const quando = dados.preferencias && dados.preferencias.ultimoBackup;
  return dataValida(quando) ? diasEntre(quando, hojeISO()) : null;
}

function lembrarBackup() {
  const dias = diasDesdeBackup();
  if (dias === null) {
    avisar('Guarde uma cópia de segurança pelo menu Configurações sempre que puder.', { tempo: 9000 });
  } else if (dias >= 30) {
    avisar(`A última cópia de segurança foi há ${plural(dias, 'dia', 'dias')}.`, { acao: 'Baixar agora', fn: () => baixarArquivoHTML(), tempo: 12000 });
  }
}

function baixarConteudo(conteudo, nome, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function dadosSemChave() {
  const copia = JSON.parse(JSON.stringify(dados));
  copia.preferencias = { ...(copia.preferencias || {}), chaveGoogle: '' };
  return copia;
}

function baixarArquivoHTML({ comChave = true } = {}) {
  const base = comChave ? { ...dados } : dadosSemChave();
  const documento = montarDocumento({ ...base, salvoEm: new Date().toISOString() }, PROGRAMA_ARQUIVO.css, PROGRAMA_ARQUIVO.js);
  baixarConteudo(documento, 'Biblioteca.html', 'text/html;charset=utf-8');
  if (comChave) {
    alterar(() => { dados.preferencias.ultimoBackup = hojeISO(); }, { mensagem: 'Arquivo baixado. Coloque-o no OneDrive no lugar do Biblioteca.html.' });
  } else {
    avisar('Cópia baixada, sem a chave do Google.');
  }
}

function exportarExcel() {
  baixarConteudo(gerarPlanilhaExcel(dados), `Biblioteca ${hojeISO()}.xlsx`, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  avisar('Planilha baixada.');
}

function extrairDadosDeHTML(texto) {
  const achado = texto.match(/<script type="application\/json" id="dados">([\s\S]*?)<\/script>/);
  if (achado) return normalizarDados(JSON.parse(achado[1]));
  return normalizarDados(JSON.parse(texto));
}

async function importarArquivo(arquivo) {
  let novos;
  try {
    novos = extrairDadosDeHTML(await arquivo.text());
  } catch (e) {
    avisar('Esse arquivo não tem os dados de uma biblioteca.');
    return;
  }
  const ok = await confirmar({
    titulo: 'Trazer dados de um arquivo',
    texto: `${arquivo.name} tem ${plural(novos.livros.length, 'livro', 'livros')} e foi salvo em ${dataHoraBR(novos.salvoEm)}. Os dados deste aplicativo serão trocados por esses.`,
    ok: 'Trazer dados',
    perigo: true,
  });
  if (!ok) return;
  const chaveAtual = chaveGoogle();
  dados = novos;
  if (!dados.preferencias.chaveGoogle && chaveAtual) dados.preferencias.chaveGoogle = chaveAtual;
  estado.codigos = calcularCodigos(dados);
  estado.capasQuebradas = new Set();
  fecharModal();
  render();
  await gravarAgora();
  avisar(`Dados de ${arquivo.name} trazidos para o aplicativo.`);
}

function abrirModal({ titulo, subtitulo = '', corpo, rodape = '', classe = '', formulario = '' }) {
  const janela = $('#modal');
  janela.className = 'modal ' + classe;
  const cabecalho = `<div class="modal-cabecalho"><div><h2 class="modal-titulo">${titulo}</h2>${subtitulo ? `<p class="modal-sub">${subtitulo}</p>` : ''}</div><button type="button" class="botao-fechar" data-acao="fechar-modal" aria-label="Fechar">×</button></div>`;
  const miolo = `<div class="modal-corpo">${corpo}</div>${rodape ? `<div class="modal-rodape">${rodape}</div>` : ''}`;
  janela.innerHTML = cabecalho + (formulario ? `<form data-form="${formulario}" novalidate>${miolo}</form>` : miolo);
  if (!janela.open) janela.showModal();
  const corpoEl = janela.querySelector('.modal-corpo');
  if (corpoEl) corpoEl.scrollTop = 0;
}

function fecharModal() {
  const janela = $('#modal');
  if (janela.open) janela.close();
}

function confirmar({ titulo, texto, ok = 'Confirmar', cancelar = 'Cancelar', perigo = false }) {
  return new Promise(resolver => {
    const janela = $('#modal-confirmar');
    let respondido = false;
    const responder = valor => {
      if (respondido) return;
      respondido = true;
      if (janela.open) janela.close();
      resolver(valor);
    };
    janela.innerHTML = `<div class="modal-cabecalho"><h2 class="modal-titulo">${esc(titulo)}</h2></div>
      <div class="modal-corpo"><p>${esc(texto)}</p></div>
      <div class="modal-rodape"><button type="button" class="botao" data-resposta="nao">${esc(cancelar)}</button><button type="button" class="botao ${perigo ? 'perigo-cheio' : 'primario'}" data-resposta="sim">${esc(ok)}</button></div>`;
    janela.onclick = e => {
      const botao = e.target.closest('[data-resposta]');
      if (botao) responder(botao.dataset.resposta === 'sim');
    };
    janela.oncancel = () => responder(false);
    janela.onclose = () => responder(false);
    janela.showModal();
    janela.querySelector('[data-resposta="sim"]').focus();
  });
}

function avisar(texto, { acao, fn, tempo = 6000 } = {}) {
  const el = $('#aviso');
  el.innerHTML = `<span>${esc(texto)}</span>${acao ? `<button type="button" data-acao="aviso-acao">${esc(acao)}</button>` : ''}`;
  el.hidden = false;
  estado.avisoFn = fn || null;
  clearTimeout(estado.avisoTimer);
  estado.avisoTimer = setTimeout(() => { el.hidden = true; }, tempo);
}

function renderEstadoSalvo() {
  const el = $('#estado-salvo');
  const botao = $('#botao-salvar');
  if (!el) return;
  if (noApp()) {
    if (estado.erroOneDrive) { el.textContent = estado.erroOneDrive; el.className = 'estado-salvo pendente'; }
    else if (estado.sincronizando) { el.textContent = 'Sincronizando com o OneDrive…'; el.className = 'estado-salvo'; }
    else if (estado.erroGravacao) { el.textContent = estado.erroGravacao; el.className = 'estado-salvo pendente'; }
    else if (oneDriveLigado() && lerSessaoOneDrive().ultimoSync) { el.textContent = `Sincronizado às ${dataHoraBR(lerSessaoOneDrive().ultimoSync).split(' às ')[1]}`; el.className = 'estado-salvo'; }
    else if (estado.gravando || estado.pendentes) { el.textContent = 'Guardando…'; el.className = 'estado-salvo'; }
    else el.textContent = estado.ultimoSalvo ? `Guardado no aparelho às ${dataHoraBR(estado.ultimoSalvo).split(' às ')[1]}` : 'Guardado no aparelho';
    return;
  }
  if (naNuvem()) {
    if (estado.erroNuvem) { el.textContent = estado.erroNuvem; el.className = 'estado-salvo pendente'; }
    else if (estado.gravando || estado.pendentes) { el.textContent = 'Salvando na nuvem…'; el.className = 'estado-salvo'; }
    else el.textContent = estado.ultimoSalvo ? `Salvo na nuvem às ${dataHoraBR(estado.ultimoSalvo).split(' às ')[1]}` : 'Salvo na nuvem';
    return;
  }
  if (!botao) return;
  if (estado.salvando) {
    el.textContent = 'Salvando…';
    el.className = 'estado-salvo';
  } else if (estado.alterado) {
    el.textContent = 'Alterações não salvas';
    el.className = 'estado-salvo pendente';
  } else {
    el.textContent = `Salvo em ${dataHoraBR(dados.salvoEm)}`;
    el.className = 'estado-salvo';
  }
  botao.className = 'botao' + (estado.alterado ? ' primario' : '');
  botao.disabled = estado.salvando;
}

function render() {
  if (estado.destaqueAte && Date.now() > estado.destaqueAte) {
    estado.destaque = new Set();
    estado.destaqueAte = 0;
  }
  document.querySelectorAll('.aba').forEach(b => {
    if (b.dataset.aba === estado.aba) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  renderEstadoSalvo();
  const telas = { inicio: telaInicio, biblioteca: telaBiblioteca, todos: telaTodos, desejos: telaDesejos, emprestimos: telaEmprestimos, estatisticas: telaEstatisticas, config: telaConfig };
  $('#conteudo').innerHTML = (telas[estado.aba] || telaInicio)();
}

/* ===== Início ===== */

function telaInicio() {
  const hoje = hojeISO();
  const ano = hoje.slice(0, 4);
  const lendo = dados.livros.filter(l => l.status === 'lendo' && l.posse !== 'desejo')
    .sort((a, b) => String(b.inicio || '').localeCompare(String(a.inicio || '')));
  const pausados = dados.livros.filter(l => l.status === 'pausado' && l.posse !== 'desejo');
  const concluidas = leiturasConcluidas(dados);
  const lidosNoAno = concluidas.filter(r => r.fim.startsWith(ano)).length;
  const abertos = emprestimosDe(dados, { abertos: true });
  const semCapa = livrosSemCapa().length;
  const paraRevisar = revisarDados(dados, capasQuebradasConfirmadas()).importantes.length;

  const itemLendo = l => {
    const dias = dataValida(l.inicio) ? diasEntre(l.inicio, hoje) : null;
    const quando = dias === null ? 'Sem data de início.' : dias <= 0 ? `Começou hoje.` : `Começou em ${dataBR(l.inicio)}, há ${plural(dias, 'dia', 'dias')}.`;
    return `<article class="lendo-item">
      <button type="button" class="capa-botao" data-acao="abrir-livro" data-id="${esc(l.id)}" aria-label="Abrir ${esc(l.titulo)}">${capaHTML(l)}</button>
      <div>
        <h3 class="lendo-titulo"><button type="button" class="link-titulo" data-acao="abrir-livro" data-id="${esc(l.id)}">${esc(l.titulo)}</button></h3>
        <p class="autor">${esc(nomesAutores(l))}</p>
        <p class="detalhe">${quando}</p>
        <div class="acoes">
          <button type="button" class="botao primario pequeno" data-acao="terminar-leitura" data-id="${esc(l.id)}">Marcar como lido</button>
          <button type="button" class="botao pequeno" data-acao="pausar-leitura" data-id="${esc(l.id)}">Pausar</button>
        </div>
      </div>
    </article>`;
  };

  const itemUltima = r => `<div class="ultima">
      <button type="button" class="capa-botao" data-acao="abrir-livro" data-id="${esc(r.livro.id)}" aria-label="Abrir ${esc(r.livro.titulo)}">${capaHTML(r.livro, 'pequena')}</button>
      <p class="ultima-titulo">${esc(r.livro.titulo)}</p>
      ${estrelasHTML(r.nota, 12)}
      <p class="detalhe">Lido em ${dataBR(r.fim)}</p>
    </div>`;

  const itemEmprestimo = ({ livro, emp }) => {
    const atraso = dataValida(emp.devolverAte) ? diasEntre(emp.devolverAte, hoje) : null;
    const prazo = atraso === null ? '' : atraso > 0 ? `<span class="atrasado">Atrasado há ${plural(atraso, 'dia', 'dias')}</span>` : `Devolver até ${dataBR(emp.devolverAte)}`;
    const quem = emp.tipo === 'peguei' ? `De ${esc(emp.pessoa || 'pessoa não informada')}` : `Com ${esc(emp.pessoa || 'pessoa não informada')}`;
    return `<li><button type="button" class="link-titulo emprestimo-livro" data-acao="abrir-livro" data-id="${esc(livro.id)}">${esc(livro.titulo)}</button>
      <p class="detalhe">${quem}${prazo ? '. ' + prazo : ''}</p></li>`;
  };

  const vazio = noApp() && !dados.livros.length;
  if (vazio) return `<div class="cabecalho-pagina"><div>
      <h1 class="titulo-pagina">Traga a sua biblioteca</h1>
      <p class="subtitulo">Este aplicativo começa vazio. Baixe o arquivo Biblioteca.html do OneDrive para o celular e escolha-o aqui: os livros, as capas e as leituras vêm junto.</p>
    </div></div>
    <div class="acoes"><button type="button" class="botao primario" data-acao="importar-arquivo">Escolher o arquivo da biblioteca</button><button type="button" class="botao" data-acao="novo-livro">Começar do zero</button></div>`;
  return `<div class="inicio">
    <div>
      <section>
        <h2 class="titulo-secao">Lendo agora</h2>
        ${lendo.length ? lendo.map(itemLendo).join('') : '<p class="vazio">Nenhum livro em leitura. Abra um livro e escolha Começar leitura.</p>'}
        ${pausados.length ? `<p class="linha-pausados">Pausados: ${pausados.map(l => `<button type="button" class="link" data-acao="abrir-livro" data-id="${esc(l.id)}">${esc(l.titulo)}</button>`).join(', ')}</p>` : ''}
      </section>
      <section class="secao">
        <h2 class="titulo-secao">Últimas leituras</h2>

    <aside>
      <section>${blocoMeta(ano, lidosNoAno)}</section>

        <h2 class="titulo-secao">Empréstimos em aberto</h2>
        ${abertos.length ? `<ul class="lista-emprestimos">${abertos.map(itemEmprestimo).join('')}</ul>` : '<p class="vazio">Nenhum livro emprestado agora.</p>'}
      </section>
      ${paraRevisar ? `<section class="secao">
        <h2 class="titulo-secao">Revisão</h2>
        <p class="detalhe">${paraRevisar === 1 ? '1 livro tem' : `${numero(paraRevisar)} livros têm`} informação faltando que afeta a estante ou as estatísticas.</p>
        <div class="acoes"><button type="button" class="botao pequeno" data-acao="revisar-dados">Revisar dados</button></div>
      </section>` : ''}
      ${semCapa ? `<section class="secao">
        <h2 class="titulo-secao">Capas</h2>
        <p class="detalhe">${semCapa === 1 ? '1 livro está sem capa.' : `${numero(semCapa)} livros estão sem capa.`} A busca pelo ISBN também completa editora, ano e páginas em branco.</p>
        <div class="acoes">
          <button type="button" class="botao pequeno" data-acao="completar-dados">Completar capas e dados</button>
          <button type="button" class="botao discreto pequeno" data-acao="ver-sem-capa">Ver livros sem capa</button>
        </div>
      </section>` : ''}
    </aside>
  </div>`;
}

function blocoMeta(ano, lidos) {
  const meta = Number(dados.metas[ano]) || 0;
  if (!meta) {
    return `<h2 class="titulo-secao">Meta de ${ano}</h2>
      <p class="meta-numeros"><strong>${numero(lidos)}</strong> ${lidos === 1 ? 'livro lido' : 'livros lidos'} até agora</p>
      <div class="acoes"><button type="button" class="botao pequeno" data-acao="definir-meta" data-ano="${ano}">Definir meta de ${ano}</button></div>`;
  }
  const inicioAno = new Date(Number(ano), 0, 1);
  const fimAno = new Date(Number(ano) + 1, 0, 1);
  const fracao = Math.min(1, Math.max(0, (Date.now() - inicioAno) / (fimAno - inicioAno)));
  const esperado = Math.floor(meta * fracao);
  const projecao = fracao > 0.08 ? Math.round(lidos / fracao) : null;
  let situacao;
  if (lidos >= meta) situacao = 'Meta cumprida.';
  else if (lidos >= esperado) situacao = `Você está no ritmo: o esperado até hoje era ${plural(esperado, 'livro', 'livros')}.`;
  else situacao = `O esperado até hoje era ${plural(esperado, 'livro', 'livros')}.`;
  if (projecao !== null && lidos < meta) situacao += ` No ritmo atual, você fecha o ano com ${plural(projecao, 'livro', 'livros')}.`;
  return `<h2 class="titulo-secao">Meta de ${ano}</h2>
    <p class="meta-numeros"><strong>${numero(lidos)}</strong> de ${plural(meta, 'livro', 'livros')}</p>
    <div class="progresso" role="progressbar" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${lidos}">
      <span style="width:${Math.min(100, lidos / meta * 100)}%"></span>
      <i style="left:${Math.min(100, fracao * 100)}%" title="Esperado até hoje"></i>
    </div>
    <p class="detalhe">${situacao}</p>
    <div class="acoes"><button type="button" class="botao discreto pequeno" data-acao="definir-meta" data-ano="${ano}">Alterar meta</button></div>`;
}

function blocoForaDaEstante(fora, busca) {
  if (!fora.length) return '';
  return `<section class="fora-bloco">
      <h2 class="titulo-secao">Fora da estante</h2>
      <p class="detalhe">Enquanto estão fora, estes livros ficam com um código temporário e a numeração da estante conta só os que estão lá.</p>
      <ul class="lista-fora">${fora.map(l => `<li class="item-fora${busca && !bateBusca(l, busca) ? ' apagada' : ''}">
        <button type="button" class="capa-botao" data-acao="abrir-livro" data-id="${esc(l.id)}" aria-label="Abrir ${esc(l.titulo)}">${capaHTML(l, 'pequena mini')}</button>
        <div>
          <p class="item-fora-titulo"><span class="etiqueta">${esc(codigoDe(l))}</span>${esc(l.titulo)}</p>
          <p class="detalhe">${esc(motivoDeSaida(l))}. Ao voltar, entra como nº ${numeroDeVolta(dados, l)}.</p>
        </div>
      </li>`).join('')}</ul>
    </section>`;
}

function conteudoBiblioteca() {
  const todos = livrosOrdenadosPorCodigo('fisico');
  const separar = numerarPresentes(dados);
  const fora = separar ? todos.filter(estaForaDaEstante) : [];
  const fisicos = separar ? todos.filter(l => !estaForaDaEstante(l)) : todos;
  const busca = estado.biblioteca.busca.trim();
  if (!todos.length) return '<p class="vazio">Nenhum livro físico cadastrado. Use Adicionar livro para começar.</p>';
  const blocos = dados.categorias.map(cat => ({ cat, livros: fisicos.filter(l => l.categoria === cat.id) })).filter(b => b.livros.length);
  const semCategoria = fisicos.filter(l => !categoriaPorId(l.categoria));
  if (semCategoria.length) blocos.push({ cat: { id: '', nome: 'Sem categoria', cor: '#5B626D' }, livros: semCategoria });

  if (estado.biblioteca.visao === 'lista') {
    const linhas = blocos.map(({ cat, livros }) => {
      const visiveis = livros.filter(l => bateBusca(l, busca));
      if (!visiveis.length) return '';
      return `<tr class="linha-categoria"><td colspan="5">${esc(cat.nome)}</td></tr>`
        + visiveis.map(l => `<tr class="clicavel" data-acao="abrir-livro" data-id="${esc(l.id)}">
            <td><span class="etiqueta">${esc(codigoDe(l))}</span></td>
            <td class="col-titulo">${esc(l.titulo)}${emprestadoPorMim(l) ? `<span class="marca-emprestado-lista" title="${esc(`Emprestado para ${emprestadoPorMim(l).pessoa || 'pessoa não informada'}`)}">*</span><span class="sr-only">, emprestado</span>` : ''}</td>
            <td>${esc(nomesAutores(l, { papeis: true }))}</td>
            <td>${statusHTML(l.status)}</td>
            <td>${estrelasHTML(l.nota)}</td>
          </tr>`).join('');
    }).join('');
    const linhasFora = fora.filter(l => bateBusca(l, busca)).map(l => `<tr class="clicavel" data-acao="abrir-livro" data-id="${esc(l.id)}">
        <td><span class="etiqueta">${esc(codigoDe(l))}</span></td>
        <td class="col-titulo">${esc(l.titulo)}</td>
        <td>${esc(nomesAutores(l, { papeis: true }))}</td>
        <td>${statusHTML(l.status)}</td>
        <td>${esc(motivoDeSaida(l))}</td>
      </tr>`).join('');
    const corpo = linhas + (linhasFora ? `<tr class="linha-categoria"><td colspan="5">Fora da estante</td></tr>${linhasFora}` : '');
    if (!corpo) return '<p class="vazio">Nenhum livro físico corresponde à busca.</p>';
    return `<div class="rolagem"><table class="tabela"><thead><tr><th>Nº</th><th>Título</th><th>Autor</th><th>Status</th><th>Nota</th></tr></thead><tbody>${corpo}</tbody></table></div>`;
  }

  const algum = !busca || todos.some(l => bateBusca(l, busca));
  const prateleira = blocos.map(({ cat, livros }) => {
    const [primeiro, ...resto] = livros;
    const divisoria = `<div class="lombada-slot"><div class="divisoria" style="--cor:${corSegura(cat.cor)}" role="img" aria-label="${esc(cat.nome)}, ${esc(faixaNumeros(livros.map(codigoDe)))}"><span class="divisoria-texto"><span class="divisoria-nome">${esc(cat.nome)}</span><span class="divisoria-faixa">${esc(faixaNumeros(livros.map(codigoDe)))}</span></span></div></div>`;
    return `<div class="inicio-secao">${divisoria}${lombadaHTML(primeiro, cat, busca)}</div>` + resto.map(l => lombadaHTML(l, cat, busca)).join('');
  }).join('');
  return `<p class="legenda">As divisórias marcam o começo de cada categoria. A etiqueta mostra o número do livro. Livros em leitura ou emprestados saem da estante e ficam listados embaixo, com código temporário.${algum ? '' : ' Nenhum livro corresponde à busca.'}</p>`
    + `<div class="prateleira">${prateleira}</div>`
    + blocoForaDaEstante(fora, busca);
}

function lombadaHTML(livro, cat, busca) {
  const h = hashTexto(livro.id + livro.titulo);
  const paginas = livro.paginas || 220;
  const largura = Math.round(Math.min(64, Math.max(20, 14 + paginas * 0.045)));
  const altura = 164 + (h % 5) * 8 + (livro.formato === 'capa-dura' ? 8 : 0);
  const tom = [0, 7, 13][(h >>> 4) % 3];
  const mistura = (h >>> 7) % 2 ? 'black' : 'white';
  const codigo = codigoDe(livro);
  const classes = ['lombada'];
  if (livro.status === 'lendo') classes.push('lendo');
  if (busca && !bateBusca(livro, busca)) classes.push('apagada');
  if (estado.destaque.has(livro.id)) classes.push('destacada');
  const emprestimo = emprestadoPorMim(livro);
  if (emprestimo) classes.push('emprestado');
  const rotulo = `${codigo}. ${livro.titulo}, ${nomesAutores(livro)}${emprestimo ? `. Emprestado para ${emprestimo.pessoa || 'pessoa não informada'}` : ''}`;
  return `<div class="lombada-slot"><button type="button" class="${classes.join(' ')}" style="--cor:${corSegura(cat.cor)};--larg:${largura}px;--alt:${altura}px;--tom:${tom}%;--mistura:${mistura}" data-acao="abrir-livro" data-id="${esc(livro.id)}" title="${esc(rotulo)}" aria-label="${esc(rotulo)}">${emprestimo ? '<span class="marca-emprestado" aria-hidden="true">*</span>' : ''}<span class="lombada-titulo">${esc(livro.titulo)}</span><span class="etiqueta">${esc(codigo)}</span></button></div>`;
}

function filtrarTodos() {
  const f = estado.todos;
  const lista = dados.livros.filter(l => l.posse !== 'desejo'
    && (!f.tipo || grupoDe(l) === f.tipo)
    && (!f.status || l.status === f.status)
    && (!f.categoria || l.categoria === f.categoria)
    && (!f.semPaginas || (!l.paginas && (l.status === 'lido' || l.releituras.length)))
    && bateBusca(l, f.busca.trim()));
  const nomeCat = l => (categoriaPorId(l.categoria) || {}).nome || '';
  const dias = l => (dataValida(l.inicio) && dataValida(l.fim) ? diasEntre(l.inicio, l.fim) : -1);
  const comparadores = {
    codigo: (a, b) => compararCodigos(codigoDe(a), codigoDe(b)),
    titulo: (a, b) => colador.compare(semArtigo(a.titulo), semArtigo(b.titulo)),
    autor: (a, b) => colador.compare(chaveSobrenome(a), chaveSobrenome(b)) || colador.compare(semArtigo(a.titulo), semArtigo(b.titulo)),
    categoria: (a, b) => colador.compare(nomeCat(a), nomeCat(b)),
    status: (a, b) => colador.compare(STATUS_ROTULO[a.status], STATUS_ROTULO[b.status]),
    inicio: (a, b) => String(b.inicio || '').localeCompare(String(a.inicio || '')),
    fim: (a, b) => String(b.fim || '').localeCompare(String(a.fim || '')),
    dias: (a, b) => dias(b) - dias(a),
    nota: (a, b) => (b.nota || 0) - (a.nota || 0),
  };
  const comparar = comparadores[f.ordem] || comparadores.codigo;
  return lista.sort((a, b) => (comparar(a, b) * f.dir) || compararCodigos(codigoDe(a), codigoDe(b)));
}

function conteudoTodos() {
  const f = estado.todos;
  const lista = filtrarTodos();
  const total = dados.livros.filter(l => l.posse !== 'desejo').length;
  const filtroExtra = f.semPaginas ? ` <span class="filtro-ativo">Leituras sem número de páginas <button type="button" data-acao="limpar-sem-paginas" aria-label="Remover filtro">×</button></span>` : '';
  const contagem = `<p class="contagem">${lista.length === total ? plural(total, 'livro', 'livros') : `${numero(lista.length)} de ${plural(total, 'livro', 'livros')}`}${filtroExtra}</p>`;
  if (!lista.length) return contagem + '<p class="vazio">Nenhum livro corresponde aos filtros. Ajuste a busca ou os filtros acima.</p>';

  if (f.visao === 'lista') {
    const coluna = (id, rotulo, classe = '') => {
      const ativa = f.ordem === id;
      return `<th class="${classe}"><button type="button" data-acao="ordenar-todos" data-ordem="${id}"${ativa ? ` aria-sort="${f.dir === 1 ? 'ascending' : 'descending'}"` : ''}>${rotulo}${ativa ? (f.dir === 1 ? ' ▲' : ' ▼') : ''}</button></th>`;
    };
    const linhas = lista.map(l => {
      const dias = dataValida(l.inicio) && dataValida(l.fim) ? diasEntre(l.inicio, l.fim) : '';
      return `<tr class="clicavel" data-acao="abrir-livro" data-id="${esc(l.id)}">
        <td><span class="etiqueta">${esc(codigoDe(l))}</span></td>
        <td class="col-titulo">${esc(l.titulo)}</td>
        <td>${esc(nomesAutores(l, { papeis: true }))}</td>
        <td>${esc((categoriaPorId(l.categoria) || {}).nome || '')}</td>
        <td>${statusHTML(l.status)}</td>
        <td class="nowrap">${dataBR(l.inicio)}</td>
        <td class="nowrap">${dataBR(l.fim)}</td>
        <td class="col-num">${dias}</td>
        <td class="nowrap">${estrelasHTML(l.nota)}</td>
      </tr>`;
    }).join('');
    return contagem + `<div class="rolagem"><table class="tabela"><thead><tr>
      ${coluna('codigo', 'Nº')}${coluna('titulo', 'Título')}${coluna('autor', 'Autor')}${coluna('categoria', 'Categoria')}${coluna('status', 'Status')}${coluna('inicio', 'Início')}${coluna('fim', 'Término')}${coluna('dias', 'Dias', 'col-num')}${coluna('nota', 'Nota')}
    </tr></thead><tbody>${linhas}</tbody></table></div>`;
  }

  return contagem + `<div class="grade-capas">${lista.map(l => `<div class="item-capa">
      <button type="button" class="capa-botao" data-acao="abrir-livro" data-id="${esc(l.id)}" aria-label="Abrir ${esc(l.titulo)}">${capaHTML(l)}</button>
      <p class="item-capa-titulo">${esc(l.titulo)}</p>
      <p class="detalhe">${esc(nomesAutores(l))}</p>
      ${l.status === 'lido' ? estrelasHTML(l.nota, 12) : `<p class="detalhe">${esc(STATUS_ROTULO[l.status])}</p>`}
    </div>`).join('')}</div>`;
}

/* ===== Estatísticas ===== */

function graficoColunas(rotulos, valores, formatar = v => numero(v)) {
  const poucos = rotulos.length <= 4;
  const largura = poucos ? 46 : 19, espaco = poucos ? 26 : 9, topo = 22, base = 24, altura = 190;
  const total = rotulos.length * (largura + espaco) + espaco;
  const maximo = Math.max(1, ...valores);
  const colunas = valores.map((v, i) => {
    const x = espaco + i * (largura + espaco);
    const alt = Math.round((altura - topo - base) * v / maximo);
    const y = altura - base - alt;
    return `<rect class="barra" x="${x}" y="${y}" width="${largura}" height="${alt}" rx="2"></rect>`
      + (v ? `<text class="valor" x="${x + largura / 2}" y="${y - 7}" text-anchor="middle">${formatar(v)}</text>` : '')
      + `<text x="${x + largura / 2}" y="${altura - 8}" text-anchor="middle">${esc(rotulos[i])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${total} ${altura}" style="max-width:${Math.round(total * 1.15)}px" role="img"><line class="eixo" x1="0" x2="${total}" y1="${altura - base + 0.5}" y2="${altura - base + 0.5}"></line>${colunas}</svg>`;
}

function rankingHTML(itens) {
  const maximo = Math.max(1, ...itens.map(i => i.valor));
  return `<ol class="ranking">${itens.map(i => `<li><span class="nome" title="${esc(i.rotulo)}">${esc(i.rotulo)}</span><span class="trilho"><span style="width:${i.valor / maximo * 100}%${i.cor ? `;background:${corSegura(i.cor)}` : ''}"></span></span><span class="qtd">${numero(i.valor)}</span></li>`).join('')}</ol>`;
}

function telaEstatisticas() {
  const todas = leiturasConcluidas(dados);
  const anoAtual = hojeISO().slice(0, 4);
  const anos = [...new Set([...todas.map(r => r.fim.slice(0, 4)), anoAtual])].sort();
  if (estado.estatisticas.ano !== 'todos' && !anos.includes(estado.estatisticas.ano)) estado.estatisticas.ano = anoAtual;
  const sel = estado.estatisticas.ano;
  const leituras = sel === 'todos' ? todas : todas.filter(r => r.fim.startsWith(sel));

  const seletor = `<div class="segmentado" role="group" aria-label="Período">
    <button type="button" data-acao="ano-estatisticas" data-ano="todos" aria-pressed="${sel === 'todos'}">Todos os anos</button>
    ${anos.map(a => `<button type="button" data-acao="ano-estatisticas" data-ano="${a}" aria-pressed="${sel === a}">${a}</button>`).join('')}
  </div>`;
  const cabecalho = `<div class="cabecalho-pagina"><div><h1 class="titulo-pagina">Estatísticas</h1></div>${seletor}</div>`;

  const paginas = leituras.reduce((s, r) => s + (r.livro.paginas || 0), 0);
  const semPaginas = leituras.filter(r => !r.livro.paginas).length;
  const comNota = leituras.filter(r => r.nota);
  const notaMedia = comNota.length ? comNota.reduce((s, r) => s + Number(r.nota), 0) / comNota.length : null;
  const comDatas = leituras.filter(r => dataValida(r.inicio) && dataValida(r.fim) && diasEntre(r.inicio, r.fim) >= 0);
  const mediaDias = comDatas.length ? comDatas.reduce((s, r) => s + diasEntre(r.inicio, r.fim), 0) / comDatas.length : null;

  let resumo;
  if (!leituras.length) {
    resumo = sel === 'todos' ? 'Nenhuma leitura concluída ainda.' : `Nenhuma leitura concluída em ${sel} até agora.`;
  } else {
    const periodo = sel === 'todos' ? 'No total' : sel === anoAtual ? `Em ${sel}, até agora` : `Em ${sel}`;
    resumo = `${periodo}, você terminou ${plural(leituras.length, 'livro', 'livros')}, somando ${plural(paginas, 'página', 'páginas')}.`;
    if (notaMedia !== null) resumo += ` A nota média foi ${numero(notaMedia, 1)}`;
    if (mediaDias !== null) resumo += `${notaMedia !== null ? ', e cada' : ' Cada'} livro levou em média ${plural(Math.round(mediaDias), 'dia', 'dias')}.`;
    else if (notaMedia !== null) resumo += '.';
  }
  const aviso = semPaginas ? `<p class="nota-rodape">${semPaginas === 1 ? '1 leitura está' : `${numero(semPaginas)} leituras estão`} sem número de páginas, então o total de páginas está incompleto. <button type="button" class="link" data-acao="ver-sem-paginas">Ver quais</button></p>` : '';

  let graficosTempo = '';
  if (leituras.length) {
    if (sel === 'todos') {
      const livrosAno = anos.map(a => todas.filter(r => r.fim.startsWith(a)).length);
      const paginasAno = anos.map(a => todas.filter(r => r.fim.startsWith(a)).reduce((s, r) => s + (r.livro.paginas || 0), 0));
      graficosTempo = `<figure class="grafico"><h3>Livros por ano</h3>${graficoColunas(anos, livrosAno)}</figure>
        <figure class="grafico"><h3>Páginas por ano</h3>${graficoColunas(anos, paginasAno)}</figure>`;
    } else {
      const porMes = MESES.map((_, i) => leituras.filter(r => Number(r.fim.slice(5, 7)) === i + 1));
      graficosTempo = `<figure class="grafico"><h3>Livros por mês</h3>${graficoColunas(MESES, porMes.map(m => m.length))}</figure>
        <figure class="grafico"><h3>Páginas por mês</h3>${graficoColunas(MESES, porMes.map(m => m.reduce((s, r) => s + (r.livro.paginas || 0), 0)), v => (v >= 1000 ? numero(v / 1000, 1) + ' mil' : numero(v)))}</figure>`;
    }
  }

  const porCategoria = dados.categorias.map(c => ({ rotulo: c.nome, cor: c.cor, valor: leituras.filter(r => r.livro.categoria === c.id).length }))
    .filter(i => i.valor).sort((a, b) => b.valor - a.valor);
  const contagemAutores = new Map();
  leituras.forEach(r => {
    const nome = nomesAutores(r.livro) || 'Sem autor';
    const chave = normalizar(nome).replace(/[^a-z]/g, '');
    const atual = contagemAutores.get(chave) || { rotulo: nome, valor: 0 };
    atual.valor++;
    contagemAutores.set(chave, atual);
  });
  const porAutor = [...contagemAutores.values()]
    .sort((a, b) => b.valor - a.valor || colador.compare(a.rotulo, b.rotulo)).slice(0, 6);

  const lidosPorAno = {};
  todas.forEach(r => { const a = r.fim.slice(0, 4); lidosPorAno[a] = (lidosPorAno[a] || 0) + 1; });
  const anosMetas = [...new Set([...anos, ...Object.keys(dados.metas).filter(a => dados.metas[a])])].sort().reverse();
  const linhasMetas = anosMetas.map(a => {
    const meta = Number(dados.metas[a]) || 0;
    const lidos = lidosPorAno[a] || 0;
    let resultado;
    if (!meta) resultado = `<button type="button" class="link" data-acao="definir-meta" data-ano="${a}">Definir meta</button>`;
    else if (lidos >= meta) resultado = 'Cumprida';
    else if (a < anoAtual) resultado = `Faltaram ${numero(meta - lidos)}`;
    else resultado = `Faltam ${numero(meta - lidos)}`;
    return `<tr><td>${a}</td><td class="col-num">${meta ? numero(meta) : 'Sem meta'}</td><td class="col-num">${numero(lidos)}</td><td>${resultado}</td></tr>`;
  }).join('');

  return cabecalho
    + `<p class="resumo-ano">${resumo}</p>${aviso}`
    + (leituras.length ? `<div class="graficos">
        ${graficosTempo}
        <figure class="grafico"><h3>Categorias</h3>${rankingHTML(porCategoria)}</figure>
        <figure class="grafico"><h3>Autores mais lidos</h3>${rankingHTML(porAutor)}</figure>
      </div>` : '')
    + `<section class="secao"><h2 class="titulo-secao">Metas por ano</h2>
        <div class="rolagem"><table class="tabela tabela-metas"><thead><tr><th>Ano</th><th class="col-num">Meta</th><th class="col-num">Lidos</th><th>Resultado</th></tr></thead><tbody>${linhasMetas}</tbody></table></div>
      </section>`;
}

/* ===== Ficha do livro ===== */

function abrirLivro(id) {
  const l = livroPorId(id);
  if (!l) return;
  const grupo = grupoDe(l);
  const cat = categoriaPorId(l.categoria);
  const codigo = codigoDe(l);
  const hoje = hojeISO();
  const origem = {
    fisico: `Biblioteca pessoal${cat ? `, prateleira de ${cat.nome}` : ''}`,
    digital: `${FORMATO_ROTULO[l.formato]}${cat ? `, ${cat.nome}` : ''}`,
    emprestado: `Emprestado${cat ? `, ${cat.nome}` : ''}`,
    desejo: `Desejo${l.prioridade ? `, prioridade ${PRIORIDADE_ROTULO[l.prioridade].toLowerCase()}` : ''}`,
  }[grupo];

  const fatos = [];
  const foraDaEstante = numerarPresentes(dados) && estaForaDaEstante(l);
  if (codigo) fatos.push([foraDaEstante ? 'Código temporário' : 'Número', `<span class="etiqueta grande">${esc(codigo)}</span>`]);
  if (foraDaEstante) fatos.push(['Fora da estante', `${esc(motivoDeSaida(l))}. Ao voltar, entra como nº ${numeroDeVolta(dados, l)}.`]);
  if (cat) fatos.push(['Categoria', esc(cat.nome)]);
  if (l.serie) fatos.push(['Série', `${esc(l.serie)}${l.volume ? `, volume ${esc(l.volume)}` : ''}`]);
  if (grupo !== 'digital' && l.formato) fatos.push(['Formato', esc(FORMATO_ROTULO[l.formato])]);
  if (l.editora) fatos.push(['Editora', esc(l.editora)]);
  if (l.ano) fatos.push(['Ano', esc(l.ano)]);
  if (l.isbn) fatos.push(['ISBN', esc(formatarISBN(l.isbn))]);
  else if (l.semIsbn) fatos.push(['ISBN', 'Não possui']);
  if (l.paginas) fatos.push(['Páginas', numero(l.paginas)]);
  if (grupo !== 'desejo') {
    if (dataValida(l.inicio)) fatos.push(['Início', dataBR(l.inicio)]);
    if (dataValida(l.fim)) fatos.push(['Término', dataBR(l.fim)]);
    if (dataValida(l.inicio) && dataValida(l.fim)) fatos.push(['Duração', plural(diasEntre(l.inicio, l.fim), 'dia', 'dias')]);
    else if (l.status === 'lendo' && dataValida(l.inicio)) fatos.push(['Duração', `em leitura há ${plural(Math.max(0, diasEntre(l.inicio, hoje)), 'dia', 'dias')}`]);
  }

  const releituras = l.releituras.length ? `<div class="ficha-bloco"><h3>Leituras anteriores</h3><ul>${l.releituras.map(r => `<li>${dataBR(r.inicio) || 'Sem início'} a ${dataBR(r.fim) || 'sem término'}${r.nota ? `, nota ${numero(r.nota, r.nota % 1 ? 1 : 0)}` : ''}</li>`).join('')}</ul></div>` : '';
  const emprestimos = l.emprestimos.length ? `<div class="ficha-bloco"><h3>Empréstimos</h3><ul class="lista-emp-ficha">${l.emprestimos.map(e => `<li>${esc(descricaoEmprestimo(e))}
      <span class="acoes-inline"><button type="button" class="link" data-acao="editar-emprestimo" data-id="${esc(l.id)}" data-emp="${esc(e.id)}">Editar</button><button type="button" class="link perigo-link" data-acao="excluir-emprestimo" data-id="${esc(l.id)}" data-emp="${esc(e.id)}">Excluir</button></span></li>`).join('')}</ul></div>` : '';

  const abertoPeguei = l.emprestimos.find(e => !e.devolvido && e.tipo === 'peguei');
  const abertoEmprestei = l.emprestimos.find(e => !e.devolvido && e.tipo === 'emprestei');
  const botoes = [];
  if (grupo === 'desejo') {
    botoes.push(`<button type="button" class="botao primario" data-acao="chegou" data-id="${esc(l.id)}">Chegou</button>`);
  } else {
    if (l.status === 'nao-lido' || l.status === 'abandonado') botoes.push(`<button type="button" class="botao" data-acao="comecar-leitura" data-id="${esc(l.id)}">Começar leitura</button>`);
    if (l.status === 'pausado') botoes.push(`<button type="button" class="botao" data-acao="retomar-leitura" data-id="${esc(l.id)}">Retomar leitura</button>`);
    if (l.status === 'lendo') botoes.push(`<button type="button" class="botao" data-acao="pausar-leitura" data-id="${esc(l.id)}">Pausar</button><button type="button" class="botao" data-acao="terminar-leitura" data-id="${esc(l.id)}">Marcar como lido</button>`);
    if (l.status === 'lido') botoes.push(`<button type="button" class="botao" data-acao="reler" data-id="${esc(l.id)}">Registrar releitura</button>`);
    if (abertoPeguei || abertoEmprestei) {
      const e = abertoPeguei || abertoEmprestei;
      botoes.push(`<button type="button" class="botao" data-acao="registrar-devolucao" data-id="${esc(l.id)}" data-emp="${esc(e.id)}">Registrar devolução</button>`);
    } else if (grupo === 'fisico') {
      botoes.push(`<button type="button" class="botao" data-acao="emprestar" data-id="${esc(l.id)}">Emprestar</button>`);
    }
  }
  botoes.push(`<button type="button" class="botao primario" data-acao="editar-livro" data-id="${esc(l.id)}">Editar</button>`);

  abrirModal({
    titulo: '<span class="sr-only">Ficha do livro</span>',
    corpo: `<div class="ficha">
        <div class="ficha-capa">${capaHTML(l, 'grande')}</div>
        <div>
          <p class="ficha-grupo">${esc(origem)}</p>
          <h2 class="ficha-titulo">${esc(l.titulo)}</h2>
          <p class="ficha-autores">${esc(nomesAutores(l, { papeis: true })) || 'Autor não informado'}</p>
          ${grupo !== 'desejo' ? `<div class="ficha-leitura">${statusHTML(l.status)}${estrelasHTML(l.nota, 18)}</div>` : ''}
          <dl class="fatos">${fatos.map(([t, v]) => `<dt>${t}</dt><dd>${v}</dd>`).join('')}</dl>
          ${releituras}${emprestimos}
          ${l.obs ? `<div class="ficha-bloco"><h3>Observações</h3><p class="ficha-obs">${esc(l.obs)}</p></div>` : ''}
        </div>
      </div>`,
    rodape: `<button type="button" class="botao discreto perigo esquerda" data-acao="excluir-livro" data-id="${esc(l.id)}">Excluir</button>${botoes.join('')}`,
  });
}

    editora: '', ano: null, isbn: '', paginas: null,
    categoria: '', formato: posse === 'desejo' ? '' : 'brochura', posse,
    status: 'nao-lido', inicio: null, fim: null, nota: null,
    releituras: [], obs: '', capa: '',
    emprestimos: posse === 'emprestada' ? [{ id: novoId('e'), tipo: 'peguei', pessoa: '', data: hojeISO(), devolverAte: null, devolvido: false, devolvidoEm: null }] : [],
