function enviarFormularioLivro(form) {
  const f = estado.formulario;
  const erro = form.querySelector('[data-erro-form]');
  const valor = nome => (form.querySelector(`[name="${nome}"]`) || {}).value?.trim() ?? '';
  const inteiro = nome => { const n = parseInt(valor(nome), 10); return Number.isFinite(n) && n > 0 ? n : null; };
  erro.textContent = '';
  form.querySelectorAll('.campo.erro').forEach(c => c.classList.remove('erro'));
  const falhar = (mensagem, campo) => {
    erro.textContent = mensagem;
    const alvo = campo && form.querySelector(`[name="${campo}"]`);
    if (alvo) { alvo.closest('.campo')?.classList.add('erro'); alvo.focus(); }
  };

  const titulo = valor('titulo');
  if (!titulo) return falhar('Informe o título do livro.', 'titulo');
  let isbn = '';
  if (valor('isbn')) {
    isbn = normalizarISBN(valor('isbn'));
    if (!isbn) return falhar('O ISBN precisa ter 10 ou 13 dígitos.', 'isbn');
  }
  if (!valor('categoria')) return falhar('Escolha a categoria do livro: ela define a posição na estante.', 'categoria');
  const semIsbn = !!(form.querySelector('[name="sem-isbn"]') || {}).checked && !isbn;
  const posse = (form.querySelector('[name="posse"]:checked') || {}).value || 'propria';
  const inicio = valor('inicio') || null;
  const fim = valor('fim') || null;
  if (posse !== 'desejo' && inicio && fim && fim < inicio) return falhar('O término não pode ser antes do início.', 'fim');

  const original = f.novo ? null : livroPorId(f.id);
  if (isbn && (!original || original.isbn !== isbn)) {
    const repetido = dados.livros.find(l => l.isbn === isbn && l.id !== f.id);
    if (repetido && !f.confirmouRepetido) {
      f.confirmouRepetido = true;
      return falhar(`Já existe um livro com esse ISBN: ${repetido.titulo}. Para cadastrar mesmo assim, clique de novo no botão.`, 'isbn');
    }
  }

  const l = original ? JSON.parse(JSON.stringify(original)) : f.livro;
  const grupoAntes = original ? grupoDe(original) : null;
  Object.assign(l, {
    titulo, isbn, semIsbn,
    serie: valor('serie'), volume: inteiro('volume'),
    autores: lerAutores(form),
    categoria: valor('categoria'), formato: valor('formato'), posse,
    editora: valor('editora'), ano: inteiro('ano'), paginas: inteiro('paginas'),
    obs: (form.querySelector('[name="obs"]').value || '').trim(),
    capa: f.capa || '',
  });
  if (posse === 'desejo') {
    l.prioridade = valor('prioridade');
  } else {
    l.prioridade = '';
    l.status = valor('status') || 'nao-lido';
    l.inicio = inicio;
    l.fim = fim;
    l.nota = Number(valor('nota')) || null;
  }
  const peguei = l.emprestimos.find(e => e.tipo === 'peguei');
  if (posse === 'emprestada') {
    const registro = peguei || { id: novoId('e'), tipo: 'peguei' };
    const novosValores = {
      pessoa: valor('emp-pessoa'), data: valor('emp-data') || null, devolverAte: valor('emp-devolver') || null,
      devolvido: form.querySelector('[name="emp-devolvido"]').checked, devolvidoEm: valor('emp-devolvido-em') || null,
    };
    if (novosValores.devolvidoEm) novosValores.devolvido = true;
    const mudouDatas = !!original && !!peguei && (['data', 'devolverAte', 'devolvidoEm'].some(k => (registro[k] || '') !== (novosValores[k] || '')) || !!registro.devolvido !== novosValores.devolvido);
    if (mudouDatas) {
      novosValores.manual = true;
      novosValores.pelaLeitura = false;
    }
    Object.assign(registro, novosValores);
    if (!peguei) l.emprestimos.push(registro);
  } else if (peguei && !peguei.devolvido) {
    peguei.devolvido = true;
  }

  const grupoDepois = grupoDe(l);
  const mudouGrupo = grupoAntes !== grupoDepois;
  alterar(() => {
    if (!original || (mudouGrupo && (grupoDepois === 'digital' || grupoDepois === 'emprestado'))) l.chegada = dados.proximaChegada++;
    if (original) dados.livros[dados.livros.findIndex(x => x.id === l.id)] = l;
    else dados.livros.push(l);
  }, { mensagem: mensagemDeEntrada(l, !original) });
  fecharModal();
  if (estado.voltarPara === 'revisao') {
    estado.voltarPara = null;
    abrirRevisao();
  }
}

function mensagemDeEntrada(livro, novo) {
  if (!novo) return 'Alterações aplicadas';
  return () => {
    const codigo = estado.codigos.get(livro.id);
    return codigo ? `${livro.titulo} entrou como ${codigo}` : `${livro.titulo} entrou na lista de desejos`;
  };
}

/* ===== Busca de dados e capas ===== */

function esperar(ms) {
  return new Promise(ok => setTimeout(ok, ms));
}

async function obterJSON(url, { tempo = 12000, tentativas = 3 } = {}) {
  for (let tentativa = 1; ; tentativa++) {
    const controle = new AbortController();
    const timer = setTimeout(() => controle.abort(), tempo);
    let resposta;
    try {
      resposta = await fetch(url, { signal: controle.signal });
    } catch (e) {
      e.rede = true;
      throw e;
    } finally {
      clearTimeout(timer);
    }
    if (resposta.status === 404) return null;
    if (resposta.status === 429 && tentativa < tentativas) {
      await esperar(1500 * tentativa);
      continue;
    }
    if (!resposta.ok) {
      const erro = new Error('HTTP ' + resposta.status);
      erro.status = resposta.status;
      try {
        const corpo = await resposta.json();
        const detalhe = corpo && (corpo.error || corpo.message);
        erro.detalhe = typeof detalhe === 'string' ? detalhe : (detalhe && detalhe.message) || '';
      } catch (e) { erro.detalhe = ''; }
      throw erro;
    }
    return await resposta.json();
  }
}

function isbn10De(isbn) {
  if (!/^978\d{10}$/.test(isbn || '')) return null;
  const base = isbn.slice(3, 12);
  const soma = [...base].reduce((s, c, i) => s + Number(c) * (10 - i), 0);
  const dv = (11 - (soma % 11)) % 11;
  return base + (dv === 10 ? 'X' : String(dv));
}

function imagemCarrega(url, tempo = 9000) {
  return new Promise(resolver => {
    const img = new Image();
    const timer = setTimeout(() => resolver(false), tempo);
    img.onload = () => { clearTimeout(timer); resolver(img.naturalWidth >= 40 && img.naturalHeight >= 40); };
    img.onerror = () => { clearTimeout(timer); resolver(false); };
    img.referrerPolicy = 'no-referrer';
    img.src = url;
  });
}

/* ----- Caixa de títulos, nomes e editoras ----- */

const PALAVRAS_MINUSCULAS = new Set(['a', 'à', 'ao', 'aos', 'as', 'às', 'com', 'da', 'das', 'de', 'do', 'dos', 'e', 'em', 'na', 'nas', 'no', 'nos', 'o', 'os', 'ou', 'para', 'pela', 'pelas', 'pelo', 'pelos', 'por', 'sem', 'sob', 'sobre', 'um', 'uma', 'umas', 'uns', 'que', 'se', 'of', 'the', 'and']);
const PARTICULAS_NOME = new Set(['de', 'da', 'das', 'do', 'dos', 'e', 'du', 'van', 'von', 'der', 'den', 'del', 'di']);

function ajustarTitulo(texto) {
  const limpo = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!limpo) return '';
  const tudoMaiusculo = limpo === limpo.toLocaleUpperCase('pt-BR') && /[A-ZÀ-Þ]/.test(limpo);
  let inicio = true;
  return limpo.split(' ').map(palavra => {
    const eraInicio = inicio;
    inicio = /[:.!?–—]$/.test(palavra) || palavra === '-';
    const letras = palavra.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g, '');
    if (!letras) return palavra;
    if (palavra.includes('&')) return palavra.toLocaleUpperCase('pt-BR');
    const minuscula = letras === letras.toLocaleLowerCase('pt-BR');
    const maiuscula = letras === letras.toLocaleUpperCase('pt-BR');
    if (!minuscula && !(maiuscula && tudoMaiusculo)) return palavra;
    if (maiuscula && !eraInicio && /^(X{0,3})(IX|IV|V?I{0,3})$/.test(letras)) return palavra;
    const base = palavra.toLocaleLowerCase('pt-BR');
    if (!eraInicio && PALAVRAS_MINUSCULAS.has(base.replace(/[^a-zà-öø-ÿ]/g, ''))) return base;
    return base.replace(/[a-zà-öø-ÿ]/, l => l.toLocaleUpperCase('pt-BR'));
  }).join(' ');
}

function ajustarNome(texto) {
  const limpo = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!limpo || (limpo !== limpo.toLocaleUpperCase('pt-BR') && limpo !== limpo.toLocaleLowerCase('pt-BR'))) return limpo;
  return limpo.split(' ').map((parte, i) => {
    const base = parte.toLocaleLowerCase('pt-BR');
    if (i > 0 && PARTICULAS_NOME.has(base)) return base;
    return base.replace(/(^|[-'’.])([a-zà-öø-ÿ])/g, (m, antes, letra) => antes + letra.toLocaleUpperCase('pt-BR'));
  }).join(' ');
}

function autorDeTexto(texto, papel = 'autor') {
  const bruto = String(texto || '').replace(/\s+/g, ' ').trim();
  const invertido = bruto.match(/^([^,]+),\s*([^,]+)$/);
  if (invertido) {
    const sobrenome = ajustarNome(invertido[1]);
    return { nome: `${ajustarNome(invertido[2])} ${sobrenome}`, papel, sobrenome };
  }
  const nome = ajustarNome(bruto);
  return { nome, papel, sobrenome: sugerirSobrenome(nome) };
}

const PAPEIS_POR_PALAVRA = [
  [/tradu|trad\./i, 'traducao'],
  [/ilustra|ilust\./i, 'ilustracao'],
  [/adapta/i, 'adaptacao'],
  [/organiza|org\.|coordena|editor/i, 'organizacao'],
  [/autor/i, 'autor'],
];

function autoresDeTexto(texto, papelPadrao = 'autor') {
  return String(texto || '')
    .split(/\s*;\s*|\s*\|\s*|\s+\/\s+|\s+&\s+/)
    .map(parte => {
      let nome = parte.trim();
      let papel = papelPadrao;
      const comPapel = nome.match(/^(.*?)\s*[([]\s*([^)\]]+?)\s*[)\]]\s*$/);
      if (comPapel) {
        const achado = PAPEIS_POR_PALAVRA.find(([re]) => re.test(comPapel[2]));
        if (achado) papel = achado[1];
        nome = comPapel[1];
      }
      nome = nome.replace(/,?\s*\d{4}\s*-\s*(\d{4})?\s*$/, '').replace(/[\s,;.]+$/, '').trim();
      return nome ? autorDeTexto(nome, papel) : null;
    })
    .filter(Boolean);
}

function chaveNome(nome) {
  return normalizar(nome).replace(/[^a-z]/g, '');
}

function autorConhecido(autor) {
  if (!dados || !autor || !autor.nome) return autor;
  const alvo = chaveNome(autor.nome);
  for (const livro of dados.livros) {
    for (const a of livro.autores || []) {
      if (a.nome && chaveNome(a.nome) === alvo) return { ...autor, nome: a.nome, sobrenome: a.sobrenome || autor.sobrenome };
    }
  }
  return autor;
}

const SIGLAS_EDITORAS = { lpm: 'L&PM', ftd: 'FTD', jbc: 'JBC', ltc: 'LTC', dvs: 'DVS', sesc: 'Sesc', senac: 'Senac', edusp: 'Edusp', unesp: 'Unesp' };

function limparEditora(texto) {
  let t = String(texto || '').replace(/\s+/g, ' ').trim();
  t = t.replace(/[*•#]+/g, '').replace(/\b(ltda|eireli|s\/?a|s\.a\.|me)\.?$/i, '').replace(/[\s,;.\-–]+$/, '').trim();
  if (!t) return '';
  t = ajustarTitulo(t);
  return t.split(' ').map(p => SIGLAS_EDITORAS[normalizar(p)] || p).join(' ');
}

function anoDeTexto(valor) {
  const achado = String(valor ?? '').match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return achado ? Number(achado[1]) : null;
}

function paginasDeValor(valor) {
  const n = parseInt(valor, 10);
  return n > 0 && n < 20000 ? n : null;
}

function isbnValido(bruto) {
  const d = String(bruto || '').replace(/[^0-9xX]/g, '').toUpperCase();
  if (/^\d{13}$/.test(d)) return [...d].reduce((s, c, i) => s + Number(c) * (i % 2 ? 3 : 1), 0) % 10 === 0;
  if (/^\d{9}[\dX]$/.test(d)) return [...d].reduce((s, c, i) => s + (c === 'X' ? 10 : Number(c)) * (10 - i), 0) % 11 === 0;
  return false;
}

/* ----- Série e volume ----- */

function pareceColecaoEditorial(nome) {
  return /(^|\s)(cole[cç][aã]o|cl[aá]ssicos?|pocket|biblioteca|grandes (obras|nomes|autores|livros)|obras? (completas|primas|escolhidas|essenciais)|literatura|vaga-?lume|para gostar de ler|edi[cç][aã]o|livros? de bolso|best ?bolso|penguin|folha|l&pm|box)(\s|$)/i.test(nome || '');
}

function normalizarSerie(nome, volume, autores = []) {
  const serie = String(nome || '')
    .replace(/\s*\([^)]*\)\s*$/, '')
    .replace(/[\s;,#:–—-]+$/, '')
    .replace(/^(s[ée]rie|series|saga)\s+/i, '')
    .trim();
  const numero = parseInt(volume, 10);
  if (!serie || !(numero > 0 && numero < 1000) || pareceColecaoEditorial(serie)) return null;
  if (autores.some(a => a.nome && normalizar(a.nome) === normalizar(serie))) return null;
  return { serie: ajustarTitulo(serie), volume: numero };
}

function serieDeTexto(texto) {
  const achado = String(texto || '').trim().match(/^(.*?)[\s,;:(–—-]*(?:#|n[º°o]\.?|v\.|vol\.?|volume|book|livro|tomo|parte)?\s*(\d{1,3})\)?\s*$/i);
  return achado && achado[1].trim() ? { nome: achado[1].trim(), volume: Number(achado[2]) } : null;
}

function serieDoTitulo(titulo) {
  const t = String(titulo || '').trim();
  const estiloGoodreads = t.match(/^(.+?)\s*\(([^()]+?),?\s*#\s*(\d{1,3})\)\s*$/);
  if (estiloGoodreads) return { titulo: estiloGoodreads[1].trim(), nome: estiloGoodreads[2].trim(), volume: Number(estiloGoodreads[3]) };
  const marcador = t.match(/^(.+?)\s*[,:(–—-]\s*(?:vol(?:ume)?\.?|livro|tomo|parte)\s*(\d{1,3})\)?\s*$/i) || t.match(/^(.+?)\s+(?:vol\.|volume)\s*(\d{1,3})\s*$/i);
  if (marcador) return { titulo: t, nome: marcador[1].trim(), volume: Number(marcador[2]) };
  return null;
}

function chaveGoogle() {

async function consultarMercadoEditorial(isbn) {
  const r = await obterJSON(`https://api.mercadoeditorial.org/api/v1.2/book?isbn=${isbn}`, { tempo: 10000, tentativas: 1 });
  const b = r && Array.isArray(r.books) && r.books[0];
  if (!b || !b.titulo) return null;
  const texto = v => (v && typeof v === 'object' ? (v.nome || v.descricao || v.nome_fantasia || '') : String(v ?? '')).trim();
  const papelDe = c => {
    const tipo = normalizar(texto(c.codigo_contribuicao ?? c.tipo_de_contribuicao ?? c.tipo_contribuicao ?? c.contribuicao ?? c.tipo ?? c.codigo ?? ''));
    if (!tipo) return 'autor';
    if (/^(1|4|28)$/.test(tipo) || /autor|instituic|espirito/.test(tipo)) return 'autor';
    if (/^(2|3|5)$/.test(tipo) || /organiza|coordena|^editor$/.test(tipo)) return 'organizacao';
    if (tipo === '8' || /ilustra/.test(tipo)) return 'ilustracao';
    if (tipo === '9' || /tradu/.test(tipo)) return 'traducao';
    if (tipo === '25' || /adapta/.test(tipo)) return 'adaptacao';
    return null;
  };
  const temPapeis = (b.contribuicao || []).some(c => c.codigo_contribuicao ?? c.tipo_de_contribuicao ?? c.tipo_contribuicao ?? c.tipo ?? c.codigo);
  const autores = (b.contribuicao || []).map(c => {
    const papel = papelDe(c);
    if (!papel) return null;
    const sobrenome = ajustarNome(c.sobrenome || '');
    if (c.nome && sobrenome) return { nome: `${ajustarNome(c.nome)} ${sobrenome}`, papel, sobrenome };
    return autorDeTexto(c.nome || c.nome_completo || '', papel);
  }).filter(a => a && a.nome);
  const encadernacao = normalizar(texto(b.encadernacao));
  let formato = '';
  if (String(b.formato || '').toUpperCase() === 'EBOOK') formato = 'e-book';
  else if (/^(5|6)$/.test(encadernacao) || /capa dura/.test(encadernacao)) formato = 'capa-dura';
  else if (/^(1|2|7)$/.test(encadernacao) || /brochura/.test(encadernacao)) formato = 'brochura';
  const imagens = b.imagens && b.imagens.imagem_primeira_capa;
  return {
    fonte: 'Mercado Editorial', direto: true, comPapeis: temPapeis,
    titulo: b.titulo, autores,
    editora: limparEditora(texto(b.selo_editorial) || texto(b.editora)),
    ano: anoDeTexto(b.ano_edicao) || anoDeTexto(b.data_de_publicacao),
    paginas: paginasDeValor((b.medidas && b.medidas.paginas) ?? b.paginas),
    serieBruta: texto(b.colecao) ? { nome: texto(b.colecao), volume: b.volume_colecao ?? b.volume } : null,
    formato,
    capas: imagens ? [imagens.grande, imagens.media, imagens.pequena].filter(Boolean) : [],
  };
}

async function consultarBrasilAPI(isbn, provedor, fonte) {
  const r = await obterJSON(`https://brasilapi.com.br/api/isbn/v1/${isbn}?providers=${provedor}`, { tempo: 12000 });
  if (!r || !r.title) return null;
  return {
    fonte,
    titulo: r.title,
    autores: (r.authors || []).filter(Boolean).flatMap(a => autoresDeTexto(a)),
    editora: limparEditora(r.publisher),
    ano: anoDeTexto(r.year),
    paginas: paginasDeValor(r.page_count),
    formato: provedor === 'mercado-editorial' && r.format === 'DIGITAL' ? 'e-book' : '',
    capas: r.cover_url ? [r.cover_url] : [],
  };
}

async function consultarOpenLibrary(isbn) {
  const r = await obterJSON(`https://openlibrary.org/isbn/${isbn}.json`, { tempo: 10000, tentativas: 1 });
  if (!r || !r.title) return null;
  const chaves = (r.authors || []).map(a => a && a.key).filter(Boolean).slice(0, 3);
  const nomes = await Promise.all(chaves.map(k => obterJSON(`https://openlibrary.org${k}.json`, { tempo: 8000, tentativas: 1 }).then(a => (a && (a.personal_name || a.name)) || '').catch(() => '')));
  const formatoFisico = normalizar(r.physical_format || '');
  return {
    fonte: 'Open Library',
    titulo: r.title,
    autores: nomes.filter(Boolean).flatMap(n => autoresDeTexto(n)),
    editora: limparEditora((r.publishers || [])[0]),
    ano: anoDeTexto(r.publish_date),
    paginas: paginasDeValor(r.number_of_pages),
    serieBruta: (r.series || []).map(serieDeTexto).find(Boolean) || null,
    formato: /hardcover|capa dura/.test(formatoFisico) ? 'capa-dura' : /paperback|brochura/.test(formatoFisico) ? 'brochura' : /e-?book|digital/.test(formatoFisico) ? 'e-book' : '',
    capas: (r.covers || []).filter(id => id > 0).slice(0, 1).map(id => `https://covers.openlibrary.org/b/id/${id}-L.jpg`),
  };
}

function registrarErroGoogle(e) {
  const chave = chaveGoogle();
  if (e.status === 429) {
    estado.googleIndisponivel = true;
    estado.erroGoogle = chave ? 'A cota diária da chave do Google Books acabou; ele volta a responder amanhã.' : '';
  } else if (e.status === 400 || e.status === 403) {
    estado.googleIndisponivel = true;
    estado.erroGoogle = chave ? explicarErroGoogle(e) : '';
  }
}

function explicarErroGoogle(e) {
  const detalhe = String(e.detalhe || '');
  if (e.rede) return 'Sem conexão com o Google agora.';
  if (e.status === 400) return 'O Google recusou a chave: ela parece inválida. Confira se copiou a chave inteira.';
  if (e.status === 403 && /refer/i.test(detalhe)) return 'A chave do Google tem restrição de sites. Como o programa roda a partir de um arquivo, deixe a restrição de aplicativos como Nenhuma e limite só a Books API.';
  if (e.status === 403 && /(not been used|disabled|SERVICE_DISABLED|has not been enabled)/i.test(detalhe)) return 'A Books API não está ativada no projeto dessa chave. No Google Cloud, ative a Books API em APIs e serviços.';
  if (e.status === 403) return `O Google recusou a chave (${detalhe || 'acesso negado'}).`;
  if (e.status === 429) return 'A cota diária da chave do Google Books acabou; ele volta a responder amanhã.';
  return `O Google respondeu com erro ${e.status || ''}${detalhe ? `: ${detalhe}` : ''}.`;
}

function urlGoogle(caminho) {
  const chave = chaveGoogle();
  return `https://www.googleapis.com/books/v1/${caminho}${chave ? `${caminho.includes('?') ? '&' : '?'}key=${encodeURIComponent(chave)}` : ''}`;
}

function edicaoDoGoogle(item) {
  const v = (item && item.volumeInfo) || {};
  const ids = v.industryIdentifiers || [];
  const isbn13 = (ids.find(i => i.type === 'ISBN_13') || {}).identifier || '';
  const isbn10 = (ids.find(i => i.type === 'ISBN_10') || {}).identifier || '';
  const links = v.imageLinks || {};
  const capa = (links.large || links.medium || links.thumbnail || links.smallThumbnail || '').replace(/^http:/, 'https:').replace('&edge=curl', '');
  return {
    fonte: 'Google Books',
    id: item && item.id,
    isbn: normalizarISBN(isbn13 || isbn10) || '',
    titulo: v.title || '',
    autores: (v.authors || []).flatMap(a => autoresDeTexto(a)),
    editora: limparEditora(v.publisher),
    ano: anoDeTexto(v.publishedDate),
    paginas: paginasDeValor(v.printedPageCount || v.pageCount),
    volumeSerie: (v.seriesInfo && parseInt(v.seriesInfo.bookDisplayNumber, 10)) || null,
    formato: '',
    capas: capa ? [capa] : [],
  };
}

async function consultarGoogleBooks(isbn) {
  const chave = chaveGoogle();
  if (estado.googleIndisponivel && (!chave || estado.erroGoogle)) return null;
  let r;
  try {
    r = await obterJSON(urlGoogle(`volumes?q=isbn:${isbn}&maxResults=5`), { tentativas: chave ? 3 : 1 });
  } catch (e) {
    registrarErroGoogle(e);
    throw e;
  }
  const itens = (r && r.items) || [];
  if (!itens.length) return null;
  const isbn10 = isbn10De(isbn);
  const exato = itens.find(item => ((item.volumeInfo || {}).industryIdentifiers || []).some(i => i.identifier === isbn || (isbn10 && i.identifier === isbn10)));
  let item = exato || itens[0];
  if (chave && item.id) {
    try {
      const detalhe = await obterJSON(urlGoogle(`volumes/${encodeURIComponent(item.id)}`), { tentativas: 2 });
      if (detalhe && detalhe.volumeInfo) item = detalhe;
    } catch (e) { /* segue com o resultado da busca */ }
  }
  const edicao = edicaoDoGoogle(item);
  return edicao.titulo ? edicao : null;
}

async function serieNoWikidata(titulo, autores) {
  const sobrenomes = autores.filter(a => a.papel === 'autor' && a.nome).map(a => normalizar(a.sobrenome || sugerirSobrenome(a.nome))).filter(s => s.length > 2);
  if (!titulo || !sobrenomes.length) return null;
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
  const limpar = t => normalizar(semArtigo(t)).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const alvo = limpar(titulo);
  const busca = await obterJSON(`${api}action=wbsearchentities&language=pt&uselang=pt&type=item&limit=8&search=${encodeURIComponent(titulo)}`, { tempo: 8000, tentativas: 1 });
  const ids = ((busca && busca.search) || [])
    .filter(item => [item.label, item.match && item.match.text, ...(item.aliases || [])].filter(Boolean).some(t => limpar(t) === alvo))
    .map(item => item.id).slice(0, 6);
  if (!ids.length) return null;
  const entidades = {};
  const carregar = async lista => {
    const faltam = [...new Set(lista)].filter(id => id && !entidades[id]).slice(0, 45);
    if (!faltam.length) return;
    const r = await obterJSON(`${api}action=wbgetentities&props=claims${encodeURIComponent('|')}labels&languages=${encodeURIComponent('pt|pt-br|en')}&ids=${encodeURIComponent(faltam.join('|'))}`, { tempo: 8000, tentativas: 1 });
    Object.assign(entidades, (r && r.entities) || {});
  };
  const item = declaracao => declaracao && declaracao.mainsnak && declaracao.mainsnak.datavalue && declaracao.mainsnak.datavalue.value && declaracao.mainsnak.datavalue.value.id;
  await carregar(ids);
  await carregar(ids.map(id => entidades[id]).filter(e => e && e.claims && !e.claims.P179 && e.claims.P629).map(e => item(e.claims.P629[0])));
  const candidatos = [];
  for (const id of ids) {
    let e = entidades[id];
    if (!e || !e.claims) continue;
    if (!e.claims.P179 && e.claims.P629) e = entidades[item(e.claims.P629[0])] || e;
    const declaracao = ((e.claims && e.claims.P179) || []).find(item);
    if (!declaracao) continue;
    const ordinal = declaracao.qualifiers && declaracao.qualifiers.P1545 && declaracao.qualifiers.P1545[0] && declaracao.qualifiers.P1545[0].datavalue;
    const volume = parseInt(ordinal && ordinal.value, 10);
    if (!(volume > 0)) continue;
    candidatos.push({ serie: item(declaracao), volume, autores: (e.claims.P50 || []).map(item).filter(Boolean) });
  }
  if (!candidatos.length) return null;
  await carregar(candidatos.flatMap(c => [c.serie, ...c.autores]));
  const rotulo = id => { const l = (entidades[id] || {}).labels || {}; return (l.pt || l['pt-br'] || l.en || {}).value || ''; };
  for (const c of candidatos) {
    const nomes = c.autores.map(rotulo).map(normalizar);
    if (nomes.some(n => sobrenomes.some(s => n.includes(s))) && rotulo(c.serie)) return { nome: rotulo(c.serie), volume: c.volume };
  }
  return null;
}

/* ----- Junção dos resultados ----- */

function escolherAutores(lista) {
  const confiaveis = ['Google Books', 'Open Library'];
  const comPapeis = lista.find(r => r.comPapeis && r.autores.length);
  const limpa = confiaveis.map(f => lista.find(r => r.fonte === f && r.autores.length)).find(Boolean);
  const incertas = lista.filter(r => !r.comPapeis && !confiaveis.includes(r.fonte) && r.autores.length);
  let autores = [];
  let fonte = null;
  let aviso = '';
  if (comPapeis) {
    autores = comPapeis.autores;
    fonte = comPapeis.fonte;
    if (limpa) {
      const principais = autores.filter(a => a.papel === 'autor').map(a => chaveNome(a.nome));
      const doLimpo = limpa.autores.map(a => chaveNome(a.nome));
      if (!principais.some(k => doLimpo.includes(k))) {
        autores = [...limpa.autores.map(a => ({ ...a })), ...autores.filter(a => a.papel !== 'autor')];
        fonte = limpa.fonte;
      }
    }
  } else if (limpa) {
    autores = limpa.autores.map(a => ({ ...a }));
    fonte = limpa.fonte;
  } else if (incertas.length) {
    const r = incertas[0];
    autores = [{ ...r.autores[0], papel: 'autor' }];
    fonte = r.fonte;
    const extras = [...new Set(incertas.flatMap(x => x.autores.slice(1).map(a => a.nome)))]
      .filter(n => chaveNome(n) !== chaveNome(autores[0].nome));
    if (extras.length) aviso = `A base também listou ${juntarNomes(extras)}, sem dizer se ${extras.length === 1 ? 'é autor, tradutor ou ilustrador' : 'são autores, tradutores ou ilustradores'}; adicione em Autoria se for o caso.`;
  }
  const vistos = new Set();
  autores = autores.map(autorConhecido).filter(a => {
    const k = chaveNome(a.nome) + a.papel;
    if (!a.nome || vistos.has(k)) return false;
    vistos.add(k);
    return true;
  });
  return { autores, fonte, aviso };
}

function combinarRegistros(registros) {
  if (!registros.length) return null;
  const prioridade = ['Mercado Editorial', 'CBL', 'Google Books', 'Open Library'];
  const lista = [...registros].sort((a, b) => (prioridade.indexOf(a.fonte) - prioridade.indexOf(b.fonte)) || ((b.direto ? 1 : 0) - (a.direto ? 1 : 0)));
  const fontes = new Set();
  const primeiro = (campo, valido = v => !!v) => {
    const r = lista.find(x => valido(x[campo]));
    if (!r) return null;
    fontes.add(r.fonte);
    return r[campo];
  };
  const tituloBruto = primeiro('titulo') || '';
  const doTitulo = serieDoTitulo(tituloBruto);
  const titulo = ajustarTitulo(doTitulo && doTitulo.titulo ? doTitulo.titulo : tituloBruto);
  const escolha = escolherAutores(lista);
  if (escolha.fonte) fontes.add(escolha.fonte);
  const autores = escolha.autores;
  let serie = null;
  for (const r of lista) {
    if (!r.serieBruta) continue;
    serie = normalizarSerie(r.serieBruta.nome, r.serieBruta.volume, autores);
    if (serie) { fontes.add(r.fonte); break; }
  }
  if (!serie && doTitulo) serie = normalizarSerie(doTitulo.nome, doTitulo.volume, autores);
  return {
    titulo,
    autores,
    avisoAutores: escolha.aviso,
    editora: limparEditora(primeiro('editora') || ''),
    ano: primeiro('ano'),
    paginas: primeiro('paginas'),
    serie,
    volumeSerie: primeiro('volumeSerie'),
    formato: primeiro('formato') || '',
    capas: [...new Set(lista.flatMap(r => r.capas || []))],
    fontes,
  };
}

async function buscarMetadados(isbn) {
  const brasileiro = /^978(65|85)\d{8}$/.test(isbn);
  const comChave = !!chaveGoogle();
  let tentativas = 0, falhasDeRede = 0;
  const tentar = async consulta => {
    tentativas++;
    try { return await consulta(); } catch (e) { if (e.rede) falhasDeRede++; return null; }
  };
  const primeiraRodada = [tentar(() => consultarOpenLibrary(isbn))];
  if (brasileiro) {
    primeiraRodada.push(tentar(() => consultarMercadoEditorial(isbn)));
    primeiraRodada.push(tentar(() => consultarBrasilAPI(isbn, 'cbl', 'CBL')));
    primeiraRodada.push(tentar(() => consultarBrasilAPI(isbn, 'mercado-editorial', 'Mercado Editorial')));
  }
  if (comChave) primeiraRodada.push(tentar(() => consultarGoogleBooks(isbn)));
  let registros = (await Promise.all(primeiraRodada)).filter(Boolean);
  let achado = combinarRegistros(registros);
  const faltaAlgo = !achado || !achado.editora || !achado.ano || !achado.paginas || !achado.autores.length;
  if (faltaAlgo) {
    const segundaRodada = [];
    if (!comChave) segundaRodada.push(tentar(() => consultarGoogleBooks(isbn)));
    if (brasileiro) segundaRodada.push(tentar(() => consultarBrasilAPI(isbn, 'google-books', 'Google Books')));
    if (segundaRodada.length) {
      registros = registros.concat((await Promise.all(segundaRodada)).filter(Boolean));
      achado = combinarRegistros(registros);
    }
  }
  return { achado, falhaDeRede: !achado && tentativas > 0 && falhasDeRede === tentativas };
}

async function primeiraImagemValida(urls) {
  const candidatos = urls.filter(urlCapaSegura);
  if (!candidatos.length) return '';
  const resultados = await Promise.all(candidatos.map(u => imagemCarrega(u)));
  const i = resultados.indexOf(true);
  return i >= 0 ? candidatos[i] : '';
}

async function buscarCapa(isbn, extras = []) {
  const isbn10 = isbn10De(isbn);
  if (isbn10) {
    const amazon = await primeiraImagemValida([
      `https://images-na.ssl-images-amazon.com/images/P/${isbn10}.01.LZZZZZZZ.jpg`,
      `https://m.media-amazon.com/images/P/${isbn10}.01.LZZZZZZZ.jpg`,
    ]);
    if (amazon) return amazon;
  }
  const outras = [...extras, `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`];
  if (isbn10) outras.push(`https://covers.openlibrary.org/b/isbn/${isbn10}-M.jpg?default=false`);
  return primeiraImagemValida(outras);
}

function linkBuscaCapa({ titulo, autores, isbn }) {
  const autor = ((autores || []).find(a => a.nome) || {}).nome || '';
  const termos = [titulo, autor, 'livro capa', isbn].filter(Boolean).join(' ');
  return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(termos);
}

function fonteDaCapa(url) {
  if (/amazon/.test(url)) return 'Amazon';
  if (/openlibrary/.test(url)) return 'Open Library';
  if (/google/.test(url)) return 'Google Books';
  return 'Mercado Editorial';
}

async function preencherPorISBN(form, { automatico = false } = {}) {
  const status = form.querySelector('[data-isbn-status]');
  const campo = nome => form.querySelector(`[name="${nome}"]`);
  const isbn = normalizarISBN(campo('isbn').value);
  if (!isbn) {
    if (!automatico) status.textContent = 'Digite um ISBN com 10 ou 13 dígitos.';
    return;
  }
  if (estado.formulario.buscandoIsbn === isbn) return;
  estado.formulario.buscandoIsbn = isbn;
  estado.erroGoogle = '';
  form.dataset.ultimoIsbn = isbn;
  status.textContent = 'Buscando dados e capa…';
  try {
    const precisaCapa = !estado.formulario.capa;
    const [meta, capaDireta] = await Promise.all([buscarMetadados(isbn), precisaCapa ? buscarCapa(isbn) : Promise.resolve('')]);
    if (!form.isConnected || normalizarISBN(campo('isbn').value) !== isbn) return;
    const r = meta.achado;
    let capa = capaDireta;
    if (precisaCapa && !capa && r && r.capas.length) capa = await primeiraImagemValida(r.capas);

    const preenchidos = [];
    const sugestoes = {};
    const marcar = nome => { const c = campo(nome); if (c) c.closest('.campo').classList.add('auto'); };
    const aplicar = (nome, valor, rotulo) => {
      if (valor === null || valor === undefined || valor === '') return;
      const atual = campo(nome).value.trim();
      if (!atual) {
        campo(nome).value = valor;
        marcar(nome);
        if (rotulo && !preenchidos.includes(rotulo)) preenchidos.push(rotulo);
      } else if (normalizar(atual) !== normalizar(String(valor))) {
        sugestoes[nome] = valor;
      }
    };

    if (r) {
      aplicar('titulo', r.titulo, 'título');
      const autoresAtuais = lerAutores(form);
      if (r.autores.length && !autoresAtuais.length) {
        form.querySelector('[data-autores]').innerHTML = r.autores.map(autorLinhaHTML).join('');
        form.querySelectorAll('[data-autores] .campo').forEach(c => c.classList.add('auto'));
        preenchidos.push('autoria');
      }
      aplicar('editora', r.editora, 'editora');
      aplicar('ano', r.ano, 'ano');
      aplicar('paginas', r.paginas, 'páginas');

      let serie = r.serie;
      if (!serie && !campo('serie').value.trim()) {
        try {
          const wd = await serieNoWikidata(campo('titulo').value.trim() || r.titulo, lerAutores(form).length ? lerAutores(form) : r.autores);
          if (wd) {
            serie = normalizarSerie(wd.nome, wd.volume, r.autores);
            if (serie) r.fontes.add('Wikidata');
          }
        } catch (e) { /* sem série */ }
        if (!form.isConnected) return;
      }
      if (serie) {
        aplicar('serie', serie.serie, 'série');
        aplicar('volume', serie.volume, 'volume');
      }
      if (r.formato && !form.dataset.formatoTocado && estado.formulario.novo && campo('formato').value !== r.formato) {
        campo('formato').value = r.formato;
        marcar('formato');
        preenchidos.push('formato');
      }
    }
    campo('isbn').value = formatarISBN(isbn);
    if (capa) {
      estado.formulario.capa = capa;
      preenchidos.push('capa');
    }
    atualizarPreviaCapa(form);
    estado.formulario.sugestoes = sugestoes;

    const fontes = r ? [...r.fontes] : [];
    const faltando = r ? [['editora', 'editora'], ['ano', 'ano'], ['paginas', 'páginas']].filter(([nome]) => !campo(nome).value.trim()).map(([, rotulo]) => rotulo) : [];
    const qtdSugestoes = Object.keys(sugestoes).length;
    let texto;
    if (!r && !capa) {
      texto = meta.falhaDeRede
        ? 'Sem conexão com a busca de livros agora. Preencha os dados à mão ou tente mais tarde.'
        : 'Esse ISBN não foi encontrado nas bases consultadas. Preencha os dados à mão e use Buscar na internet para a capa.';
    } else {
      texto = preenchidos.length ? `Preenchido: ${juntarNomes(preenchidos)}.` : 'Nenhum campo em branco para preencher.';
      if (faltando.length) texto += ` Não encontrado: ${juntarNomes(faltando)}.`;
      if (r && !capa && precisaCapa) texto += ' Sem capa nas bases: use Buscar na internet.';
      if (fontes.length) texto += ` ${fontes.length === 1 ? 'Fonte' : 'Fontes'}: ${juntarNomes(fontes)}.`;
      if (capa) texto += ` Capa: ${fonteDaCapa(capa)}.`;
      if (r && r.avisoAutores && preenchidos.includes('autoria')) texto += ` ${r.avisoAutores}`;
    }
    if (estado.erroGoogle) {
      texto += ` ${estado.erroGoogle}`;
    }
    status.innerHTML = esc(texto) + (qtdSugestoes ? ` <button type="button" class="link" data-acao="aplicar-sugestoes">Trocar também ${qtdSugestoes === 1 ? '1 campo que já estava preenchido' : `${qtdSugestoes} campos que já estavam preenchidos`}</button>` : '');
  } finally {
    estado.formulario.buscandoIsbn = null;
  }
}

function aplicarSugestoes(form) {
  const sugestoes = (estado.formulario && estado.formulario.sugestoes) || {};
  for (const [nome, valor] of Object.entries(sugestoes)) {
    const campo = form.querySelector(`[name="${nome}"]`);
    if (!campo) continue;
    campo.value = valor;
    campo.closest('.campo').classList.add('auto');
  }
  estado.formulario.sugestoes = {};
  const botao = form.querySelector('[data-acao="aplicar-sugestoes"]');
  if (botao) botao.replaceWith(document.createTextNode('Campos trocados pelos dados encontrados.'));
  atualizarPreviaCapa(form);
}

function reduzirImagem(origem) {
  return new Promise((ok, erro) => {
    const desenhar = src => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, 300 / img.width, 450 / img.height);
        const tela = document.createElement('canvas');
        tela.width = Math.max(1, Math.round(img.width * escala));
        tela.height = Math.max(1, Math.round(img.height * escala));
        const ctx = tela.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, tela.width, tela.height);
        ctx.drawImage(img, 0, 0, tela.width, tela.height);
        ok(tela.toDataURL('image/jpeg', 0.84));
      };
      img.onerror = () => erro(new Error('imagem inválida'));
      img.src = src;
    };
    if (typeof origem === 'string') { desenhar(origem); return; }
    const leitor = new FileReader();
    leitor.onload = () => desenhar(leitor.result);
    leitor.onerror = () => erro(leitor.error);
    leitor.readAsDataURL(origem);
  });
}

async function prepararCapa(conteudo) {
  if (typeof conteudo === 'string') {
    const texto = conteudo.trim();
    if (/^data:image\//i.test(texto)) return reduzirImagem(texto);
    if (!urlCapaSegura(texto) || !(await imagemCarrega(texto))) throw new Error('imagem inválida');
    return texto;
  }
  if (!conteudo || !String(conteudo.type || '').startsWith('image/')) throw new Error('não é imagem');
  return reduzirImagem(conteudo);
}

async function aplicarCapaNoFormulario(form, conteudo) {
  const status = form.querySelector('[data-capa-status]');
  status.textContent = 'Carregando imagem…';
  try {
    estado.formulario.capa = await prepararCapa(conteudo);
    atualizarPreviaCapa(form);
    status.textContent = 'Capa aplicada.';
  } catch (e) {
    status.textContent = 'Não foi possível usar essa imagem. Copie a própria imagem (botão direito, Copiar imagem).';
  }
}

async function lerAreaDeTransferencia() {
  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('sem suporte');
  const itens = await navigator.clipboard.read();
  for (const item of itens) {
    const tipo = item.types.find(t => t.startsWith('image/'));
    if (tipo) return item.getType(tipo);
  }
  for (const item of itens) {
    if (item.types.includes('text/plain')) {
      const texto = (await (await item.getType('text/plain')).text()).trim();
      if (/^(https?:\/\/\S+|data:image\/\S+)$/i.test(texto)) return texto;
    }
  }
  return null;
}

async function aplicarCapaColada(id, conteudo) {
  const l = livroPorId(id);
  if (!l) return;
  situacaoCapa(id, 'Carregando imagem…');
  let capa;
  try {
    capa = await prepararCapa(conteudo);
  } catch (e) {
    situacaoCapa(id, 'Não foi possível usar essa imagem. Copie a própria imagem (botão direito, Copiar imagem).');
    return;
  }
  estado.capasQuebradas.delete(id);

  const item = document.querySelector(`#modal [data-item-capa="${CSS.escape(id)}"]`);
  if (item) {
    item.querySelector('.item-sem-capa-capa').innerHTML = capaHTML(l, 'pequena mini');
    item.classList.add('resolvido');
  }
  situacaoCapa(id, 'Capa adicionada.');
}

/* ===== Completar capas e dados em lote ===== */

async function completarDados() {
  const alvos = dados.livros.filter(l => l.isbn);
  if (!alvos.length) { abrirRevisao(); return; }
  estado.lote = { cancelado: false };
  estado.erroGoogle = '';
  abrirModal({
    titulo: 'Completar capas e dados',
    classe: 'pequeno',
    corpo: `<p data-lote-texto>Preparando…</p>
      <div class="progresso progresso-lote"><span data-lote-barra style="width:0%"></span></div>
      <p class="detalhe">Consulta Google Books${chaveGoogle() ? '' : ' (sem chave, costuma recusar)'}, Mercado Editorial, CBL, Open Library e Amazon pelo ISBN de cada livro. Só preenche o que está em branco e troca capas que não carregam.</p>`,
    rodape: '<button type="button" class="botao" data-acao="cancelar-lote">Parar</button>',
  });
  const fila = [...alvos];
  const resultados = new Map();
  const semResposta = [];
  let feitos = 0;
  let consultasSemRede = 0;
  let algumaImagemCarregou = false;

  const mostrarProgresso = titulo => {
    const texto = document.querySelector('[data-lote-texto]');
    const barra = document.querySelector('[data-lote-barra]');
    if (texto) texto.textContent = `${feitos} de ${alvos.length} consultados. Último: ${titulo}`;
    if (barra) barra.style.width = `${(feitos / alvos.length) * 100}%`;
  };

  const trabalhar = async () => {
    while (fila.length && !estado.lote.cancelado) {
      const l = fila.shift();
      const r = {};
      try {
        let capaFunciona = false;
        if (urlCapaSegura(l.capa)) {
          capaFunciona = l.capa.startsWith('data:') || await imagemCarrega(l.capa);
          if (capaFunciona) algumaImagemCarregou = true;
        }
        const faltam = { editora: !l.editora, ano: !l.ano, paginas: !l.paginas, autores: !autorPrincipal(l), formato: !l.formato && l.posse !== 'desejo' };
        const precisaDados = Object.values(faltam).some(Boolean);
        const [meta, capaDireta] = await Promise.all([
          precisaDados ? buscarMetadados(l.isbn) : Promise.resolve({ achado: null, falhaDeRede: false }),
          capaFunciona ? Promise.resolve('') : buscarCapa(l.isbn),
        ]);
        if (meta.falhaDeRede) consultasSemRede++;
        const a = meta.achado;
        if (precisaDados && !a) semResposta.push(l.id);
        if (a) {
          if (faltam.editora && a.editora) r.editora = a.editora;
          if (faltam.ano && a.ano) r.ano = a.ano;
          if (faltam.paginas && a.paginas) r.paginas = a.paginas;
          if (faltam.autores && a.autores.length) r.autores = a.autores;
          if (faltam.formato && a.formato) r.formato = a.formato;
        }
        if (!capaFunciona) {
          let capa = capaDireta;
          if (!capa && a && a.capas.length) capa = await primeiraImagemValida(a.capas);
          if (capa) { r.capa = capa; algumaImagemCarregou = true; }
          else if (l.capa && !l.capa.startsWith('data:')) r.capaQuebrada = true;
        }
      } catch (e) {
        consultasSemRede++;
      }
      if (Object.keys(r).length) resultados.set(l.id, r);
      feitos++;
      mostrarProgresso(l.titulo);
      await esperar(250);
    }
  };
  await Promise.all([trabalhar(), trabalhar()]);

  const contagem = { capa: 0, editora: 0, ano: 0, paginas: 0, autores: 0, formato: 0 };
  let removidas = 0;
  const houveMudanca = [...resultados.values()].some(r => Object.keys(r).some(k => k !== 'capaQuebrada') || (r.capaQuebrada && algumaImagemCarregou));
  if (houveMudanca) {
    alterar(() => {
      for (const [id, r] of resultados) {
        const l = livroPorId(id);
        if (!l) continue;
        if (r.capa) { l.capa = r.capa; estado.capasQuebradas.delete(id); contagem.capa++; }
        else if (r.capaQuebrada && algumaImagemCarregou) { l.capa = ''; removidas++; }
        for (const k of ['editora', 'ano', 'paginas', 'formato']) if (r[k] && !l[k]) { l[k] = r[k]; contagem[k]++; }
        if (r.autores && !autorPrincipal(l)) { l.autores = r.autores; contagem.autores++; }
      }
    });
  }

  const rotulos = { capa: ['capa', 'capas'], editora: ['editora', 'editoras'], ano: ['ano', 'anos'], paginas: ['número de páginas', 'números de páginas'], autores: ['autoria', 'autorias'], formato: ['formato', 'formatos'] };
  const preenchidos = Object.entries(contagem).filter(([, n]) => n).map(([k, n]) => plural(n, rotulos[k][0], rotulos[k][1]));
  let resumo;
  if (!preenchidos.length && consultasSemRede >= Math.min(3, alvos.length) && !algumaImagemCarregou) {
    resumo = 'Não foi possível consultar as bases de livros agora. Confira a conexão com a internet e tente de novo.';
  } else {
    resumo = preenchidos.length ? `Preenchido agora: ${juntarNomes(preenchidos)}.` : 'Nenhum dado novo encontrado nas bases.';
    if (removidas) resumo += ` ${plural(removidas, 'capa que não carregava foi removida', 'capas que não carregavam foram removidas')}.`;
    if (semResposta.length) resumo += ` ${plural(semResposta.length, 'ISBN não foi encontrado', 'ISBNs não foram encontrados')} em nenhuma base: use Procurar edição.`;
    if (estado.erroGoogle) resumo += ` ${estado.erroGoogle}`;
    if (houveMudanca && !gravaSozinho()) resumo += ' Use Salvar para gravar no arquivo.';
    if (estado.lote.cancelado) resumo = 'Consulta interrompida. ' + resumo;
  }
  abrirRevisao({ resumo });
}

/* ===== Procurar edição por título e autor ===== */

function edicaoDaOpenLibrary(e, obra) {
  const isbn = normalizarISBN((e.isbn_13 || [])[0] || (e.isbn_10 || [])[0]) || '';
  return {
    fonte: 'Open Library',
    isbn,
    titulo: e.title || (obra && obra.title) || '',
    autores: ((obra && obra.author_name) || []).flatMap(n => autoresDeTexto(n)),
    editora: limparEditora((e.publishers || [])[0]),
    ano: anoDeTexto(e.publish_date),
    paginas: paginasDeValor(e.number_of_pages),
    capas: (e.covers || []).filter(c => c > 0).slice(0, 1).map(c => `https://covers.openlibrary.org/b/id/${c}-M.jpg`),
  };
}

async function procurarEdicoes(livro) {
  const autor = autorPrincipal(livro);
  const sobrenome = autor ? (autor.sobrenome || sugerirSobrenome(autor.nome)) : '';
  const alvo = chaveNome(semArtigo(livro.titulo));
  const lista = [];
  let falhas = 0;
  if (chaveGoogle() || !estado.googleIndisponivel) {
    try {
      const q = `intitle:${livro.titulo}${sobrenome ? ` inauthor:${sobrenome}` : ''}`;
      const r = await obterJSON(urlGoogle(`volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books`), { tentativas: 2 });
      for (const item of (r && r.items) || []) lista.push(edicaoDoGoogle(item));
    } catch (e) {
      registrarErroGoogle(e);
      falhas++;
    }
  }
  try {
    const r = await obterJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(livro.titulo)}${sobrenome ? `&author=${encodeURIComponent(sobrenome)}` : ''}&limit=3&fields=key,title,author_name`, { tentativas: 1 });
    for (const obra of ((r && r.docs) || []).slice(0, 2)) {
      const ed = await obterJSON(`https://openlibrary.org${obra.key}/editions.json?limit=40`, { tentativas: 1 });
      for (const e of (ed && ed.entries) || []) {
        const idiomas = (e.languages || []).map(x => x.key);
        if (idiomas.length && !idiomas.includes('/languages/por')) continue;
        lista.push(edicaoDaOpenLibrary(e, obra));
      }
    }
  } catch (e) {
    falhas++;
  }
  const vistos = new Set();
  const filtrada = lista.filter(ed => {
    const k = chaveNome(semArtigo(ed.titulo));
    if (!k || !(k.includes(alvo) || alvo.includes(k))) return false;
    if (!(ed.isbn || ed.editora || ed.ano || ed.paginas)) return false;
    const chave = ed.isbn || `${k}|${chaveNome(ed.editora)}|${ed.ano}|${ed.paginas}`;
    if (vistos.has(chave)) return false;
    vistos.add(chave);
    return true;
  });
  const pontos = ed => (chaveNome(semArtigo(ed.titulo)) === alvo ? 4 : 0) + (ed.isbn ? 2 : 0) + (ed.paginas ? 1 : 0) + (ed.capas.length ? 1 : 0);
  return { edicoes: filtrada.sort((a, b) => pontos(b) - pontos(a)).slice(0, 15), semConexao: !lista.length && falhas >= 2 };
}

async function abrirProcurarEdicao(id) {
  const l = livroPorId(id);
  if (!l) return;
  const voltarRevisao = estado.voltarPara === 'revisao' || !!document.querySelector('#modal[open] .lista-revisao');
  estado.edicoes = { id, lista: [], voltarRevisao };
  estado.erroGoogle = '';
  abrirModal({
    titulo: 'Procurar edição',
    subtitulo: `${esc(l.titulo)}${nomesAutores(l) ? `, ${esc(nomesAutores(l))}` : ''}`,
    corpo: '<p class="detalhe" data-edicoes-status>Procurando edições no Google Books e na Open Library…</p><ul class="lista-edicoes" data-edicoes></ul>',
    rodape: `${voltarRevisao ? '<button type="button" class="botao esquerda" data-acao="revisar-dados">Voltar à revisão</button>' : ''}<button type="button" class="botao primario" data-acao="fechar-modal">Fechar</button>`,
  });
  const { edicoes, semConexao } = await procurarEdicoes(l);
  const status = document.querySelector('[data-edicoes-status]');
  const alvo = document.querySelector('[data-edicoes]');
  if (!status || !alvo || estado.edicoes.id !== id) return;
  estado.edicoes.lista = edicoes;
  if (!edicoes.length) {
    status.textContent = semConexao
      ? 'Sem conexão com as bases de livros agora. Tente de novo mais tarde.'
      : `Nenhuma edição encontrada com esse título e autor.${estado.erroGoogle ? ` ${estado.erroGoogle}` : ''} Se tiver o livro em mãos, o ISBN costuma estar na contracapa ou na ficha catalográfica.`;
    return;
  }
  const faltam = ['isbn', 'editora', 'ano', 'paginas'].filter(k => !l[k]);
  status.textContent = `Escolha a edição que você tem. Serão preenchidos só os campos em branco${faltam.length ? ` (${juntarNomes(faltam.map(k => ({ isbn: 'ISBN', editora: 'editora', ano: 'ano', paginas: 'páginas' })[k]))})` : ''} e a capa, se faltar.${estado.erroGoogle ? ` ${estado.erroGoogle}` : ''}`;
  alvo.innerHTML = edicoes.map((ed, i) => `<li class="edicao">
      <div class="edicao-capa">${ed.capas.length ? `<img src="${esc(ed.capas[0])}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</div>
      <div>
        <p class="edicao-titulo">${esc(ajustarTitulo(ed.titulo))}</p>
        <p class="detalhe">${esc(ed.autores.map(a => a.nome).join(', ') || 'Autor não informado')}</p>
        <p class="detalhe">${esc([ed.editora, ed.ano, ed.paginas ? `${ed.paginas} páginas` : ''].filter(Boolean).join(', ') || 'Sem editora, ano ou páginas')}</p>
        <p class="detalhe">${ed.isbn ? `ISBN ${esc(ed.isbn)}` : 'Sem ISBN'}, fonte: ${esc(ed.fonte)}</p>
      </div>
      <button type="button" class="botao pequeno" data-acao="usar-edicao" data-indice="${i}">Usar esta edição</button>
    </li>`).join('');
}

async function usarEdicao(indice) {
  const { id, lista, voltarRevisao } = estado.edicoes || {};
  const l = livroPorId(id);
  const ed = lista && lista[indice];
  if (!l || !ed) return;
  let capa = '';
  if ((!urlCapaSegura(l.capa) || estado.capasQuebradas.has(l.id)) && ed.capas.length) capa = await primeiraImagemValida(ed.capas);
  if (!capa && (!urlCapaSegura(l.capa) || estado.capasQuebradas.has(l.id)) && ed.isbn) capa = await buscarCapa(ed.isbn);
  const preenchidos = [];
  alterar(() => {
    if (!l.isbn && !l.semIsbn && ed.isbn) { l.isbn = ed.isbn; preenchidos.push('ISBN'); }
    if (!l.editora && ed.editora) { l.editora = ed.editora; preenchidos.push('editora'); }
    if (!l.ano && ed.ano) { l.ano = ed.ano; preenchidos.push('ano'); }
    if (!l.paginas && ed.paginas) { l.paginas = ed.paginas; preenchidos.push('páginas'); }
    if (capa) { l.capa = capa; estado.capasQuebradas.delete(l.id); preenchidos.push('capa'); }
  }, { mensagem: preenchidos.length ? `${l.titulo}: ${juntarNomes(preenchidos)} preenchido${preenchidos.length > 1 ? 's' : ''}` : `${l.titulo}: nada em branco para preencher` });
  if (voltarRevisao) abrirRevisao();
  else abrirLivro(id);
}

function enviarTerminar(form) {
  const l = livroPorId(estado.formulario.id);
  const fim = form.querySelector('[name="fim"]').value;
  if (!dataValida(fim)) { form.querySelector('[data-erro-form]').textContent = 'Informe a data de término.'; return; }
  if (l.inicio && fim < l.inicio) { form.querySelector('[data-erro-form]').textContent = 'O término não pode ser antes do início.'; return; }
  const nota = Number(form.querySelector('[name="nota"]').value) || null;
  alterar(() => Object.assign(l, { status: 'lido', fim, nota }), { mensagem: `${l.titulo} marcado como lido` });
  fecharModal();
}

function abrirComecarLeitura(id, { releitura = false } = {}) {
  const l = livroPorId(id);
  estado.formulario = { id, releitura };
  abrirModal({
    titulo: releitura ? 'Registrar releitura' : 'Começar leitura',
    subtitulo: esc(l.titulo),
    classe: 'pequeno',
    formulario: 'comecar',
    corpo: `${releitura ? '<p>A leitura anterior fica guardada no histórico do livro e continua contando nas estatísticas.</p>' : ''}
      <div class="campos" style="margin-top:12px"><label class="campo c6"><span>Início</span><input type="date" name="inicio" value="${hojeISO()}" required></label></div>`,
    rodape: `<button type="button" class="botao" data-acao="fechar-modal">Cancelar</button><button type="submit" class="botao primario">${releitura ? 'Registrar releitura' : 'Começar leitura'}</button>`,
  });
}

function enviarComecar(form) {
  const { id, releitura } = estado.formulario;
  const l = livroPorId(id);
  const inicio = form.querySelector('[name="inicio"]').value;
  if (!dataValida(inicio)) return;
  alterar(() => {
    if (releitura && l.status === 'lido') l.releituras.push({ inicio: l.inicio, fim: l.fim, nota: l.nota });
    Object.assign(l, { status: 'lendo', inicio, fim: null, nota: releitura ? null : l.nota });
  }, { mensagem: `Leitura de ${l.titulo} iniciada` });
  fecharModal();
}

/* ===== Empréstimos ===== */

function abrirEmprestar(id) {
  const disponiveis = livrosOrdenadosPorCodigo('fisico').filter(l => !l.emprestimos.some(e => !e.devolvido));
  if (!disponiveis.length) { avisar('Todos os seus livros físicos já estão emprestados.'); return; }
  const escolhido = id && disponiveis.some(l => l.id === id) ? id : '';
  abrirModal({
    titulo: 'Emprestar um livro seu',
    classe: 'pequeno',
    formulario: 'emprestar',
    corpo: `<div class="campos">
        <label class="campo c6"><span>Livro</span><select name="livro" required>${escolhido ? '' : '<option value="">Escolha um livro</option>'}${disponiveis.map(l => `<option value="${esc(l.id)}"${l.id === escolhido ? ' selected' : ''}>${esc(codigoDe(l))}. ${esc(l.titulo)}</option>`).join('')}</select></label>
        <label class="campo c6"><span>Para quem</span><input type="text" name="pessoa" list="pessoas-conhecidas" required></label>
        <label class="campo c3"><span>Data</span><input type="date" name="data" value="${hojeISO()}"></label>
        <label class="campo c3"><span>Devolver até</span><input type="date" name="devolver"></label>
      </div>${pessoasDatalist()}<p class="mensagem-erro" data-erro-form></p>`,
    rodape: '<button type="button" class="botao" data-acao="fechar-modal">Cancelar</button><button type="submit" class="botao primario">Registrar empréstimo</button>',
  });
}

function enviarEmprestar(form) {
  const erro = form.querySelector('[data-erro-form]');
  const l = livroPorId(form.querySelector('[name="livro"]').value);
  const pessoa = form.querySelector('[name="pessoa"]').value.trim();
  if (!l) { erro.textContent = 'Escolha o livro.'; return; }
  if (!pessoa) { erro.textContent = 'Informe para quem o livro foi emprestado.'; return; }
  alterar(() => l.emprestimos.push({
    id: novoId('e'), tipo: 'emprestei', pessoa,
    data: form.querySelector('[name="data"]').value || null,
    devolverAte: form.querySelector('[name="devolver"]').value || null,
    devolvido: false, devolvidoEm: null,
  }), { mensagem: `${l.titulo} emprestado para ${pessoa}` });
  fecharModal();
}

function abrirDevolucao(id, empId) {
  const l = livroPorId(id);
  const emp = l && l.emprestimos.find(e => e.id === empId);
  if (!emp) return;
  estado.formulario = { id, empId };

/* ===== Ligação com o OneDrive ===== */

const ONEDRIVE_ESCOPOS = 'Files.ReadWrite offline_access User.Read';
const ONEDRIVE_CHAVE = 'minha-biblioteca:onedrive';

function lerSessaoOneDrive() {
  try { return JSON.parse(localStorage.getItem(ONEDRIVE_CHAVE) || '{}'); } catch (e) { return {}; }
}

function guardarSessaoOneDrive(novo) {
  const atual = lerSessaoOneDrive();
  try { localStorage.setItem(ONEDRIVE_CHAVE, JSON.stringify({ ...atual, ...novo })); } catch (e) { /* ignora */ }
}

function limparSessaoOneDrive() {
  try { localStorage.removeItem(ONEDRIVE_CHAVE); } catch (e) { /* ignora */ }
}

function idDoAplicativo() {
  return (lerSessaoOneDrive().clientId || ONEDRIVE_CLIENT_ID || '').trim();
}

function autoridadeOneDrive() {
  return lerSessaoOneDrive().autoridade || 'consumers';
}

function enderecoDeRetorno() {
  return location.origin + location.pathname.replace(/index\.html?$/i, '');
}

function oneDriveLigado() {
  const s = lerSessaoOneDrive();
  return !!(s.token || s.refresh);
}

function base64url(bytes) {
  let texto = '';
  bytes.forEach(b => { texto += String.fromCharCode(b); });
  return btoa(texto).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function gerarPkce() {
  const verificador = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const resumo = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verificador));
  return { verificador, desafio: base64url(new Uint8Array(resumo)) };
}

async function conectarOneDrive() {
  if (!idDoAplicativo()) {
    avisar('Informe o ID do aplicativo da Microsoft em Configurações antes de conectar.');
    return;
  }
  const { verificador, desafio } = await gerarPkce();
  const marca = base64url(crypto.getRandomValues(new Uint8Array(12)));
  try {
    sessionStorage.setItem('minha-biblioteca:aba', estado.aba);
    sessionStorage.setItem('minha-biblioteca:pkce', JSON.stringify({ verificador, marca }));
  } catch (e) {
    avisar('O navegador bloqueou o armazenamento necessário para o login.');
    return;
  }
  const parametros = new URLSearchParams({
    client_id: idDoAplicativo(),
    response_type: 'code',
    redirect_uri: enderecoDeRetorno(),
    response_mode: 'query',
    scope: ONEDRIVE_ESCOPOS,
    state: marca,
    code_challenge: desafio,
    code_challenge_method: 'S256',
    prompt: 'select_account',
  });
  location.assign(`https://login.microsoftonline.com/${autoridadeOneDrive()}/oauth2/v2.0/authorize?${parametros}`);
}

function limparEnderecoDoLogin() {
  if (location.search) history.replaceState(null, '', enderecoDeRetorno());
}

async function trocarPorToken(extra) {
  const corpo = new URLSearchParams({
    client_id: idDoAplicativo(),
    scope: ONEDRIVE_ESCOPOS,
    ...extra,
  });
  const resposta = await fetch(`https://login.microsoftonline.com/${autoridadeOneDrive()}/oauth2/v2.0/token`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: corpo,
  });
  const dadosToken = await resposta.json().catch(() => ({}));
  if (!resposta.ok) {
    const erro = new Error(dadosToken.error_description || 'falha no login');
    erro.oauth = dadosToken.error;
    throw erro;
  }
  guardarSessaoOneDrive({
    token: dadosToken.access_token,
    refresh: dadosToken.refresh_token || lerSessaoOneDrive().refresh,
    expiraEm: Date.now() + Math.max(60, (dadosToken.expires_in || 3600) - 120) * 1000,
  });
  return dadosToken.access_token;
}

async function tokenDoOneDrive() {
  const s = lerSessaoOneDrive();
  if (s.token && Date.now() < (s.expiraEm || 0)) return s.token;
  if (!s.refresh) return null;
  try {
    return await trocarPorToken({ grant_type: 'refresh_token', refresh_token: s.refresh });
  } catch (e) {
    guardarSessaoOneDrive({ token: null, expiraEm: 0, refresh: null });
    estado.erroOneDrive = 'A ligação com o OneDrive expirou. Toque em Conectar de novo.';
    return null;
  }
}

async function processarRetornoDoLogin() {
  const parametros = new URLSearchParams(location.search);
  if (parametros.get('error')) {
    estado.erroOneDrive = `A Microsoft recusou o login: ${parametros.get('error_description') || parametros.get('error')}`;
    limparEnderecoDoLogin();
    return;
  }
  const codigo = parametros.get('code');
  if (!codigo) return;
  let guardado = {};
  try { guardado = JSON.parse(sessionStorage.getItem('minha-biblioteca:pkce') || '{}'); } catch (e) { /* ignora */ }
  sessionStorage.removeItem('minha-biblioteca:pkce');
  limparEnderecoDoLogin();
  if (!guardado.verificador || guardado.marca !== parametros.get('state')) {
    estado.erroOneDrive = 'A resposta do login não confere. Tente conectar de novo.';
    return;
  }
  try {
    await trocarPorToken({
      grant_type: 'authorization_code',
      code: codigo,
      code_verifier: guardado.verificador,
      redirect_uri: enderecoDeRetorno(),
    });
    estado.erroOneDrive = '';
    const conta = await chamarGraph('/me?$select=displayName,userPrincipalName').catch(() => null);
    if (conta) guardarSessaoOneDrive({ conta: conta.userPrincipalName || conta.displayName || '' });
    estado.recemConectado = true;
  } catch (e) {
    estado.erroOneDrive = `Não foi possível concluir o login: ${e.message}`;
  }
}

async function chamarGraph(caminho, opcoes = {}) {
  const token = await tokenDoOneDrive();
  if (!token) throw Object.assign(new Error('sem ligação'), { semLigacao: true });
  const resposta = await fetch(`https://graph.microsoft.com/v1.0${caminho}`, {
    ...opcoes,
    headers: { Authorization: `Bearer ${token}`, ...(opcoes.headers || {}) },
  });
  if (resposta.status === 401) {
    guardarSessaoOneDrive({ token: null, expiraEm: 0 });
    throw Object.assign(new Error('autorização expirada'), { semLigacao: true });
  }
  if (!resposta.ok) {
    const corpo = await resposta.json().catch(() => ({}));
    const erro = new Error((corpo.error && corpo.error.message) || `erro ${resposta.status}`);
    erro.status = resposta.status;
    throw erro;
  }
  if (opcoes.texto) return resposta.text();
  if (resposta.status === 204) return null;
  return resposta.json();
}

function tamanhoLegivel(bytes) {
  const kb = Math.round((bytes || 0) / 1024);
  return kb > 1024 ? `${numero(kb / 1024, 1)} MB` : `${numero(kb)} KB`;
}

function guardarItens(itens) {
  estado.itensOneDrive = new Map(itens.map(i => [i.id, i]));
}

function abrirEscolhaDeArquivo() {

async function abrirNavegadorOneDrive(pasta) {
  const atual = pasta || estado.pastaOneDrive || { id: 'root', nome: 'OneDrive', trilha: [] };
  estado.pastaOneDrive = atual;
  const trilha = [...atual.trilha.map(t => t.nome), atual.nome].join(' › ');
  abrirModal({
    titulo: 'Escolher o arquivo no OneDrive',
    subtitulo: esc(trilha),
    corpo: `<div class="barra" style="margin-bottom:10px">
        <input type="search" placeholder="Procurar pelo nome" data-busca-onedrive aria-label="Procurar arquivo no OneDrive">
        <button type="button" class="botao pequeno" data-acao="procurar-onedrive">Procurar</button>
      </div>
      <p class="detalhe" data-pasta-status>Abrindo…</p>
      <ul class="lista-revisao" data-itens-onedrive></ul>`,
    rodape: `${atual.trilha.length ? '<button type="button" class="botao esquerda" data-acao="voltar-pasta-onedrive">Voltar</button>' : ''}<button type="button" class="botao" data-acao="criar-arquivo-onedrive">Criar arquivo novo</button><button type="button" class="botao primario" data-acao="fechar-modal">Fechar</button>`,
  });
  try {
    const caminho = atual.id === 'root' ? '/me/drive/root/children' : `/me/drive/items/${atual.id}/children`;
    const r = await chamarGraph(`${caminho}?$select=id,name,folder,file,size,lastModifiedDateTime,eTag&$top=200`);
    const todos = r.value || [];
    const pastas = todos.filter(i => i.folder).sort((a, b) => colador.compare(a.name, b.name));
    const arquivos = todos.filter(i => !i.folder && /\.html?$/i.test(i.name)).sort((a, b) => colador.compare(a.name, b.name));
    guardarItens([...pastas, ...arquivos]);
    mostrarItensOneDrive(pastas, arquivos, todos.length);
  } catch (e) {
    const status = document.querySelector('[data-pasta-status]');
    if (status) status.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível abrir a pasta: ${e.message}`;
  }
}

function mostrarItensOneDrive(pastas, arquivos, total, buscando) {
  const status = document.querySelector('[data-pasta-status]');
  const lista = document.querySelector('[data-itens-onedrive]');
  if (!status || !lista) return;
  if (!pastas.length && !arquivos.length) {
    status.textContent = buscando
      ? 'Nada encontrado com esse nome. Lembre que arquivos criados há pouco podem demorar a aparecer na busca; nesse caso, navegue pelas pastas.'
      : total ? 'Esta pasta não tem subpastas nem arquivos .html.' : 'Esta pasta está vazia.';
    lista.innerHTML = '';
    return;
  }
  status.textContent = buscando ? 'Resultados da busca. Toque no arquivo que o aplicativo deve manter sincronizado.' : 'Abra as pastas e escolha o arquivo que o aplicativo deve manter sincronizado.';
  lista.innerHTML = [
    ...pastas.map(f => `<li class="item-revisao">
      <p class="item-revisao-titulo">${esc(f.name)}</p>
      <button type="button" class="botao pequeno" data-acao="abrir-pasta-onedrive" data-id="${esc(f.id)}">Abrir pasta</button>
    </li>`),
    ...arquivos.map(a => `<li class="item-revisao">
      <div>
        <p class="item-revisao-titulo">${esc(a.name)}</p>
        <p class="detalhe">${esc(tamanhoLegivel(a.size))}, alterado em ${esc(dataHoraBR(a.lastModifiedDateTime))}</p>
      </div>
      <button type="button" class="botao pequeno" data-acao="usar-arquivo-onedrive" data-id="${esc(a.id)}">Usar este</button>
    </li>`),
  ].join('');
}

async function procurarNoOneDrive() {
  const campo = document.querySelector('[data-busca-onedrive]');
  const termo = ((campo && campo.value) || '').trim();
  const status = document.querySelector('[data-pasta-status]');
  if (!termo) { abrirNavegadorOneDrive(estado.pastaOneDrive); return; }
  if (status) status.textContent = 'Procurando…';
  try {
    const r = await chamarGraph(`/me/drive/root/search(q='${encodeURIComponent(termo)}')?$select=id,name,size,lastModifiedDateTime,eTag,folder,file&$top=50`);
    const arquivos = (r.value || []).filter(i => !i.folder && /\.html?$/i.test(i.name));
    guardarItens(arquivos);
    mostrarItensOneDrive([], arquivos, arquivos.length, true);
  } catch (e) {
    if (status) status.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível procurar: ${e.message}`;
  }
}

function abrirPastaOneDrive(id) {
  const pasta = (estado.itensOneDrive || new Map()).get(id);
  if (!pasta) return;
  const atual = estado.pastaOneDrive || { id: 'root', nome: 'OneDrive', trilha: [] };
  abrirNavegadorOneDrive({ id: pasta.id, nome: pasta.name, trilha: [...atual.trilha, { id: atual.id, nome: atual.nome }] });

function voltarPastaOneDrive() {
  const atual = estado.pastaOneDrive;
  if (!atual || !atual.trilha.length) return;
  const anterior = atual.trilha[atual.trilha.length - 1];
  abrirNavegadorOneDrive({ id: anterior.id, nome: anterior.nome, trilha: atual.trilha.slice(0, -1) });

async function usarArquivoOneDrive(id) {
  const arquivo = (estado.itensOneDrive || new Map()).get(id);
  if (!arquivo) return;
  const atual = estado.pastaOneDrive || { trilha: [], nome: 'OneDrive' };
  const caminho = [...atual.trilha.map(t => t.nome), atual.nome].join('/');
  guardarSessaoOneDrive({ item: { id: arquivo.id, nome: arquivo.name, caminho, eTag: null } });

/* ===== Sincronização ===== */

function assinaturaLocal() {
  const texto = JSON.stringify({ livros: dados.livros, categorias: dados.categorias, metas: dados.metas, preferencias: dados.preferencias });
  return `${texto.length}:${hashTexto(texto)}`;
}

function agendarSincronizacao() {
  if (!oneDriveLigado() || !lerSessaoOneDrive().item) return;
  clearTimeout(estado.sincTimer);
  estado.sincTimer = setTimeout(() => sincronizarOneDrive({ automatico: true }), 2500);
}

async function sincronizarOneDrive({ automatico = false, primeiraVez = false } = {}) {
  const sessao = lerSessaoOneDrive();
  if (!sessao.item) {
    if (!automatico) avisar('Escolha primeiro o arquivo do OneDrive.');
    return;
  }
  if (estado.sincronizando) { estado.sincPendente = true; return; }
  if (!navigator.onLine) {
    estado.erroOneDrive = 'Sem internet agora. As alterações vão para o OneDrive quando a conexão voltar.';
    renderEstadoSalvo();
    return;
  }
  estado.sincronizando = true;
  estado.sincPendente = false;
  renderEstadoSalvo();
  try {
    const meta = await chamarGraph(`/me/drive/items/${sessao.item.id}?$select=id,name,eTag,lastModifiedDateTime,size`);
    const remotoMudou = !sessao.item.eTag || meta.eTag !== sessao.item.eTag;
    const localMudou = !sessao.assinatura || sessao.assinatura !== assinaturaLocal();
    if (primeiraVez && remotoMudou) {
      await escolherNaPrimeiraVez(meta);
    } else if (remotoMudou && !localMudou) {
      await baixarDoOneDrive(meta);
      avisar('Biblioteca atualizada com a versão do OneDrive.');
    } else if (localMudou && !remotoMudou) {
      await enviarParaOneDrive(meta);
    } else if (remotoMudou && localMudou) {
      await resolverConflito(meta);
    }
    estado.erroOneDrive = '';
    guardarSessaoOneDrive({ ultimoSync: new Date().toISOString() });
  } catch (e) {
    if (e.semLigacao) estado.erroOneDrive = 'A ligação com o OneDrive expirou. Toque em Conectar de novo.';
    else if (e.status === 404) estado.erroOneDrive = 'O arquivo não está mais no OneDrive. Escolha outro em Configurações.';
    else estado.erroOneDrive = `Não foi possível sincronizar: ${e.message}`;
  } finally {
    estado.sincronizando = false;
    renderEstadoSalvo();
    if (estado.sincPendente) {
      estado.sincPendente = false;
      agendarSincronizacao();
    }
  }
}

async function baixarDoOneDrive(meta) {
  const sessao = lerSessaoOneDrive();
  const texto = await chamarGraph(`/me/drive/items/${sessao.item.id}/content`, { texto: true });
  const novos = extrairDadosDeHTML(texto);
  const chaveAtual = chaveGoogle();
  dados = novos;
  if (!dados.preferencias.chaveGoogle && chaveAtual) dados.preferencias.chaveGoogle = chaveAtual;
  estado.codigos = calcularCodigos(dados);
  estado.capasQuebradas = new Set();
  await gravarAgora();
  guardarSessaoOneDrive({ item: { ...sessao.item, eTag: meta.eTag }, assinatura: assinaturaLocal() });
  render();
}

async function enviarParaOneDrive(meta) {
  const sessao = lerSessaoOneDrive();
  if (dados.preferencias.ultimoBackup !== hojeISO()) {
    dados.preferencias.ultimoBackup = hojeISO();
    agendarGravacao();
  }
  const documento = montarDocumento({ ...dados, salvoEm: new Date().toISOString() }, PROGRAMA_ARQUIVO.css, PROGRAMA_ARQUIVO.js);
  const novo = await chamarGraph(`/me/drive/items/${sessao.item.id}/content`, {
    method: 'PUT',
    headers: { 'Content-Type': 'text/html', 'if-match': meta.eTag },
    body: documento,
  });
  guardarSessaoOneDrive({ item: { ...sessao.item, eTag: (novo && novo.eTag) || null }, assinatura: assinaturaLocal() });
}

function escolherEntre({ titulo, texto, opcoes }) {
  return new Promise(resolver => {
    abrirModal({
      titulo,
      classe: 'pequeno',
      corpo: `<p>${esc(texto)}</p>`,
      rodape: opcoes.map((o, i) => `<button type="button" class="botao ${i === opcoes.length - 1 ? 'primario' : ''}" data-escolha="${i}">${esc(o)}</button>`).join(''),
    });
    const janela = $('#modal');
    janela.onclick = e => {
      const botao = e.target.closest('[data-escolha]');
      if (!botao) return;
      janela.onclick = null;
      fecharModal();
      resolver(Number(botao.dataset.escolha));
    };
  });
}

async function escolherNaPrimeiraVez(meta) {
  const sessao = lerSessaoOneDrive();
  if (!dados.livros.length) {
    await baixarDoOneDrive(meta);
    avisar('Biblioteca trazida do OneDrive.');
    return;
  }
  const escolha = await escolherEntre({
    titulo: 'Qual versão vale?',
    texto: `O aplicativo tem ${plural(dados.livros.length, 'livro', 'livros')} e o arquivo ${sessao.item.nome}, no OneDrive, foi alterado em ${dataHoraBR(meta.lastModifiedDateTime)}. A partir de agora os dois ficam sincronizados; escolha qual versão fica valendo.`,
    opcoes: ['Cancelar', 'Trazer a do OneDrive', 'Enviar a do aplicativo'],
  });
  if (escolha === 1) await baixarDoOneDrive(meta);
  if (escolha === 2) await enviarParaOneDrive(meta);
}

async function resolverConflito(meta) {
  const sessao = lerSessaoOneDrive();
  const escolha = await escolherEntre({
    titulo: 'Os dois lados mudaram',
    texto: `O arquivo no OneDrive foi alterado em ${dataHoraBR(meta.lastModifiedDateTime)} e o aplicativo também tem alterações. Nada foi sobrescrito ainda.`,
    opcoes: ['Decidir depois', 'Trazer a do OneDrive', 'Enviar a do aplicativo'],
  });
  if (escolha === 1) await baixarDoOneDrive(meta);
  if (escolha === 2) await enviarParaOneDrive(meta);
}

async function desligarOneDrive() {
  const ok = await confirmar({
    titulo: 'Desligar o OneDrive',
    texto: 'O aplicativo para de sincronizar e mantém a biblioteca guardada no aparelho. O arquivo no OneDrive não é apagado.',
    ok: 'Desligar',
  });

  limparSessaoOneDrive();
  estado.erroOneDrive = '';
  render();
  avisar('OneDrive desligado.');
}

function textoSituacaoOneDrive() {
  const s = lerSessaoOneDrive();
  if (!oneDriveLigado()) return 'Não conectado.';
  const partes = [`Conectado${s.conta ? ` como ${s.conta}` : ''}`];
  if (s.item) partes.push(`arquivo ${s.item.nome}${s.item.caminho ? ` em ${s.item.caminho}` : ''}`);
  else partes.push('nenhum arquivo escolhido');
  if (s.ultimoSync) partes.push(`última sincronização em ${dataHoraBR(s.ultimoSync)}`);
  return partes.join(', ') + '.';
}

async function iniciarOneDrive() {
  await processarRetornoDoLogin();
  try {
    const aba = sessionStorage.getItem('minha-biblioteca:aba');
    if (aba && estado.recemConectado) { estado.aba = aba; sessionStorage.removeItem('minha-biblioteca:aba'); }
  } catch (e) { /* ignora */ }
  if (estado.recemConectado) {
    estado.recemConectado = false;
    render();
    const s = lerSessaoOneDrive();
    if (s.item) await sincronizarOneDrive({ primeiraVez: !s.assinatura });
    else await abrirEscolhaDeArquivo();
    return;
  }
  if (oneDriveLigado() && lerSessaoOneDrive().item) await sincronizarOneDrive({ automatico: true });
  renderEstadoSalvo();
}

async function criarArquivoNoOneDrive(form) {
  const campo = form.querySelector('[name="nome"]');
  const erro = form.querySelector('[data-erro-form]');
  let nome = (campo.value || '').trim() || 'Biblioteca.html';
  if (!/\.html?$/i.test(nome)) nome += '.html';
  if (/[\\/:*?"<>|]/.test(nome)) { erro.textContent = 'O nome não pode ter os caracteres \\ / : * ? " < > |'; return; }
  erro.textContent = 'Criando…';
  try {
    const documento = montarDocumento({ ...dados, salvoEm: new Date().toISOString() }, PROGRAMA_ARQUIVO.css, PROGRAMA_ARQUIVO.js);
    const item = await chamarGraph(`/me/drive/root:/${encodeURIComponent(nome)}:/content?@microsoft.graph.conflictBehavior=rename`, {
      method: 'PUT',
      headers: { 'Content-Type': 'text/html' },
      body: documento,
    });
    guardarSessaoOneDrive({
      item: { id: item.id, nome: item.name, caminho: 'raiz do OneDrive', eTag: item.eTag || null },
      assinatura: assinaturaLocal(),
      ultimoSync: new Date().toISOString(),
    });
    estado.erroOneDrive = '';
    fecharModal();
    render();
    avisar(`${item.name} criado no OneDrive e ligado ao aplicativo.`);
  } catch (e) {
    erro.textContent = e.semLigacao ? 'A ligação expirou. Feche e toque em Conectar de novo.' : `Não foi possível criar: ${e.message}`;
  }
}
